<title>Logistic Town</title>
<style>
:root{
  --bg:#0e131d; --panel:#151c29; --panel2:#1b2433; --line:#2a3548; --text:#eef2f8; --muted:#8a96ad;
  --accent:#ff8a1f; --accent2:#ffb15c; --accentDim:rgba(255,138,31,.16);
  --good:#3ddc84; --bad:#ff5468; --warn:#ffc53d;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.cic{stroke:rgba(8,10,16,.65);stroke-width:.8;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.tbtn .ic{width:17px;height:17px}
.flow .fs .ic{width:16px;height:16px;margin-right:3px}
.toast .ic,.chip .ic{width:13px;height:13px}
/* fills the whole screen, also as a home-screen app (viewport-fit=cover); notch / home bar areas are kept free via safe-area insets */
#app{display:grid;grid-template-rows:58px minmax(0,1fr);grid-template-columns:300px minmax(0,1fr);position:fixed;inset:0;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#top{grid-column:1/3;display:flex;align-items:center;gap:20px;padding:0 16px;background:linear-gradient(#1a2231,#131a26);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;font-size:17px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#ff5a1f);display:grid;place-items:center;box-shadow:0 2px 10px rgba(255,138,31,.45)}
.brand .logo svg{width:18px;height:18px}
.hgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.hgroup label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hgroup b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:#0b1018;border:1px solid var(--line);overflow:hidden}
.bar > div{height:100%;border-radius:5px;transition:width .3s}
#clockGroup{width:190px}
#clockFill{background:linear-gradient(90deg,var(--accent2),var(--accent))}
#satGroup{width:170px}
#satFill{background:var(--good)}
.spacer{flex:1}
.tbtn{height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:#fff}
.tbtn.on{background:var(--accentDim);border-color:var(--accent);color:var(--accent2)}
.tbtn.off{opacity:.5}
#side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px 20px;min-height:0}
#side h3{margin:6px 2px 8px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);display:flex;justify-content:space-between}
#side h3 span{color:var(--text)}
.empty{font-size:12px;color:var(--muted);padding:10px 4px 14px;font-style:italic}
.oc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;position:relative;transition:border-color .15s,transform .1s}
.oc{cursor:pointer}
.oc:hover{transform:translateX(2px);filter:brightness(1.12)}
.oc.inbox.blocked{opacity:.6}
.oc{border-left-width:5px}
.oc.late{box-shadow:0 0 0 2px var(--bad)}
.oc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.oc-h{display:flex;align-items:center;gap:6px;font-size:12.5px}
.oc-h .sw{width:11px;height:11px;border-radius:3px;flex:none}
.oc-h .cust{color:#c9d2e3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.oc-h .due{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}
.oc-items{display:flex;gap:7px;margin:5px 0 5px;color:#e6ebf4}
.oc-items .it{display:flex;flex-direction:column;align-items:center;gap:2px}
.oc-items .it .ic{width:24px;height:24px}
.oc-items .dots{display:flex;gap:2px;height:4px}
.oc-items .dots i{width:4px;height:4px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;border:1px solid;opacity:.95}
.chip.done{color:#0e131d!important}
.chip.flag{background:var(--bad);border-color:var(--bad);color:#fff}
.tbar{height:4px;border-radius:3px;background:#0b1018;margin-top:7px;overflow:hidden}
.tbar div{height:100%}
.release-hint{position:absolute;right:9px;bottom:13px;font-size:10px;color:var(--accent2);opacity:0;transition:opacity .15s}
.oc.inbox:hover .release-hint{opacity:1}
#floor{position:relative;overflow:hidden;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* event messages live at the bottom of the left column, never over the hall */
:root{--sidew:300px}
#msgs{position:fixed;left:env(safe-area-inset-left,0px);bottom:env(safe-area-inset-bottom,0px);width:var(--sidew);padding:8px;display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none}
#toasts{display:flex;flex-direction:column;gap:5px;pointer-events:none}
/* right of the hall: newest on top, a column of messages */
#msgs.m-right{padding:0;flex-direction:column}
#msgs.m-right #toasts{flex-direction:column-reverse}
/* below the hall: tip on the left, messages next to it */
#msgs.m-bottom{padding:0;flex-direction:row;align-items:flex-start;gap:10px;overflow:hidden}
#msgs.m-bottom #tip{flex:0 1 46%;order:2}
#msgs.m-bottom #toasts{flex:1;flex-direction:column-reverse;max-width:440px}
.toast{background:rgba(21,28,41,.96);border:1px solid var(--line);border-left:4px solid var(--accent);padding:7px 10px;line-height:1.35;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .25s ease-out;transition:opacity .4s,transform .4s}
.toast.bad{border-left-color:var(--bad)} .toast.good{border-left-color:var(--good)} .toast.warn{border-left-color:var(--warn)}
.toast.out{opacity:0;transform:translateX(-10px)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#tip{position:relative;pointer-events:auto;background:linear-gradient(135deg,#2a1d10,#1d1712);border:1px solid var(--accent);border-radius:12px;padding:10px 11px 10px 44px;font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
#tip.show{display:block;animation:tin .3s ease-out}
#tip .ico{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:900;color:#1a1208}
#tip button{float:right;margin:4px 0 0 8px;background:var(--accent);color:#1a1208;border:0;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}
#tooltip{position:absolute;pointer-events:none;background:rgba(15,20,30,.97);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;z-index:7;display:none;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tooltip .tt-h{font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center}
#tooltip .row{display:flex;gap:6px;align-items:center;margin:2px 0;color:var(--muted)}
#tooltip .row.done{color:var(--good)} #tooltip .row.next{color:var(--accent2);font-weight:700}
#tooltip .fl{color:var(--bad);font-weight:700;margin-top:4px}
#tooltip .items{font-size:12px;color:var(--text);margin-bottom:4px}
#tooltip .items .ic{width:14px;height:14px;vertical-align:-3px}
#modal{position:fixed;inset:0;background:rgba(6,9,14,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#modal.hidden{display:none}
.mcard{background:linear-gradient(180deg,#1a2231,#141b27);border:1px solid var(--line);border-radius:18px;padding:26px 28px;width:min(720px,100%);margin:auto;flex:none;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.mcard h1{margin:0 0 4px;font-size:34px;letter-spacing:.5px}
.mcard h1 em{font-style:normal;color:var(--accent)}
.mcard h2{margin:0 0 6px;font-size:24px}
.mcard .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.mcard p{line-height:1.5;font-size:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:15px;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#1a1208;border:0;box-shadow:0 4px 16px rgba(255,138,31,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.scard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.4}
.scard .t{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px;font-size:14px}
.scard .t .ic{width:22px;height:22px;flex:none}
.scard.new{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,138,31,.12),var(--panel2))}
.tag{display:inline-block;font-size:10px;font-weight:800;background:var(--accent);color:#1a1208;border-radius:5px;padding:1px 6px;margin-left:auto}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0;font-size:13px}
.flow .fs{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.flow .ar{color:var(--accent)}
.goal{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px}
.goal div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.goal small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.goal b{font-size:20px}
.stars{font-size:40px;letter-spacing:6px;color:#4a5468;margin:4px 0 10px}
.stars .lit{color:var(--accent);text-shadow:0 0 18px rgba(255,138,31,.6);display:inline-block;animation:starIn .45s cubic-bezier(.3,1.6,.5,1) backwards}
.stars .lit:nth-child(1){animation-delay:2.9s}.stars .lit:nth-child(2){animation-delay:3.25s}.stars .lit:nth-child(3){animation-delay:3.6s}
@keyframes starIn{from{color:#4a5468;text-shadow:none;transform:scale(.5)}}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:var(--panel2)}
ul.clean{padding-left:18px;margin:8px 0;line-height:1.6;font-size:14px}
.shop{display:flex;flex-direction:column;gap:10px}
.shop-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.shop-h .sub{margin:0}
.cashbox{flex:none;background:var(--panel2);border:1px solid rgba(255,138,31,.45);border-radius:12px;padding:6px 14px;text-align:right}
.cashbox small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.sec{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 2px 9px;font-weight:700;font-size:15px}
.sec-h > .ic{width:24px;height:24px}
.sec-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busy{display:flex;align-items:center;gap:8px;flex:none}
.busy em{font-style:normal;font-size:11.5px;font-weight:600}
.load{position:relative;display:block;height:6px;width:90px;background:#0b1018;border-radius:3px;overflow:hidden}
.load span{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.mcard.wide{width:min(960px,100%)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));grid-auto-rows:1fr;gap:8px}
.ut{display:block;height:100%;text-align:left;border-radius:11px;padding:9px 10px;border:1px solid var(--line);background:#121925;cursor:pointer;font-size:12px;line-height:1.3;min-height:104px;transition:border-color .15s,transform .1s}
/* inner wrapper does the column layout: Safari does not size a flex <button> to its content, so the footer overflowed */
.ut-in{display:flex;flex-direction:column;gap:5px;height:100%}
.ut-in > *{flex-shrink:0}
.ut:hover:not(:disabled){border-color:var(--accent)}
.ut:active:not(:disabled){transform:scale(.98)}
.ut:disabled{cursor:default}
.ut-top{display:flex;align-items:center;gap:8px}
.ut-ic{width:32px;height:32px;flex:none;border-radius:9px;background:#1c2536;display:grid;place-items:center}
.ut-ic .ic{width:26px;height:26px}
.ut.auto .ut-ic{background:rgba(61,220,132,.12)}
.ut-name{font-weight:700;font-size:12.5px;line-height:1.2}
.ut-desc{display:block;color:#a7b1c4;font-size:11.5px}
.ut-desc::first-letter{text-transform:uppercase}
.ut-next{display:block;color:var(--muted);font-size:11px;margin-top:-2px}
.ut-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:2px}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:5px;border-radius:3px;background:#2a3446}
.pips i.on{background:var(--accent)}
.ut-price{font-weight:800;font-size:13px;color:#1a1208;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:7px;padding:2px 8px}
.ut-tag{display:flex;align-items:center;gap:4px;font-weight:700;font-size:11px}
.ut-tag .ic{width:14px;height:14px}
.ut-tag.ok{color:var(--good)}
.ut-tag.lk{color:var(--muted)}
.ut.poor .ut-price{background:none;color:var(--bad);padding:2px 0}
.ut.poor .ut-ic,.ut.poor .ut-name{opacity:.7}
.ut.maxed{background:rgba(61,220,132,.06);border-color:rgba(61,220,132,.3)}
.ut.maxed .pips i.on{background:var(--good)}
.ut.maxed .ut-desc{color:var(--muted)}

.shop-note{color:var(--muted);font-size:12.5px;margin:10px 2px 0}

.kicker{margin:0;color:var(--accent2);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px}

.stats .ic{width:16px;height:16px;color:var(--accent)}
.stats b{color:var(--text,#fff);font-size:15px}
.newbox{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.newbox .nw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--accent);background:linear-gradient(135deg,rgba(255,138,31,.14),var(--panel2));border-radius:12px;padding:9px 12px;font-size:14px;cursor:help}
.newbox .nw .tag{margin:0}
.newbox .nw .ic{width:22px;height:22px}
.newbox .br{color:#c9d1e0}
.flow.route{margin:6px 0;gap:5px}
.flow.route .fs{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:4px 8px;cursor:help}
.flow.route .or{color:var(--muted);font-size:12px}
.flow.route.sub2{margin-top:2px}
.flow .fs.info{border-style:dashed}
.flow .hint{color:var(--muted);font-size:12px;margin-left:4px}
[data-tip]{position:relative}
[data-tip].tipon{border-color:var(--accent)!important}
.tipc{display:none}
#itip{position:fixed;z-index:40;display:none;max-width:290px;background:rgba(15,20,30,.98);border:1px solid var(--accent);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.45;color:#d6dceb;box-shadow:0 10px 30px rgba(0,0,0,.55);pointer-events:none}

.cashbig{font-size:22px;font-weight:800;color:var(--accent2)}

.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}

function loopPos(s){

// Build a path: from a station (or loop position s) to a station (or a full circle when toSt is null)
function buildPath(fromSt, fromS, toSt){

function makeOrder(){
  const cfg = G.cfg;
  // customer returns arrive at Goods-in: blunt cutting tools (regrinding) or measuring tools (re-calibration)
  const r = Math.random(), gi = activeHas('goodsin');
  const type = gi && activeHas('regrind') && r < INBOUND.regrindShare ? 'regrind'
    : gi && activeHas('calib') && r < INBOUND.regrindShare + INBOUND.recalShare ? 'recal' : 'new';
  const returns = type !== 'new';
  const n = returns ? randInt(1, 2) : randInt(cfg.items[0], cfg.items[1]);
  const pallet = type === 'new' && activeHas('hbw') && Math.random() < PALLET.share;
  const pool = ITEMS.filter(i => type === 'regrind' ? i.tags.includes('cutting') : type === 'recal' ? i.tags.includes('measure') : pallet ? i.tags.includes('oversize') : SMALL(i)), items = [];
  const nItems = pallet ? 1 : n;
  for (let i=0; i<nItems && pool.length; i++) items.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  const id = ++G.seq;
  const o = { id, num:4100 + id + G.shiftIdx*100, customer:pick(CUSTOMERS), items, focus:false, steps:{},
    created:G.time, color:ORDER_COLORS[id % ORDER_COLORS.length], released:false, shipped:false, late:false, hu:null, type, pallet };
  o.focus = activeHas('care') && Math.random() < 0.28;

  o.lines = items.map(item => returns ? { item, state:'picked', slot:null } : { item, state:'stored', slot:pallet ? hbwSlot() : freeRackSlot() });
  let allow = cfg.slack;
  for (const [sid, s] of Object.entries(STEPS)){
    const stId = STEP_STATION[sid]; if (!stId || !activeHas(stId)) continue;
    if (s.want(o)){ o.steps[sid] = 'todo'; allow += DEF[stId].time + 6; }
  }
  allow += returns ? 0 : pallet ? PALLET.extraTime : 4*o.lines.length;
  o.allow = Math.round(allow); o.due = G.time + o.allow;
  G.orders.push(o);
  sfx('order');
  if (type === 'recal'){ G.inbound.push({ o });
    tip('recal', `Customer return! <b>#${o.num}</b> sent measuring tools back for <b>re-calibration</b>. After Goods-in, route it to the <b>Calibration Lab</b>. If a tool is out of tolerance there is no guarantee: it goes <b>straight back to the customer</b> (Packing), not to QA.`); return; }
  if (returns){ G.inbound.push({ o });
    tip('regrind', `Customer return! <b>#${o.num}</b> sent back blunt cutting tools. The parcel is unloaded at <b>Goods-in</b> on its own. Then route it to <b>Regrinding</b>, then the services on its card, then Packing.`); return; }
  if (pallet) tip('pallet', `Oversize order! <b>#${o.num}</b> needs a <b>${items[0].name}</b> on a Euro pallet. Its pallet is <b style="color:var(--accent)">glowing in the High-Bay Warehouse</b> (bottom). Click it: the stacker crane brings it to the pallet I/O. Pallets <b>skip Commissioning</b>: send it straight to its first service (or to Packing).`);
  if (G.cfg === SHIFTS[0] || G.shiftIdx === 0) tip('release', 'A new order arrived! Its totes are <b style="color:var(--accent)">glowing in the Shuttle Warehouse</b> (same colour as the order card). <b>Click each glowing tote</b> to send it to Commissioning.');
}

// Rack geometry of the shuttle warehouse (shared by drawing, hit-testing and retrieval)
const RACK = { aisles:2, levels:18, top:WH.y+52 };
RACK.aw = (WH.w-28)/RACK.aisles; RACK.lh = (WH.h-130)/RACK.levels;
function rackPos(sl){ const ax = WH.x+14 + sl.a*RACK.aw, rw = RACK.aw*0.34;
  return { x: ax + sl.side*(RACK.aw*0.62) + 2 + rw/2, y: RACK.top + sl.l*RACK.lh + (RACK.lh-3)/2 }; }
function freeRackSlot(){
  const used = new Set(); (G.orders||[]).forEach(o => (o.lines||[]).forEach(l => !o.pallet && l.state==='stored' && l.slot && used.add(l.slot.a+'-'+l.slot.l+'-'+l.slot.side)));
  for (let i=0; i<60; i++){ const sl = { a:randInt(0,RACK.aisles-1), l:randInt(0,RACK.levels-1), side:randInt(0,1) }; if (!used.has(sl.a+'-'+sl.l+'-'+sl.side)) return sl; }
  return { a:0, l:0, side:0 };
}
function linesDone(o){ return o.lines.filter(l => l.state==='atPick' || l.state==='picked').length; }
// Click on a glowing tote: the shuttle brings it to Commissioning. The first tote opens the order's HU there.
function retrieve(o, li){
  const line = o.lines[li]; if (!line || line.state !== 'stored' || G.mode !== 'play') return false;
  if (o.pallet){ line.state = 'queued'; G.craneJobs.push({ o, line }); hideTip('pallet'); sfx('release'); return true; }
  const c = G.st.commission;
  if (!o.hu){
    if (!hasRoom(c)){ toast('Commissioning is full. Wait for a free spot before starting a new order.', 'bad'); sfx('error'); return false; }
    o.released = true;
    const hu = { id:++G.huSeq, order:o, flag:null, loc:'queue' }; o.hu = hu; G.hus.push(hu); c.queue.push(hu);
  }
  line.state = 'queued';
  G.jobs.push({ o, line });
  hideTip('release'); sfx('release'); return true;
}
// ---- fetch robots: dock row under the racks, drive along the dock and up/down the aisles
const DOCK_Y = RACK.top + RACK.levels*RACK.lh + 10, LIFT_X = WH.x + WH.w - 24;
function aisleX(a){ return WH.x+14 + a*RACK.aw + RACK.aw*0.49; }
function robotHome(i){ return { x: WH.x + 22 + i*21, y: DOCK_Y }; }
function robotCount(){ return ROBOT.base + ((G.upgrades.warehouse||{}).fetchers || 0); }
function syncRobots(){
  G.robots = G.robots || [];
  while (G.robots.length < robotCount()){ const i = G.robots.length, h = robotHome(i); G.robots.push({ i, x:h.x, y:h.y, state:'idle', path:null, job:null, t:0, carry:false, dir:1 }); }
}
function robotGo(r, pts, next){ r.path = mkPath([{ x:r.x, y:r.y }, ...pts], -1); r.state = next; }
function updateRobots(dt){
  syncRobots();
  const sp = ROBOT.speed * (1 + 0.4*((G.upgrades.warehouse||{}).shuttle || 0)), c = G.st.commission;
  for (const r of G.robots){
    if (r.state === 'idle' || r.state === 'homing'){
      if (G.jobs.length){ // take the next job
        const job = G.jobs.shift(); if (job.line.state !== 'queued'){ continue; }
        job.line.state = 'retrieving'; r.job = job;
        const q = rackPos(job.line.slot), ax = aisleX(job.line.slot.a);
        robotGo(r, [{ x:ax, y:DOCK_Y }, { x:ax, y:q.y }], 'toSlot'); continue;
      }
    }
    if (r.path){
      const before = { x:r.x, y:r.y };
      r.path.d += sp*dt; const q = along(r.path, r.path.d); r.x = q.x; r.y = q.y;
      if (Math.abs(q.x-before.x) > 0.01) r.dir = q.x > before.x ? 1 : -1;
      if (r.path.d < r.path.len) continue;
      r.path = null;
      if (r.state === 'toSlot'){ r.state = 'grab'; r.t = ROBOT.grab; }
      else if (r.state === 'toLift'){ r.state = 'drop'; r.t = ROBOT.drop; }
      else if (r.state === 'homing'){ r.state = 'idle'; }
      continue;
    }
    if (r.state === 'grab'){ r.t -= dt; if (r.t <= 0){ r.carry = true; robotGo(r, [{ x:r.x, y:DOCK_Y }, { x:LIFT_X, y:DOCK_Y }], 'toLift'); } }
    else if (r.state === 'drop'){ r.t -= dt; if (r.t <= 0){
      r.carry = false; const job = r.job; r.job = null;
      if (c){ const cy = c.y + c.h/2; G.fetch.push({ o:job.o, line:job.line, path: mkPath([{ x:LIFT_X, y:DOCK_Y }, { x:LIFT_X, y:cy }, { x:c.x+6, y:cy }], -1) }); }
      else job.line.state = 'atPick';
      const h = robotHome(r.i); robotGo(r, [h], 'homing');
    } }
  }
}
function drawRobot(r, t){
  ctx.save(); ctx.translate(r.x, r.y);
  const busy = r.state !== 'idle', bob = busy ? Math.sin(t*22 + r.i)*0.6 : 0;
  // grab arm reaching into the rack
  if (r.state === 'grab' && r.job){ const k = 1 - r.t/ROBOT.grab, side = r.job.line.slot.side ? 1 : -1, reach = 13*Math.sin(Math.min(1,k)*Math.PI);
    ctx.fillStyle = '#9aa6bb'; ctx.fillRect(side > 0 ? 0 : -reach, -1.5, reach, 3); }
  ctx.translate(0, bob);
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1.5;
  rr(-8, -6, 16, 12, 3); ctx.fillStyle = '#ff8a1f'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#c4620b'; ctx.fillRect(-8, 3, 16, 3);
  ctx.fillStyle = '#1c2230'; ctx.fillRect(-7, 6, 4, 2); ctx.fillRect(3, 6, 4, 2);
  // face / sensor
  ctx.fillStyle = '#1d2a3d'; rr(-5 + r.dir*1.5, -4, 10, 5, 1.5); ctx.fill();
  const lamp = r.state === 'idle' ? '#3ddc84' : (Math.floor(t*6 + r.i) % 2 ? '#ffc53d' : '#fff3c4');
  ctx.fillStyle = lamp; ctx.beginPath(); ctx.arc(r.dir*2.5, -1.5, 1.3, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd9b0'; ctx.fillRect(-1, -9, 2, 3); ctx.fillStyle = lamp; ctx.fillRect(-1.5, -10, 3, 1.5);
  if (r.carry && r.job){ ctx.save(); ctx.translate(0, -12); ctx.scale(0.72, 0.72); drawTote(0, 0, r.job.o.color, r.job.line.item.icon, false, false, false); ctx.restore(); }
  ctx.restore();
}
function rackHit(p){
  const hb = hbwHit(p); if (hb) return hb;
  if (p.x < WH.x || p.x > WH.x+WH.w || p.y < WH.y || p.y > WH.y+WH.h) return null;
  let best = null, bd = 1e9;
  for (const o of G.orders) if (!o.pallet) o.lines.forEach((l, li) => { if (l.state !== 'stored') return; const q = rackPos(l.slot), d = Math.hypot(p.x-q.x, p.y-q.y); if (d < 24 && d < bd){ bd = d; best = { o, li }; } });
  return best;
}

function dispatch(hu, st){
  if (!selectable(hu) || G.mode !== 'play') return false;
  if (isPallet(hu)) return dispatchPallet(hu, st);
  if (st.def.place === 'hbw'){ toast('The High-Bay Warehouse only takes pallets.', 'bad'); sfx('error'); return false; }
  if (hu.loc === 'transit' && hu.tr.to === st.id) { G.selected = null; return true; }
  if (!hasRoom(st)){ toast(`${st.def.name} is full. Wait or choose another route.`, 'bad'); sfx('error'); return false; }
  if (hu.loc === 'out'){
    const from = G.stations.find(s => s.out.includes(hu));
    from.out.splice(from.out.indexOf(hu), 1);
    hu.tr = buildPath(from, 0, st);
  } else if (hu.loc === 'bay'){
    const q = G.bays[hu.bay]; q.units.splice(q.units.indexOf(hu), 1);
    hu.tr = buildPath(BAYS[hu.bay], 0, st); hu.bay = null;
  } else {
    if (hu.tr.to) G.st[hu.tr.to].incoming--;
    leaveBayTrip(hu);
    const p = along(hu.tr, hu.tr.d);
    hu.tr = buildPath(null, loopS(p.x, p.y), st);
  }
  hu.loc = 'transit'; st.incoming++;
  G.selected = null; sfx('dispatch'); hideTip('route'); if (hu.flag) hideTip('flag');
  return true;
}

function circle(hu, s){
  hu.loc = 'transit';
  // nearest sorting bay with room (by conveyor distance); only when every bay is full does the unit keep circling
  const L = LOOP.L; let bi = -1, bd = 1e9;
  if (G.bays) BAYS.forEach((b, i) => { const q = G.bays[i]; if (q.units.length + q.incoming >= BAY_CAP) return;
    const cw = ((b.s - s)%L + L)%L, d = Math.min(cw, L - cw); if (d < bd){ bd = d; bi = i; } });
  if (bi < 0){ hu.tr = buildPath(null, s, null); return; }
  hu.tr = buildPath(null, s, BAYS[bi]); hu.tr.bay = bi; hu.tr.to = null; G.bays[bi].incoming++;
}
function leaveBayTrip(hu){ if (hu.tr && hu.tr.bay != null){ G.bays[hu.tr.bay].incoming--; hu.tr.bay = null; } }

function portCheck(hu, st){
  let weightFail = false;
  if (!hu.kind && !hu.pallet && !hu.flag && st.def.role !== 'repair' && Math.random() < TRANSPORT_CHECK.chance){
    hu.flag = { reason:TRANSPORT_CHECK.reason, station:null }; weightFail = true; G.defects++;
    st.scanFlash = 1.2;
  }
  if (validTargets(hu).includes(st)) return true;
  st.incoming--;
  if (weightFail){
    toast(`${ico('scale')} #${hu.order.num}: weight check failed at ${st.def.name}. It parks in a sorting bay: route it to Quality Assurance.`, 'warn');
    sfx('flag'); event('flag');
  } else {
    G.wrong++; G.money -= 10; G.earned -= 10; changeSat(-3);
    const why = hu.kind ? `it belongs to ${nextHint(hu)}` : hu.flag ? 'it is flagged and must go to Quality Assurance first'
      : `next step is ${nextHint(hu)}`;
    toast(`${ico('x')} ${st.def.name} rejected ${hu.kind === 'tote' ? 'the return tote' : hu.kind === 'scrap' ? 'the defective item' : hu.kind === 'stock' ? 'the new stock' : '#'+hu.order.num}: ${why}.`, 'bad');
    floatText(st.port.x, st.port.y-14, '−$10', '#ff5468'); sfx('error'); st.flash = -1;
    tip(hu.pallet ? 'wrong_pallet' : 'wrong', hu.pallet ? 'Rejected! A station only accepts pallets that need it <b>next</b>. The transporter parks it in the <b>pallet buffer</b>: click it there and send it somewhere else.'
      : 'Rejected! A station only accepts units that need it <b>next</b>. The unit now parks in the nearest <b>sorting bay</b> inside the conveyor loop. <b>Click it there</b> and send it somewhere else.');
  }
  if (!hu.pallet) circle(hu, st.port.s);
  return false;
}

// a customer's own tool that can't be serviced (out of tolerance / worn beyond regrinding) is not a Retoure:
// skip the remaining services and send it straight back to the customer via Packing
function notOkBack(st, o, why){
  o.notOk = true; o.notOkWhy = why; for (const k of Object.keys(o.steps)) if (k !== 'pack' && o.steps[k] === 'todo') o.steps[k] = 'skip';
  floatText(st.dock.x, st.y+10, 'Not OK: back to customer', '#ffc53d'); sfx('flag');
}
function complete(st, hu){
  const d = st.def, o = hu.order;
  st.processed++;
  if (d.accepts || hu.kind) return;
  if (d.role === 'repair'){
    const f = hu.flag; hu.flag = null;
    if (f && f.line != null){
      // wrong item: send the wrong tote back to storage, the order needs a fresh tote + a re-pick
      const line = o.lines[f.line]; line.state = 'stored'; line.slot = freeRackSlot();
      const tote = { id:++G.huSeq, kind:'tote', order:o, item:line.item, flag:null, loc:'out' };
      G.hus.push(tote);
      if (st.out.length < st.outMax){ st.out.push(tote); } else circle(tote, st.port.s);
      floatText(st.dock.x, st.y+10, 'Wrong tote found', '#ffc53d'); sfx('fix');
      tip('return', `QA found the wrong item. Two jobs now: 1) route the grey <b>↩ return tote</b> back to the <b>Shuttle Warehouse</b> (key <span class="kbd">0</span>), 2) click the order's new <b style="color:var(--accent)">glowing tote</b> in the warehouse and send HU <b>#${o.num}</b> back to <b>Commissioning</b> for a re-pick.`);
      return;
    }
    if (f && d.issue && o.type === 'regrind' && !o.notOk && Math.random() < d.issue.chance){
      notOkBack(st, o, 'Worn beyond regrinding');
      toast(`${ico('warn')} #${o.num}: the customer's tool is worn out. Not a Retoure: send it straight back via Packing & Shipping.`, 'warn');
      return;
    }
    if (f && d.issue && o.type === 'new' && !o.pallet && Math.random() < d.issue.chance){
      // not fixable: the item is defective -> goes to Retoure, a replacement must be commissioned
      const li = Math.floor(Math.random()*o.lines.length), line = o.lines[li];
      line.state = 'stored'; line.slot = freeRackSlot(); o.steps.pick = 'todo';
      const scrap = { id:++G.huSeq, kind:'scrap', order:o, item:line.item, flag:null, loc:'out' };
      G.hus.push(scrap);
      if (st.out.length < st.outMax) st.out.push(scrap); else circle(scrap, st.port.s);
      floatText(st.dock.x, st.y+10, d.issue.reason + '!', '#ff5468'); sfx('flag');
      toast(`${ico('x')} #${o.num}: ${line.item.name} is defective. Send it to Retoure and commission a new one.`, 'bad');
      tip('retoure', `QA couldn't fix it: the <b>${line.item.name}</b> is defective. 1) route the <b>red box</b> to <b>Retoure</b> (next to Packing), 2) click the order's new <b style="color:var(--accent)">glowing tote</b> in the warehouse, 3) send HU <b>#${o.num}</b> back to <b>Commissioning</b>.`);
      return;
    }
    floatText(st.dock.x, st.y+10, 'Corrected ✓', '#3ddc84'); sfx('fix'); return;
  }
  const step = d.handles;
  let pickedNow = [];
  if (d.needsTotes){ o.lines.forEach((l, i) => { if (l.state === 'atPick'){ l.state = 'picked'; pickedNow.push(i); } }); }
  if (o.type === 'recal' && step === 'calibration'){
    o.steps[step] = 'done';
    if (Math.random() < INBOUND.recalFail * st.qualMul){
      // out of tolerance: no guarantee possible -> skip the remaining services, ship it straight back to the customer
      notOkBack(st, o, 'Out of tolerance');
      toast(`${ico('warn')} #${o.num}: out of tolerance, no guarantee possible. Send it straight back to the customer via Packing & Shipping (not QA).`, 'warn');
      tip('notok', `A returned measuring tool failed calibration. There is no guarantee on worn tools, so it is <b>not</b> repaired by QA: send HU <b>#${o.num}</b> straight to <b>Packing & Shipping</b>, back to the customer. You only get paid for the check.`);
    }
    return;
  }
  if (o.type === 'regrind' && step === 'regrind'){
    o.steps[step] = 'done';
    if (Math.random() < INBOUND.regrindFail * st.qualMul){
      notOkBack(st, o, 'Worn beyond regrinding');
      toast(`${ico('warn')} #${o.num}: worn beyond regrinding. It is the customer's own tool: send it straight back via Packing & Shipping (not QA, not Retoure).`, 'warn');
      tip('notok_regrind', `A returned cutting tool can't be reground any more. It belongs to the customer, so it is <b>not</b> a Retoure: send HU <b>#${o.num}</b> straight to <b>Packing & Shipping</b>, back to the customer. You only get paid for the check.`);
    }
    return;
  }
  if (d.defect && Math.random() < d.defect.chance * st.qualMul){
    hu.flag = { reason:d.defect.reason, station:d.id }; G.defects++;
    if (d.defect.returnTote && pickedNow.length) hu.flag.line = pick(pickedNow);
    o.steps[step] = d.defect.redo ? 'todo' : 'done';
    toast(`${ico('warn')} #${o.num}: ${d.defect.reason} at ${d.name}. Send it to Quality Assurance.`, 'warn');
    sfx('flag'); event('flag');
  } else o.steps[step] = 'done';
}

function ship(hu){
  const o = hu.order; o.shipped = true; hu.gone = true;
  G.hus.splice(G.hus.indexOf(hu), 1); G.orders.splice(G.orders.indexOf(o), 1);
  if (G.selected === hu) G.selected = null;
  const services = Object.keys(o.steps).filter(k => k !== 'pick' && k !== 'pack' && k !== 'receive' && o.steps[k] === 'done').length;
  let pay = 40 + 25*services; if (o.focus) pay *= 1.5;
  const late = G.time > o.due;
  if (late){ pay *= 0.4; G.lateShip++; } else { G.onTime++; changeSat(+2); }
  if (!G.hints) pay *= 1.25;
  pay = Math.round(pay);
  G.money += pay; G.earned += pay; G.shipped++;
  G.shippedLog.unshift({ num:o.num, late, pay, color:o.color }); G.shippedLog.length = Math.min(G.shippedLog.length, 5);
  const pk = G.st.pack;
  floatText(pk.x+pk.w/2, pk.y-6, `+$${pay}`, late ? '#ffc53d' : '#3ddc84');
  G.flyers.push({ x0:pk.x+pk.w/2, y0:pk.y+pk.h, x1:G.truck.x-20, y1:640, t:0, color:o.color });
  sfx('ship'); event('ship');
  if (!G.goalToast && G.shipped >= G.cfg.goal){ G.goalToast = true; toast(ico('target') + ' Shift goal reached! Everything else is bonus.', 'good'); sfx('fix'); }
}

function isReady(st, hu){
  if (!st.def.needsTotes || hu.kind || hu.pallet) return true;
  const o = hu.order; return o.lines.every(l => l.state === 'atPick' || l.state === 'picked') && o.lines.some(l => l.state === 'atPick');
}
function removeObj(hu){ hu.gone = true; const i = G.hus.indexOf(hu); if (i >= 0) G.hus.splice(i, 1); if (G.selected === hu) G.selected = null; }
function changeSat(d){
  G.sat = clamp(G.sat + d, 0, 100);
  if (G.sat <= 0 && G.mode === 'play') endShift(true);
}

function update(dt){
  if (G.mode !== 'play') return;
  G.time += dt;
  const cfg = G.cfg;
  // spawn orders
  if (G.time >= G.nextSpawn && G.time < cfg.duration - 18){
    makeOrder(); G.spawned = (G.spawned || 0) + 1;
    // early shifts open with a short burst so the hall fills up quickly, then settle to the normal rate
    const op = cfg.opening;
    G.nextSpawn = G.time + (op && G.spawned < op[0] ? op[1] : rand(cfg.spawn[0], cfg.spawn[1]));
  }
  // Goods-in: trucks unload returns and (rarely) new stock on their own
  const gi = G.st.goodsin;
  if (gi){
    G.stockT -= dt;
    if (G.stockT <= 0 && G.time < cfg.duration - 15){
      G.stockT = rand(INBOUND.stockEvery[0], INBOUND.stockEvery[1]);
      const pal = activeHas('hbw') && Math.random() < PALLET.stockShare;
      G.inbound.push({ stock:true, pallet:pal, item:pick(ITEMS.filter(i => pal ? i.tags.includes('oversize') : SMALL(i))) });
    }
    while (G.inbound.length && hasRoom(gi)){
      const d = G.inbound.shift(); let hu;
      if (d.stock && d.pallet){ hu = { id:++G.huSeq, kind:'pstock', pallet:true, item:d.item, order:{ num:'NEW', color:STOCK_COLOR, due:1e9, customer:'Supplier', steps:{} }, flag:null, loc:'queue' };
        tip('pstock', `A <b>new pallet</b> of oversize tools is being unloaded at <b>Goods-in</b>. When it's ready, send it to the <b>High-Bay Warehouse</b>: a transporter takes it there.`); }
      else if (d.stock){ hu = { id:++G.huSeq, kind:'stock', item:d.item, order:{ num:'NEW', color:STOCK_COLOR, due:1e9, customer:'Supplier', steps:{} }, flag:null, loc:'queue' };
        tip('stock', `A delivery of <b>new stock</b> (cardboard box) is being unloaded at <b>Goods-in</b>. When it's ready, route it to the <b>Shuttle Warehouse</b> (key <span class="kbd">0</span>) so it can be stored.`); }
      else { hu = { id:++G.huSeq, order:d.o, flag:null, loc:'queue' }; d.o.hu = hu; d.o.released = true; }
      G.hus.push(hu); gi.queue.push(hu);
    }
  }
  // overdue
  for (const o of G.orders){
    if (!o.late && G.time > o.due){ o.late = true; changeSat(-6); toast(`${ico('clock')} Order #${o.num} for ${o.customer} is overdue!`, 'bad'); sfx('late'); }
  }
  // transport
  for (const hu of G.hus){
    if (hu.loc !== 'transit') continue;
    const tr = hu.tr;
    tr.d += G.convSpeed * (tr.speedMul||1) * dt;
    if (tr.to && !tr.checked && tr.portAt >= 0 && tr.d >= tr.portAt){
      tr.checked = true;
      if (!portCheck(hu, G.st[tr.to])) continue;
    }
    if (tr.d >= tr.len){
      if (tr.to){ const st = G.st[tr.to]; st.incoming--; st.queue.push(hu); hu.loc = 'queue'; hu.tr = null; sfx('clunk'); }
      else if (tr.bay != null){ const q = G.bays[tr.bay]; q.incoming--; q.units.push(hu); hu.loc = 'bay'; hu.bay = tr.bay; hu.tr = null; sfx('clunk'); }
      else circle(hu, tr.loopS);
    }
  }
  // totes coming out of the shuttle warehouse
  const wu = G.upgrades.warehouse || {};
  if (wu.auto && G.st.warehouse){
    G.autoT = (G.autoT || 0) - dt;
    if (G.autoT <= 0 && !G.jobs.length){
      G.autoT = 1.4;

function endShift(failedSat){
  if (G.mode !== 'play') return;
  G.mode = 'result'; G.selected = null;
  const cfg = G.cfg, passed = !failedSat && G.shipped >= cfg.goal;
  const ratio = G.shipped ? G.onTime / G.shipped : 0;
  let stars = 0;
  if (passed){ stars = 1; if (ratio >= 0.7) stars = 2; if (ratio >= 0.9 && G.sat >= 70) stars = 3; }
  let bonus = 0;
  if (passed){ bonus = 100 + 40*stars; G.money += bonus; G.best = Math.max(G.best||0, G.shiftIdx+1); }
  // a failed shift still pays out: you keep half of what you earned (no bonus) to spend on upgrades
  const kept = passed ? 0 : Math.max(0, Math.round(G.earned * FAIL_PAYOUT));
  if (!passed) G.money = G.startMoney + kept;
  G.result = { passed, failedSat, stars, ratio, bonus, kept };
  G.lastLoad = Object.fromEntries(G.stations.map(s => [s.id, clamp(s.busyT / Math.max(1, G.time), 0, 1)]));
  if (!G.silent){ tipQueue.length = 0; hideTip(null); sfx(passed ? 'fanfare' : 'fail'); showResult(); }
}

//  HIGH-BAY PALLET WAREHOUSE, INDOOR ROADS AND TRANSPORTERS
//  Oversize tools live on Euro pallets in the high-bay warehouse (bottom). A stacker crane brings a

// ===================================================================
const ROAD = { x0:214, y0:40, x1:1336, y1:800, half:12, lane:6 };

function ringPos(R, s){

// Road route: leave the bay, drive on the right-hand lane the short way round, turn into the target bay.

function roadPath(from, to, stopShort){

const isPallet = hu => !!(hu && hu.pallet);
function resetPallets(){

}
function hbSlotPos(sl){ return { x: HB.x + 28 + sl.c*26, y: sl.r === 0 ? (sl.d ? 858 : 882) : (sl.d ? 972 : 948) }; }
function hbwSlot(){
  const used = new Set(); (G.orders||[]).forEach(o => o.pallet && o.lines.forEach(l => l.state === 'stored' && l.slot && used.add(l.slot.c+'-'+l.slot.r+'-'+l.slot.d)));

function moverCount(){ return MOVER.base + ((G.upgrades.hbw||{}).movers || 0); }
function depotPos(i){ return { x: DEPOT.x + i*DEPOT.sp, y: DEPOT.y }; }
function holdPos(i){ return { x: HOLD.x + (i%HOLD.per)*HOLD.sp, y: HOLD.y + Math.floor(i/HOLD.per)*30 }; }

function forkPos(m, ext=16){ return { x: m.x + Math.cos(m.ang)*ext, y: m.y + Math.sin(m.ang)*ext }; }

    G.movers.push({ i, x:p.x, y:p.y, ang:Math.PI/2, state:'idle', path:null, job:null, t:0, v:0, rev:0, from:null, to:null }); }

function moverGo(m, to, state, stopShort){

const palletReroutable = m => m.state === 'load' || m.state === 'toHold' || (m.state === 'toDrop' && m.path && !m.path.checked);
// Dispatch a pallet: it waits in its bay until a transporter picks it up; re-routing is allowed on the way too
function dispatchPallet(hu, st){
  if (hu.loc === 'carried'){
    if (st.def.id === 'warehouse'){ toast('The Shuttle Warehouse only takes totes. Pallets are stored in the High-Bay Warehouse.', 'bad'); sfx('error'); return false; }
    if (hu.dest === st){ G.selected = null; return true; }
    if (!hasRoom(st)){ toast(`${st.def.name} is full. Wait or choose another route.`, 'bad'); sfx('error'); return false; }
    if (hu.dest) hu.dest.incoming--;
    hu.dest = st; st.incoming++;
    const m = hu.mover; if (m && m.state !== 'load') moverGo(m, dropPoint(st), 'toDrop', 16);
    G.selected = null; sfx('dispatch'); hideTip('route'); hideTip('pallet_route'); if (hu.flag) hideTip('flag');
    return true;
  }
  if (st.def.id === 'warehouse'){ toast('The Shuttle Warehouse only takes totes. Pallets are stored in the High-Bay Warehouse.', 'bad'); sfx('error'); return false; }
  if (hu.loc === 'await' && hu.dest === st){ G.selected = null; return true; }
  if (!hasRoom(st)){ toast(`${st.def.name} is full. Wait or choose another route.`, 'bad'); sfx('error'); return false; }
  if (hu.loc === 'await' && hu.dest) hu.dest.incoming--;
  hu.dest = st; hu.loc = 'await'; st.incoming++;
  G.selected = null; sfx('dispatch'); hideTip('route'); hideTip('pallet_route'); if (hu.flag) hideTip('flag');
  return true;
}
function updateMovers(dt){

  for (const hu of G.hus){
    if (hu.loc !== 'await' || hu.mover) continue;
    const sp = palletSpot(hu); if (!sp) continue;
    const free = G.movers.filter(m => m.state === 'idle' || m.state === 'homing'); if (!free.length) break;
    free.sort((a,b) => Math.hypot(a.x-sp.x, a.y-sp.y) - Math.hypot(b.x-sp.x, b.y-sp.y));
    const m = free[0]; m.job = hu; hu.mover = m; moverGo(m, sp, 'toPick', 16);
  }
  for (const m of G.movers){
    if (m.path){
      if (truckCrossBusy() && !inCross(m) && inCross(along(m.path, Math.min(m.path.len, m.path.d + 24)))){ m.v = 0; continue; }
      const rem = m.path.len - m.path.d;
      m.v = Math.min(vmax, m.v + 280*dt, Math.max(36, rem*2.4));
      const bx = m.x, by = m.y;
      m.path.d = Math.min(m.path.len, m.path.d + m.v*dt);
      const q = along(m.path, m.path.d); m.x = q.x; m.y = q.y;
      const dx = q.x-bx, dy = q.y-by;
      if (Math.hypot(dx, dy) > 0.05){ let a = Math.atan2(dy, dx); if (m.path.d < m.rev) a += Math.PI; m.ang = turnTo(m.ang, a, 10*dt); }

        m.path.checked = true; const hu = m.job, st = hu.dest;
        if (!portCheck(hu, st)){ hu.dest = null; moverGo(m, holdPos(G.holding.length + G.movers.filter(o => o !== m && o.state === 'toHold').length), 'toHold', 16); continue; }
      }
      if (m.path.d < m.path.len) continue;
      m.path = null; m.v = 0;
      if (m.state === 'toPick'){ const hu = m.job; m.from = palletSpot(hu) || forkPos(m); takePallet(hu); hu.loc = 'carried'; m.state = 'load'; m.t = 0; sfx('clunk'); }
      else if (m.state === 'toDrop'){ m.state = 'unload'; m.t = 0; m.to = dropPoint(m.job.dest); }
      else if (m.state === 'toHold'){ m.state = 'unloadHold'; m.t = 0; m.to = holdPos(G.holding.length); }
      else if (m.state === 'homing'){ m.state = 'idle'; }

    }

      if (hu.dest) moverGo(m, dropPoint(hu.dest), 'toDrop', 16); else moverGo(m, holdPos(G.holding.length), 'toHold', 16); } }
    else if (m.state === 'unload' || m.state === 'unloadHold'){ m.t += dt; if (m.t >= MOVER.load){
      const hu = m.job; hu.mover = null; m.job = null;
      if (m.state === 'unload'){ const st = hu.dest; hu.dest = null; st.incoming--; st.queue.push(hu); hu.loc = 'queue'; sfx('clunk'); }
      else { G.holding.push(hu); hu.loc = 'out'; tip('pallet_hold', 'A rejected pallet was parked in the <b>pallet buffer</b> (bottom right). <b>Click it</b> and send it to the right station.'); }

}
function updateCrane(dt){
  if (!G.st.hbw) return;
  const c = G.crane, sp = CRANE.speed * (1 + 0.4*((G.upgrades.hbw||{}).crane || 0));
  const freeBay = () => [0,1].find(i => !G.hbwOut[i] && !G.hbwFeed.some(f => f.bay === i));
  if (c.state === 'idle'){

    if (job){ G.craneJobs.splice(G.craneJobs.indexOf(job), 1); job.line.state = 'retrieving'; c.job = job; c.tx = hbSlotPos(job.line.slot).x; c.state = 'toSlot'; }

      const job = c.job; c.job = null; c.carry = false; c.state = 'idle';
      const hu = { id:++G.huSeq, order:job.o, pallet:true, flag:null, loc:'feed' }; job.o.hu = hu; job.o.released = true; job.line.state = 'picked'; G.hus.push(hu);
      const b = HB_BAYS[bi]; G.hbwFeed.push({ hu, bay:bi, path:mkPath([{ x:HB.ioX, y:HB.aisleY }, { x:b.x, y:HB.aisleY }, { x:b.x, y:b.y }], -1) }); sfx('clunk');

    tip('pallet_route', `The pallet for <b>#${f.hu.order.num}</b> is out. <b>Click it</b> and click its next station: a transporter drives it over the hall roads to the station's pallet bay.`); } }

function hbwHit(p){

// Cards are kept as persistent DOM nodes and patched in place (no flicker, hover stays stable)
const cardEls = new Map();
function syncList(container, orders, inbox, emptyText){
  const keep = new Set();
  const els = orders.map(o => {
    const key = (inbox ? 'i' : 'a') + o.id; keep.add(key);
    let el = cardEls.get(key);
    if (!el){ el = document.createElement('div'); el.dataset.oid = o.id; cardEls.set(key, el);
      // card takes the colour of the order's handling unit
      el.style.background = `linear-gradient(100deg, ${hexA(o.color, 0.34)}, ${hexA(o.color, 0.12)} 70%), #1b2433`;
      el.style.borderColor = hexA(o.color, 0.55); el.style.borderLeftColor = o.color; }
    const p = orderParts(o, inbox);
    const cls = p.cls + (el.classList.contains('shake') ? ' shake' : '');
    if (el.className !== cls) el.className = cls;
    if (el._html !== p.html){ el.innerHTML = p.html; el._html = p.html; el._due = el.querySelector('.due'); el._bar = el.querySelector('.tbar div'); }
    if (el._due.textContent !== p.due) el._due.textContent = p.due;
    el._due.style.color = p.col;
    el._bar.style.width = (p.frac*100).toFixed(1) + '%'; el._bar.style.background = p.col;
    return el;
  });
  if (!els.length){
    if (!container._empty){ container.innerHTML = `<div class="empty">${emptyText}</div>`; container._empty = true; }
  } else {
    if (container._empty){ container.innerHTML = ''; container._empty = false; }
    els.forEach((el, i) => { if (container.children[i] !== el) container.insertBefore(el, container.children[i] || null); });
    while (container.children.length > els.length) container.lastChild.remove();
  }
  for (const [k, el] of cardEls) if (k[0] === (inbox ? 'i' : 'a') && !keep.has(k)){ el.remove(); cardEls.delete(k); }
}

function placeTooltip(tt, cx, cy){
  const r = floorEl.getBoundingClientRect(), tw = tt.offsetWidth, th = tt.offsetHeight;

function toWorld(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left - view.ox)/view.s, y:(e.clientY - r.top - view.oy)/view.s, cx:e.clientX - r.left, cy:e.clientY - r.top }; }
function hitHU(p){
  let best = null, bd = 1e9;
  for (const hu of G.hus){ if (!selectable(hu) || hu.px == null) continue;
    const dx = Math.abs(p.x - hu.px), dy = Math.abs(p.y - hu.py);
    if (dx < 19 && dy < 16){ const d = dx+dy; if (d < bd){ bd = d; best = hu; } } }
  return best;
}
function hitStation(p){ return G.stations.find(st => p.x >= st.x-6 && p.x <= st.x+st.w+6 && p.y >= st.y-12 && p.y <= st.y+st.h+6) || null; }

cv.addEventListener('pointerdown', e => {
  AU.init(); Music.start();
  if (G.mode !== 'play') return;
  const p = toWorld(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  // broken automation: clicking its badge (always) or the station (with nothing selected) sends a service worker
  const bk = G.maint && G.stations.find(s => s.auto && s.auto.state === 'broken' && s.badge && p.x >= s.badge.x-6 && p.x <= s.badge.x+s.badge.w+6 && p.y >= s.badge.y-8 && p.y <= s.badge.y+s.badge.h+8);
  if (bk){ sendService(bk); return; }
  const hu = hitHU(p);
  if (!hu && !G.selected && G.maint){ const s = hitStation(p); if (s && s.auto && s.auto.state === 'broken'){ sendService(s); return; } }
  if (hu){ selectHU(hu); drag = { hu, x:p.x, y:p.y, moved:false }; cv.setPointerCapture(e.pointerId); return; }
  const st = hitStation(p);
  if (st && G.selected && (st.def.role !== 'storage' || (G.selected.kind && acceptsKind(st.def, G.selected.kind)))){ dispatch(G.selected, st); return; }
  const rk = rackHit(p);
  if (rk){ if (!retrieve(rk.o, rk.li)) G.selected = null; return; }
  if (st && G.selected){ dispatch(G.selected, st); return; }
  G.selected = null;
});

    <p style="color:var(--muted);font-size:12px;margin-top:16px"><span class="verTap">Version ${GAME_VERSION}</span> · Sound on recommended · Keys: <span class="kbd">1</span>–<span class="kbd">9</span> route · <span class="kbd">Tab</span> next unit · <span class="kbd">0</span> warehouse · <span class="kbd">Space</span> pause</p>`);
  bind('mNew', () => { const keepTips = G.seenTips, mo = G.musicOn, so = G.sfxOn; Object.assign(G, newProfile(), { seenTips:keepTips, musicOn:mo, sfxOn:so }); showIntro(0); });
  bind('mContinue', () => { Object.assign(G, sv); showIntro(sv.shiftIdx); });
  bind('mShopT', () => { Object.assign(G, sv); G.shopBack = showTitle; showShop(); });
  bind('mSave', () => { if (sv) Object.assign(G, sv); showSaveIO(showTitle); });
  bind('mHelp', () => showHelp(true));
}
function showIntro(idx){

  const cfg = shiftConfig(idx), prev = idx > 0 ? shiftConfig(idx-1).stations : [];
  // preview stations for flow
  G.cfg = cfg; G.stations = cfg.stations.map(id => makeStation(DEF[id])); G.st = Object.fromEntries(G.stations.map(s => [s.id, s])); layoutStations();
  G.orders = []; G.hus = []; G.fetch = []; G.jobs = []; G.robots = []; G.inbound = []; resetPallets(); G.shippedLog = []; G.time = 0; G.truck = newTruck(); G.shipped = 0; G.sat = 100;
  const newOnes = cfg.stations.filter(id => !prev.includes(id));
  saveProfile();

  const returns = activeHas('goodsin') && activeHas('regrind') ? `<span class="fs info" data-tip>${ico('goodsin')}Returns &amp; restock<span class="tipc"><b>Returns &amp; restock</b><br>
    Drills and cutters: Goods-in ➜ Regrinding ➜ Laser / Focus if needed ➜ Packing.<br>
    Measuring tools: Goods-in ➜ Calibration Lab ➜ Focus if needed ➜ Packing. If one fails, it goes straight back via Packing, not to QA.<br>
    New stock (cardboard box) goes to the Shuttle Warehouse.</span></span>` : '';
  const fresh = idx > 0 ? newOnes : [];
  modal(`<p class="kicker">Shift ${idx+1} · ${cfg.name}</p>
    <h2>${cfg.title}</h2>
    <div class="stats"><span>${ico('target')}Ship <b>${cfg.goal}</b> orders</span><span>${ico('clock')}<b>${Math.round(cfg.duration/60*10)/10}</b> min</span><span>${ico('tote')}New order every <b>~${Math.round((cfg.spawn[0]+cfg.spawn[1])/2)} s</b></span></div>
    ${fresh.length ? `<div class="newbox">${fresh.map(id => `<div class="nw" data-tip><span class="tag">NEW</span>${ico(DEF[id].icon)}<b>${DEF[id].name}</b><span class="br">${DEF[id].brief}</span>${stTip(id)}</div>`).join('')}</div>` : ''}
    <div class="flow route">${route}</div>
    <div class="flow route sub2"><span class="hint" style="margin:0 2px 0 0">Off the route:</span>${side}${returns}<span class="hint">Flagged units go to QA first. ${'ontouchstart' in window ? 'Tap' : 'Hover'} a station for details.</span></div>
    <div class="btnrow"><button class="btn primary" id="mStart">Start shift ▸</button></div>`);
  bind('mStart', () => { hideModal(); tipQueue.length = 0; hideTip(null); startShift(idx); syncButtons(); renderSide();
    if (idx === 0) setTimeout(() => toast(ico('sun') + ' Good morning! The first order is on its way…', 'good'), 300);
    else toast(`Shift ${idx+1} started. Goal: ship ${cfg.goal} orders.`, 'good'); });
}

function shopTile(u, lv, cost, attrs, extra){
  const maxed = lv >= u.max, locked = !maxed && extra.locked, poor = !maxed && !locked && G.money < cost;
  const state = maxed ? 'maxed' : locked ? 'locked' : poor ? 'poor' : 'buy';
  const pips = Array.from({ length:u.max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('');
  const foot = maxed ? `<span class="ut-tag ok">${ico('done')}Maxed</span>`
    : locked ? `<span class="ut-tag lk">${ico('lock')}Locked</span>`
    : `<span class="ut-price">$${cost.toLocaleString('en')}</span>`;
  const desc = locked ? u.reqText : u.desc;
  const nxt = extra.next && !maxed && !locked ? `<span class="ut-next">Next: ${extra.next}</span>` : '';
  return `<button class="ut ${state}${extra.auto ? ' auto' : ''}" ${attrs} ${state === 'buy' ? '' : 'disabled'} aria-label="${u.label}, level ${lv} of ${u.max}"><span class="ut-in">
    <span class="ut-top"><span class="ut-ic">${ico(u.icon)}</span><span class="ut-name">${u.label}</span></span>
    <span class="ut-desc">${desc}</span>${nxt}
    <span class="ut-foot"><span class="pips" title="Level ${lv} of ${u.max}">${pips}</span>${foot}</span></span></button>`;
}
function showShop(){
  G.mode = 'shop';
  const next = shiftConfig(G.shiftIdx);
  // progressive disclosure: only stations you have already worked with, automation only late in the game
  const upto = G.shopUpto != null ? G.shopUpto : G.shiftIdx, played = new Set();
  for (let j=0; j<upto; j++) shiftConfig(j).stations.forEach(id => played.add(id));
  const autoOpen = upto >= AUTO.unlockAfter;
  const loadBar = ld => { const c = ld > 0.8 ? 'var(--bad)' : ld > 0.55 ? 'var(--warn)' : 'var(--good)';
    return `<span class="busy" title="Share of last shift this station was busy"><em style="color:${ld > 0.8 ? 'var(--bad)' : 'var(--muted)'}">${Math.round(ld*100)}% busy</em><span class="load"><span style="width:${Math.round(ld*100)}%;background:${c}"></span></span></span>`; };
  const section = (icon, name, right, tiles, autoTiles) => `<section class="sec"><header class="sec-h">${ico(icon)}<span class="sec-n">${name}</span>${right}</header>
    <div class="ugrid">${tiles}${autoTiles || ''}</div></section>`;
  const rows = next.stations.filter(id => played.has(id)).map(id => { const d = DEF[id], up = G.upgrades[id] = G.upgrades[id] || {};
    const list = UPGRADES.filter(u => (!u.needs || u.needs(d)) && (!u.late || autoOpen));
    const tile = u => { const lv = up[u.id] || 0;
      return shopTile(u, lv, u.cost(lv), `data-st="${id}" data-up="${u.id}"`, { locked: u.req && !u.req(up), auto: !!u.late, next: u.levelDesc && lv < u.max ? u.levelDesc(lv) : '' }); };
    const ld = G.lastLoad && G.lastLoad[id] != null && d.role !== 'storage' ? G.lastLoad[id] : null;
    return section(d.icon, d.name, ld == null ? '' : loadBar(ld), list.filter(u => !u.late).map(tile).join(''), list.filter(u => u.late).map(tile).join('')); }).join('');
  const grow = GLOBAL_UPGRADES.filter(u => !u.needs || u.needs()).map(u => { const lv = G.global[u.id] || 0;
    return shopTile(u, lv, u.cost(lv), `data-g="${u.id}"`, {}); }).join('');
  const note = !autoOpen ? `More upgrades unlock as new stations open. Station <b style="color:var(--good)">automation</b> becomes available after ${shiftConfig(AUTO.unlockAfter-1).name}.`
    : autoBought() >= MAINT.after ? `${ico('wrench')} Your automation needs <b style="color:var(--warn)">maintenance</b>: auto-routers break down now and then, and a service worker has to repair them. More workers: see <b>Whole hall</b>.`
    : `Heads-up: from ${MAINT.after} automation upgrades on (you own ${autoBought()}), auto-routers start to break down and need a service worker.`;
  modal(`<div class="shop-h"><div><h2>Upgrade the hall</h2><p class="sub">Next: Shift ${G.shiftIdx+1} · ${next.name}. A <b style="color:var(--bad)">red</b> busy bar marks a bottleneck.</p></div>
    <div class="cashbox"><small>Cash</small><span class="cashbig">$${G.money.toLocaleString('en')}</span></div></div>
    <div class="shop">${section('factory', 'Whole hall', '', grow)}${rows}</div>
    <p class="shop-note">${note}</p>
    <div class="btnrow stickyrow"><button class="btn primary" id="mNext">${G.shopBack === showPause ? 'Restart' : 'Continue to'} Shift ${G.shiftIdx+1} ▸</button>${G.shopBack === showTitle ? '<button class="btn" id="mShopBack">Back</button>' : ''}</div>`);
  $('mcard').classList.add('wide');
  $('mcard').querySelectorAll('.ut').forEach(b => b.onclick = () => {
    if (b.dataset.g){ const u = GLOBAL_UPGRADES.find(x => x.id === b.dataset.g), lv = G.global[u.id] || 0; if (lv >= u.max || G.money < u.cost(lv)) return; G.money -= u.cost(lv); G.global[u.id] = lv+1; }
    else { const u = UPGRADES.find(x => x.id === b.dataset.up), up = G.upgrades[b.dataset.st], lv = up[u.id] || 0; if (lv >= u.max || G.money < u.cost(lv) || (u.req && !u.req(up))) return; G.money -= u.cost(lv); up[u.id] = lv+1; }
    sfx('fix'); saveProfile(); const sc = $('modal').scrollTop; showShop(); $('modal').scrollTop = sc; renderHUD();
  });
  bind('mNext', () => { G.shopBack = null; showIntro(G.shiftIdx); });
  bind('mShopBack', () => { G.shopBack = null; saveProfile(); showTitle(); });
}
function showSaveIO(back){
  const code = exportCode();
  modal(`<h2>Save / load</h2><p class="sub">Your progress (day, cash, upgrades) as a save code. Copy it somewhere safe, or paste a code to load it.</p>
    <textarea id="ioCode" readonly style="width:100%;height:74px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px ui-monospace,monospace;word-break:break-all">${code}</textarea>
    <div class="btnrow" style="justify-content:flex-start"><button class="btn primary" id="ioCopy">Copy code</button><button class="btn" id="ioDl">Download file</button></div>
    <p class="sub" style="margin-top:14px">Load a save: paste a code below, or open a saved file. This replaces your current progress.</p>
    <textarea id="ioIn" placeholder="Paste a save code (LT1:...)" style="width:100%;height:60px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px ui-monospace,monospace"></textarea>
    <div class="btnrow" style="justify-content:flex-start"><button class="btn primary" id="ioLoad">Load code</button><button class="btn" id="ioFile">Open file</button><input type="file" id="ioPick" accept=".txt,.json,text/plain,application/json" style="display:none"></div>
    <p id="ioMsg" class="sub" style="min-height:18px"></p>
    <div class="btnrow"><button class="btn" id="ioBack">Back</button></div>`);
  const msg = (t, ok) => { const el = $('ioMsg'); el.textContent = t; el.style.color = ok ? 'var(--good)' : 'var(--bad)'; };
  const load = txt => { try { const d = importCode(txt); Object.assign(G, d); G.shopBack = null; saveProfile(); sfx('fix'); msg(`Loaded: Shift ${d.shiftIdx+1}, $${d.money.toLocaleString('en')}.`, true); setTimeout(showTitle, 900); }
    catch(e){ sfx('error'); msg('That is not a valid save code.', false); } };
  bind('ioCopy', async () => { const ta = $('ioCode');
    try { await navigator.clipboard.writeText(code); msg('Copied to the clipboard.', true); }
    catch(e){ ta.focus(); ta.select(); ta.setSelectionRange(0, code.length); try { document.execCommand('copy'); msg('Copied to the clipboard.', true); } catch(e2){ msg('Select the code above and copy it.', false); } } });
  bind('ioDl', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], { type:'text/plain' }));
    a.download = `logistic-town-shift${G.shiftIdx+1}.txt`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); });
  bind('ioLoad', () => load($('ioIn').value));
  bind('ioFile', () => $('ioPick').click());
  $('ioPick').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(load); };
  bind('ioBack', () => back());
}

    <div class="btnrow"><button class="btn primary" id="mResume">Resume ▸</button><button class="btn" id="mHelp2">How to play</button><button class="btn" id="mRestart">Restart shift</button><button class="btn" id="mShopP">Upgrades (restarts shift)</button><button class="btn" id="mSave2">Save / load</button><button class="btn" id="mMenu2">Main menu</button></div>`);
  bind('mShopP', () => { G.money = G.startMoney; G.shopBack = showPause; showShop(); });
  bind('mSave2', () => { const m = G.money; G.money = G.startMoney; saveProfile(); G.money = m; showSaveIO(showPause); });
  bind('mResume', () => togglePause());
  bind('mHelp2', () => showHelp());

function showHelp(fromTitle){
  const all = STATIONS;
  const stg = {}; Object.entries(STEPS).forEach(([sid,s]) => { if (!s.alt) (stg[s.stage] = stg[s.stage] || []).push(sid); });
  const flow = Object.keys(stg).sort((a,b)=>a-b).map(k => `<span class="fs">${stg[k].map(sid => ico(DEF[STEP_STATION[sid]].icon)+DEF[STEP_STATION[sid]].name).join(' / ')}</span>`).join('<span class="ar">➜</span>');
  modal(`<h2>How to play</h2>
    <p>Orders from tool customers arrive on the left. Each order travels in its own <b>handling unit (HU)</b>, a transport box on the conveyor loop. Your job is to route every HU through exactly the stations its order needs.</p>
    <div class="flow">${flow}</div>${returnsFlowHTML()}
    <ul class="clean">
      <li>Click an order's <b>glowing totes</b> in the Shuttle Warehouse. Commissioning starts once all of them have arrived. Hover an order card to see where its totes are.</li>
      <li>Orange <b>shuttles</b> bring the totes. You start with 2, so extra clicks wait in line (clock icon). Buy more shuttles in the shop.</li>
      <li>Every order starts at <b>Commissioning</b> and ends at <b>Packing & Shipping</b>.</li>
      <li><b>Wrong pick</b>: QA takes the wrong item out as a grey <b>↩ return tote</b>. Route it back to the Shuttle Warehouse, click the order's new glowing tote, and send the HU back to Commissioning for a re-pick.</li>
      <li>Services in the same group can be done in any order. Coloured dots under an HU show what it still needs.</li>
      <li><b style="color:var(--bad)">Flags</b>: a failed check, a wrong pick or a failed <b>weight check</b> on the conveyor. Flagged HUs go to <b>Quality Assurance</b>. QA either <b>corrects</b> it (it continues its route, a failed service is redone) or finds the item <b>defective</b>: the red box goes to <b>Retoure</b> and a new item must be commissioned.</li>
      <li>Sending an HU to the wrong station gets it rejected (−$10, −satisfaction). It then circles the belt until you re-route it.</li>
      <li>Full OUT trays <b>block</b> a station. Keep units moving!</li>
      <li><b style="color:var(--good)">Automation</b> (shop, expensive): an <b>Auto-router</b> makes a station send its finished units on by itself, one every 8 / 4 / 2 s depending on the level. It only handles the normal case. Flagged units, return totes and defective items still need you, until you buy <b>Exception handling</b>. Once you own ${MAINT.after} automation upgrades, auto-routers <b>break down</b> now and then: click the station to send a <b>service worker</b>, and route by hand until it is repaired.</li>
      <li>Late orders pay 40% and cost satisfaction. Focus customers (★) pay 50% more.</li>
      <li>Oversize tools (compressors, welders, table saws) are stored on <b>Euro pallets</b> in the <b>High-Bay Warehouse</b>. Click a glowing pallet, then route it like any order, except that pallets <b>skip Commissioning</b>: <b>transporters with a driver</b> drive pallets over the hall roads to each station's pallet bay. Rejected pallets are parked in the <b>pallet buffer</b>.</li>
      <li>Later on, <b>Goods-in</b> opens: customers send back blunt drills and milling cutters. They are unloaded automatically; route them to <b>Regrinding</b>, then any services on their card, then Packing. A tool that is worn beyond regrinding (or a measuring tool out of tolerance) is <b>NOT OK</b>: it is the customer's own, so it goes straight back via Packing, never to Retoure. Now and then new stock arrives too: send the cardboard box to the Shuttle Warehouse.</li>
    </ul>
    <div class="grid2">${all.map(d => `<div class="scard"><div class="t">${ico(d.icon)}${d.name}</div>${d.desc}</div>`).join('')}</div>
    <p style="font-size:13px;color:var(--muted)">Controls: click an order's glowing totes in the Shuttle Warehouse to start it, click an HU then a station to route it (or drag, or press <span class="kbd">1</span>–<span class="kbd">9</span>). <span class="kbd">0</span> sends a selected return tote to the warehouse, <span class="kbd">Tab</span> selects the most urgent HU, <span class="kbd">H</span> hints, <span class="kbd">F</span> speed, <span class="kbd">Space</span> pause, right-click deselects.</p>
    <div class="btnrow"><button class="btn primary" id="mBack">${fromTitle ? 'Back' : 'Resume ▸'}</button></div>`);
  bind('mBack', () => { if (fromTitle) showTitle(); else { hideModal(); if (G.mode === 'paused'){ G.mode = 'play'; syncButtons(); } } });
}

// ===================================================================
//  MAIN LOOP
// ===================================================================
let last = performance.now(), sideTimer = 0;
function frame(now){
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - last)/1000); last = now;
  const dt = realDt * (G.speed || 1);
  if (G.mode === 'play'){ update(dt); Music.P = clamp(G.time/G.cfg.duration, 0, 1); Music.left = G.cfg.duration - G.time; Music.W = clamp(G.orders.length*0.07, 0, 1); }
  else if (G.mode !== 'paused'){ Music.P = 0; Music.W = 0; Music.left = 999; }
  try { render(now/1000); } catch(e){ console.error(e); }
  sideTimer -= realDt;
  if (sideTimer <= 0 && (G.mode === 'play' || G.mode === 'intro')){ sideTimer = 0.2; renderSide(); renderHUD(); }
  if (hoverHU && !selectable(hoverHU)){ hoverHU = null; showTooltip(null); }
}
['touchend','click','keydown'].forEach(ev => document.addEventListener(ev, () => { AU.init(); if (AU.ctx && AU.ctx.state !== 'running') AU.ctx.resume(); }, { passive:true }));
if (window.ResizeObserver) new ResizeObserver(resize).observe(floorEl);
resize(); syncButtons(); showTitle(); requestAnimationFrame(frame);

// ---------- update check: fetch the published page uncached and compare versions ----------
const Updater = {
  checking:false, last:0,
  async check(){
    if (this.checking || !/^https?:/.test(location.protocol) || Date.now() - this.last < 60000) return;
    this.checking = true; this.last = Date.now();
    try {
      const res = await fetch(location.href.split('#')[0].split('?')[0] + '?v=' + Date.now(), { cache:'no-store' });
      const m = res.ok && (await res.text()).match(/const GAME_VERSION = '([^']+)'/);
      if (m && m[1] !== GAME_VERSION) this.offer(m[1]);
    } catch(e){} finally { this.checking = false; }
  },
  offer(v){
    if ($('updBar')) return;
    const el = document.createElement('button'); el.id = 'updBar';
    el.innerHTML = `New version ${v} available · tap to update`;
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:#1a1208;border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer';
    el.onclick = () => { saveProfile(); location.replace(location.href.split('#')[0].split('?')[0] + '?v=' + encodeURIComponent(v)); };
    document.body.appendChild(el);
  }
};
setTimeout(() => Updater.check(), 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Updater.check(); });
window.addEventListener('pageshow', e => { if (e.persisted) Updater.check(); });

// ---------- test / automation hooks ----------
window.LT = { get G(){ return G; }, STATIONS, STEPS, SHIFTS, startShift, update, validTargets, dispatch, retrieve, selectable, hasRoom, endShift,
  sendService,
  simulate(seconds, policy, dt=1/30){ const s = G.silent; G.silent = true; let t = 0; while (t < seconds && G.mode === 'play'){ policy && policy(G, dt); update(dt); t += dt; } G.silent = s; return G; } };
</script>
