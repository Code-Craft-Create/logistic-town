<title>Logistic Town</title>
<style>
:root{
  --bg:#0e131d; --panel:#151c29; --panel2:#1b2433; --line:#2a3548; --text:#eef2f8; --muted:#8a96ad;
  --accent:#ff8a1f; --accent2:#ffb15c; --accentDim:rgba(255,138,31,.16);
  --good:#3ddc84; --bad:#ff5468; --warn:#ffc53d;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.cic{stroke:rgba(8,10,16,.65);stroke-width:.8;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.tbtn .ic{width:17px;height:17px}
.flow .fs .ic{width:16px;height:16px;margin-right:3px}
.toast .ic,.chip .ic{width:13px;height:13px}
/* fills the whole screen, also as a home-screen app (viewport-fit=cover); notch / home bar areas are kept free via safe-area insets */
#app{display:grid;grid-template-rows:58px minmax(0,1fr);grid-template-columns:300px minmax(0,1fr);position:fixed;inset:0;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#top{grid-column:1/3;display:flex;align-items:center;gap:20px;padding:0 16px;background:linear-gradient(#1a2231,#131a26);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;font-size:17px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#ff5a1f);display:grid;place-items:center;box-shadow:0 2px 10px rgba(255,138,31,.45)}
.brand .logo svg{width:18px;height:18px}
.hgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.hgroup label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hgroup b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:#0b1018;border:1px solid var(--line);overflow:hidden}
.bar > div{height:100%;border-radius:5px;transition:width .3s}
#clockGroup{width:190px}
#clockFill{background:linear-gradient(90deg,var(--accent2),var(--accent))}
#satGroup{width:170px}
#satFill{background:var(--good)}
.spacer{flex:1}
.tbtn{height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:#fff}
.tbtn.on{background:var(--accentDim);border-color:var(--accent);color:var(--accent2)}
.tbtn.off{opacity:.5}
#side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px 20px;min-height:0}
#side h3{margin:6px 2px 8px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);display:flex;justify-content:space-between}
#side h3 span{color:var(--text)}
.empty{font-size:12px;color:var(--muted);padding:10px 4px 14px;font-style:italic}
.oc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;position:relative;transition:border-color .15s,transform .1s}
.oc{cursor:pointer}
.oc:hover{transform:translateX(2px);filter:brightness(1.12)}
.oc.inbox.blocked{opacity:.6}
.oc{border-left-width:5px}
.oc.late{box-shadow:0 0 0 2px var(--bad)}
.oc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.oc-h{display:flex;align-items:center;gap:6px;font-size:12.5px}
.oc-h .sw{width:11px;height:11px;border-radius:3px;flex:none}
.oc-h .cust{color:#c9d2e3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.oc-h .due{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}
.oc-items{display:flex;gap:7px;margin:5px 0 5px;color:#e6ebf4}
.oc-items .it{display:flex;flex-direction:column;align-items:center;gap:2px}
.oc-items .it .ic{width:24px;height:24px}
.oc-items .dots{display:flex;gap:2px;height:4px}
.oc-items .dots i{width:4px;height:4px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;border:1px solid;opacity:.95}
.chip.done{color:#0e131d!important}
.chip.flag{background:var(--bad);border-color:var(--bad);color:#fff}
.tbar{height:4px;border-radius:3px;background:#0b1018;margin-top:7px;overflow:hidden}
.tbar div{height:100%}
.release-hint{position:absolute;right:9px;bottom:13px;font-size:10px;color:var(--accent2);opacity:0;transition:opacity .15s}
.oc.inbox:hover .release-hint{opacity:1}
#floor{position:relative;overflow:hidden;min-width:0;min-height:0}

#tip button{float:right;margin:6px 0 0 12px;background:var(--accent);color:#1a1208;border:0;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}

#tooltip .tt-h{font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center}

#tooltip .row.done{color:var(--good)} #tooltip .row.next{color:var(--accent2);font-weight:700}
#tooltip .fl{color:var(--bad);font-weight:700;margin-top:4px}
#tooltip .items{font-size:12px;color:var(--text);margin-bottom:4px}
#tooltip .items .ic{width:14px;height:14px;vertical-align:-3px}

.mcard{background:linear-gradient(180deg,#1a2231,#141b27);border:1px solid var(--line);border-radius:18px;padding:26px 28px;width:min(720px,100%);margin:auto;flex:none;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.mcard h1{margin:0 0 4px;font-size:34px;letter-spacing:.5px}
.mcard h1 em{font-style:normal;color:var(--accent)}
.mcard h2{margin:0 0 6px;font-size:24px}
.mcard .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.mcard p{line-height:1.5;font-size:14px}

.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:15px;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#1a1208;border:0;box-shadow:0 4px 16px rgba(255,138,31,.35)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.scard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.4}
.scard .t{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px;font-size:14px}
.scard .t .ic{width:22px;height:22px;flex:none}
.scard.new{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,138,31,.12),var(--panel2))}
.tag{display:inline-block;font-size:10px;font-weight:800;background:var(--accent);color:#1a1208;border-radius:5px;padding:1px 6px;margin-left:auto}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0;font-size:13px}

.stars{font-size:40px;letter-spacing:6px;color:#4a5468;margin:4px 0 10px}

ul.clean{padding-left:18px;margin:8px 0;line-height:1.6;font-size:14px}
.shop{display:flex;flex-direction:column;gap:8px}

const PATHS = {};
function drawIcon(name, x, y, size, color, lw=2){
  const L = CICONS[name];

    ctx.lineJoin = 'round'; ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(8,10,16,0.65)';
    L.forEach(([f,d], i) => { const k = name+'#'+i; const p = PATHS[k] || (PATHS[k] = new Path2D(d)); ctx.fillStyle = f; ctx.fill(p); ctx.stroke(p); });

const LOOP = { x0:440, y0:300, x1:1060, y1:500 };
LOOP.w = LOOP.x1-LOOP.x0; LOOP.h = LOOP.y1-LOOP.y0; LOOP.L = 2*(LOOP.w+LOOP.h);
const WH = { x:16, y:66, w:184, h:700 };

function loopPos(s){
  const {x0,y0,x1,y1,w,h,L} = LOOP; s = ((s%L)+L)%L;
  if (s <= w) return { x:x0+s, y:y0 };
  if (s <= w+h) return { x:x1, y:y0+(s-w) };
  if (s <= 2*w+h) return { x:x1-(s-w-h), y:y1 };
  return { x:x0, y:y1-(s-2*w-h) };
}
function loopS(x, y){
  const {x0,y0,x1,y1,w,h} = LOOP;
  const cx = clamp(x,x0,x1), cy = clamp(y,y0,y1);
  const c = [[Math.abs(y-y0), cx-x0],[Math.abs(x-x1), w+cy-y0],[Math.abs(y-y1), w+h+(x1-cx)],[Math.abs(x-x0), 2*w+h+(y1-cy)]];
  c.sort((a,b) => a[0]-b[0]); return c[0][1];
}
function laneOff(p, off){
  const e = 0.01; let {x,y} = p;
  if (Math.abs(p.y-LOOP.y0) < e) y -= off;
  if (Math.abs(p.y-LOOP.y1) < e) y += off;
  if (Math.abs(p.x-LOOP.x0) < e) x -= off;
  if (Math.abs(p.x-LOOP.x1) < e) x += off;
  return { x, y };
}
function loopCorners(s0, s1, dir){ // corner points strictly between s0 and s1 going dir
  const {w,h,L} = LOOP, base = [0, w, w+h, 2*w+h], out = [];
  const all = []; for (let k=-2; k<=3; k++) base.forEach(c => all.push(c + k*L));
  if (dir > 0) all.filter(c => c > s0+1e-6 && c < s1-1e-6).sort((a,b)=>a-b).forEach(c => out.push(loopPos(c)));
  else all.filter(c => c < s0-1e-6 && c > s1+1e-6).sort((a,b)=>b-a).forEach(c => out.push(loopPos(c)));
  return out;
}
function mkPath(pts, portIdx){
  const cum = [0];
  for (let i=1; i<pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
  return { pts, cum, len:cum[cum.length-1], portAt: portIdx>=0 ? cum[portIdx] : -1, d:0, checked:false };
}
function along(path, d){
  const {pts, cum} = path; d = clamp(d, 0, path.len);
  for (let i=0; i<pts.length-1; i++){
    if (cum[i+1] >= d){ const seg = cum[i+1]-cum[i] || 1, t = (d-cum[i])/seg;
      return { x:pts[i].x + (pts[i+1].x-pts[i].x)*t, y:pts[i].y + (pts[i+1].y-pts[i].y)*t }; }
  }
  return { ...pts[pts.length-1] };
}
// Build a path: from a station (or loop position s) to a station (or a full circle when toSt is null)
function buildPath(fromSt, fromS, toSt){
  const L = LOOP.L, pts = [];
  const s0 = fromSt ? fromSt.port.s : fromS;
  let s1, dir;
  if (toSt){ s1 = toSt.port.s; const cw = ((s1-s0)%L+L)%L; dir = cw <= L-cw ? 1 : -1; s1 = dir>0 ? s0+cw : s0-(L-cw); }
  else { dir = 1; s1 = s0 + L; }
  const off = dir > 0 ? 10 : -10;
  if (fromSt) pts.push({ ...fromSt.dock });
  pts.push(laneOff(loopPos(s0), off));
  loopCorners(s0, s1, dir).forEach(p => pts.push(laneOff(p, off)));
  pts.push(laneOff(loopPos(s1), off));
  const portIdx = toSt ? pts.length-1 : -1;
  if (toSt) pts.push({ ...toSt.dock });
  const p = mkPath(pts, portIdx); p.to = toSt ? toSt.id : null; p.loopS = s0; return p;
}

  const CHr = right.length > 1 ? 140 : CH, r0 = cy - (right.length*CHr + (right.length-1)*16)/2;
  right.forEach((st, i) => { st.w=160; st.h=CHr; st.x = x1+SP; st.y = r0 + i*(CHr+16); st.dock={ x:st.x, y:st.y+CHr/2 }; st.port={ x:x1, y:st.y+CHr/2, s:w+(st.y+CHr/2-y0) }; st.side='right'; });
  // keyboard keys in reading order

        : st.side === 'right' ? { x:ROAD.x1 - 38, y:cy, vert:true } : { x:cx, y:st.y - 25, vert:false };
      const j = ringPos(ROAD, ringS(ROAD, st.bay.x, st.bay.y)), dx = st.bay.x - j.x, dy = st.bay.y - j.y, d = Math.hypot(dx, dy) || 1;

    for (let i=0; i<DEPOT.max; i++){ const q = depotPos(i); G.spurs.push({ a:{ x:q.x, y:ROAD.y1 }, b:{ x:q.x, y:q.y - 16 }, w:18 }); }
    for (let i=0; i<HOLD.per; i++){ const q = holdPos(i); G.spurs.push({ a:{ x:q.x, y:ROAD.y1 }, b:{ x:q.x, y:q.y - 12 }, w:18 }); }

}

function startShift(idx){

const activeHas = id => !!G.st[id];
function pendingSteps(o){ return Object.keys(o.steps).filter(k => o.steps[k]==='todo'); }
function validTargets(hu){
  if (hu.kind) return G.stations.filter(s => acceptsKind(s.def, hu.kind));
  if (hu.flag) return G.stations.filter(s => s.def.role==='repair');
  const pend = pendingSteps(hu.order); if (!pend.length) return [];
  const minStage = Math.min(...pend.map(id => STEPS[id].stage));

}
const hasRoom = st => st.queue.length + st.incoming < st.queueMax;
function selectable(hu){
  if (hu.gone) return false;

  return false;
}
function nextHint(hu){
  if (hu.kind) return G.stations.filter(s => acceptsKind(s.def, hu.kind)).map(s => s.def.name).join(' or ') || '—';
  if (hu.flag) return 'Quality Assurance';
  const t = validTargets(hu); return t.length ? t.map(s => s.def.name).join(' or ') : '—';

function makeOrder(){
  const cfg = G.cfg;
  // customer returns arrive at Goods-in: blunt cutting tools (regrinding) or measuring tools (re-calibration)
  const r = Math.random(), gi = activeHas('goodsin');
  const type = gi && activeHas('regrind') && r < INBOUND.regrindShare ? 'regrind'
    : gi && activeHas('calib') && r < INBOUND.regrindShare + INBOUND.recalShare ? 'recal' : 'new';
  const returns = type !== 'new';
  const n = returns ? randInt(1, 2) : randInt(cfg.items[0], cfg.items[1]);
  const pallet = type === 'new' && activeHas('hbw') && Math.random() < PALLET.share;
  const pool = ITEMS.filter(i => type === 'regrind' ? i.tags.includes('cutting') : type === 'recal' ? i.tags.includes('measure') : pallet ? i.tags.includes('oversize') : SMALL(i)), items = [];
  const nItems = pallet ? 1 : n;
  for (let i=0; i<nItems && pool.length; i++) items.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  const id = ++G.seq;
  const o = { id, num:4100 + id + G.shiftIdx*100, customer:pick(CUSTOMERS), items, focus:false, steps:{},
    created:G.time, color:ORDER_COLORS[id % ORDER_COLORS.length], released:false, shipped:false, late:false, hu:null, type, pallet };
  o.focus = activeHas('care') && Math.random() < 0.28;
  // returned tools travel in the customer's parcel (already 'picked' into the HU); new orders wait in the rack
  o.lines = items.map(item => returns ? { item, state:'picked', slot:null } : { item, state:'stored', slot:pallet ? hbwSlot() : freeRackSlot() });
  let allow = cfg.slack;
  for (const [sid, s] of Object.entries(STEPS)){
    const stId = STEP_STATION[sid]; if (!stId || !activeHas(stId)) continue;
    if (s.want(o)){ o.steps[sid] = 'todo'; allow += DEF[stId].time + 6; }
  }
  allow += returns ? 0 : pallet ? PALLET.extraTime : 4*o.lines.length;
  o.allow = Math.round(allow); o.due = G.time + o.allow;
  G.orders.push(o);
  sfx('order');
  if (type === 'recal'){ G.inbound.push({ o });
    tip('recal', `Customer return! <b>#${o.num}</b> sent measuring tools back for <b>re-calibration</b>. After Goods-in, route it to the <b>Calibration Lab</b>. If a tool is out of tolerance there is no guarantee: it goes <b>straight back to the customer</b> (Packing), not to QA.`); return; }
  if (returns){ G.inbound.push({ o });
    tip('regrind', `Customer return! <b>#${o.num}</b> sent back blunt cutting tools. The parcel is unloaded at <b>Goods-in</b> on its own. Then route it to <b>Regrinding</b>, then the services on its card, then Packing.`); return; }
  if (pallet) tip('pallet', `Oversize order! <b>#${o.num}</b> needs a <b>${items[0].name}</b> on a Euro pallet. Its pallet is <b style="color:var(--accent)">glowing in the High-Bay Warehouse</b> (bottom). Click it: the stacker crane brings it to the pallet I/O.`);
  if (G.cfg === SHIFTS[0] || G.shiftIdx === 0) tip('release', 'A new order arrived! Its totes are <b style="color:var(--accent)">glowing in the Shuttle Warehouse</b> (same colour as the order card). <b>Click each glowing tote</b> to send it to Commissioning.');
}

// Rack geometry of the shuttle warehouse (shared by drawing, hit-testing and retrieval)
const RACK = { aisles:2, levels:18, top:WH.y+52 };
RACK.aw = (WH.w-28)/RACK.aisles; RACK.lh = (WH.h-130)/RACK.levels;
function rackPos(sl){ const ax = WH.x+14 + sl.a*RACK.aw, rw = RACK.aw*0.34;
  return { x: ax + sl.side*(RACK.aw*0.62) + 2 + rw/2, y: RACK.top + sl.l*RACK.lh + (RACK.lh-3)/2 }; }
function freeRackSlot(){
  const used = new Set(); (G.orders||[]).forEach(o => (o.lines||[]).forEach(l => !o.pallet && l.state==='stored' && l.slot && used.add(l.slot.a+'-'+l.slot.l+'-'+l.slot.side)));
  for (let i=0; i<60; i++){ const sl = { a:randInt(0,RACK.aisles-1), l:randInt(0,RACK.levels-1), side:randInt(0,1) }; if (!used.has(sl.a+'-'+sl.l+'-'+sl.side)) return sl; }
  return { a:0, l:0, side:0 };
}
function linesDone(o){ return o.lines.filter(l => l.state==='atPick' || l.state==='picked').length; }
// Click on a glowing tote: the shuttle brings it to Commissioning. The first tote opens the order's HU there.
function retrieve(o, li){
  const line = o.lines[li]; if (!line || line.state !== 'stored' || G.mode !== 'play') return false;
  if (o.pallet){ line.state = 'queued'; G.craneJobs.push({ o, line }); hideTip('pallet'); sfx('release'); return true; }
  const c = G.st.commission;
  if (!o.hu){
    if (!hasRoom(c)){ toast('Commissioning is full. Wait for a free spot before starting a new order.', 'bad'); sfx('error'); return false; }
    o.released = true;
    const hu = { id:++G.huSeq, order:o, flag:null, loc:'queue' }; o.hu = hu; G.hus.push(hu); c.queue.push(hu);
  }
  line.state = 'queued';
  G.jobs.push({ o, line });
  hideTip('release'); sfx('release'); return true;
}
// ---- fetch robots: dock row under the racks, drive along the dock and up/down the aisles
const DOCK_Y = RACK.top + RACK.levels*RACK.lh + 10, LIFT_X = WH.x + WH.w - 24;
function aisleX(a){ return WH.x+14 + a*RACK.aw + RACK.aw*0.49; }
function robotHome(i){ return { x: WH.x + 22 + i*21, y: DOCK_Y }; }
function robotCount(){ return ROBOT.base + ((G.upgrades.warehouse||{}).fetchers || 0); }
function syncRobots(){
  G.robots = G.robots || [];
  while (G.robots.length < robotCount()){ const i = G.robots.length, h = robotHome(i); G.robots.push({ i, x:h.x, y:h.y, state:'idle', path:null, job:null, t:0, carry:false, dir:1 }); }
}
function robotGo(r, pts, next){ r.path = mkPath([{ x:r.x, y:r.y }, ...pts], -1); r.state = next; }
function updateRobots(dt){
  syncRobots();
  const sp = ROBOT.speed * (1 + 0.4*((G.upgrades.warehouse||{}).shuttle || 0)), c = G.st.commission;
  for (const r of G.robots){
    if (r.state === 'idle' || r.state === 'homing'){
      if (G.jobs.length){ // take the next job
        const job = G.jobs.shift(); if (job.line.state !== 'queued'){ continue; }
        job.line.state = 'retrieving'; r.job = job;
        const q = rackPos(job.line.slot), ax = aisleX(job.line.slot.a);
        robotGo(r, [{ x:ax, y:DOCK_Y }, { x:ax, y:q.y }], 'toSlot'); continue;
      }
    }
    if (r.path){
      const before = { x:r.x, y:r.y };
      r.path.d += sp*dt; const q = along(r.path, r.path.d); r.x = q.x; r.y = q.y;
      if (Math.abs(q.x-before.x) > 0.01) r.dir = q.x > before.x ? 1 : -1;
      if (r.path.d < r.path.len) continue;
      r.path = null;
      if (r.state === 'toSlot'){ r.state = 'grab'; r.t = ROBOT.grab; }
      else if (r.state === 'toLift'){ r.state = 'drop'; r.t = ROBOT.drop; }
      else if (r.state === 'homing'){ r.state = 'idle'; }
      continue;
    }
    if (r.state === 'grab'){ r.t -= dt; if (r.t <= 0){ r.carry = true; robotGo(r, [{ x:r.x, y:DOCK_Y }, { x:LIFT_X, y:DOCK_Y }], 'toLift'); } }
    else if (r.state === 'drop'){ r.t -= dt; if (r.t <= 0){
      r.carry = false; const job = r.job; r.job = null;
      if (c){ const cy = c.y + c.h/2; G.fetch.push({ o:job.o, line:job.line, path: mkPath([{ x:LIFT_X, y:DOCK_Y }, { x:LIFT_X, y:cy }, { x:c.x+6, y:cy }], -1) }); }
      else job.line.state = 'atPick';
      const h = robotHome(r.i); robotGo(r, [h], 'homing');
    } }
  }
}
function drawRobot(r, t){
  ctx.save(); ctx.translate(r.x, r.y);
  const busy = r.state !== 'idle', bob = busy ? Math.sin(t*22 + r.i)*0.6 : 0;
  // grab arm reaching into the rack
  if (r.state === 'grab' && r.job){ const k = 1 - r.t/ROBOT.grab, side = r.job.line.slot.side ? 1 : -1, reach = 13*Math.sin(Math.min(1,k)*Math.PI);
    ctx.fillStyle = '#9aa6bb'; ctx.fillRect(side > 0 ? 0 : -reach, -1.5, reach, 3); }
  ctx.translate(0, bob);
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1.5;
  rr(-8, -6, 16, 12, 3); ctx.fillStyle = '#ff8a1f'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#c4620b'; ctx.fillRect(-8, 3, 16, 3);
  ctx.fillStyle = '#1c2230'; ctx.fillRect(-7, 6, 4, 2); ctx.fillRect(3, 6, 4, 2);
  // face / sensor
  ctx.fillStyle = '#1d2a3d'; rr(-5 + r.dir*1.5, -4, 10, 5, 1.5); ctx.fill();
  const lamp = r.state === 'idle' ? '#3ddc84' : (Math.floor(t*6 + r.i) % 2 ? '#ffc53d' : '#fff3c4');
  ctx.fillStyle = lamp; ctx.beginPath(); ctx.arc(r.dir*2.5, -1.5, 1.3, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd9b0'; ctx.fillRect(-1, -9, 2, 3); ctx.fillStyle = lamp; ctx.fillRect(-1.5, -10, 3, 1.5);
  if (r.carry && r.job){ ctx.save(); ctx.translate(0, -12); ctx.scale(0.72, 0.72); drawTote(0, 0, r.job.o.color, r.job.line.item.icon, false, false, false); ctx.restore(); }
  ctx.restore();
}
function rackHit(p){
  const hb = hbwHit(p); if (hb) return hb;
  if (p.x < WH.x || p.x > WH.x+WH.w || p.y < WH.y || p.y > WH.y+WH.h) return null;
  let best = null, bd = 1e9;
  for (const o of G.orders) if (!o.pallet) o.lines.forEach((l, li) => { if (l.state !== 'stored') return; const q = rackPos(l.slot), d = Math.hypot(p.x-q.x, p.y-q.y); if (d < 24 && d < bd){ bd = d; best = { o, li }; } });
  return best;
}

function dispatch(hu, st){
  if (!selectable(hu) || G.mode !== 'play') return false;
  if (isPallet(hu)) return dispatchPallet(hu, st);
  if (st.def.place === 'hbw'){ toast('The High-Bay Warehouse only takes pallets.', 'bad'); sfx('error'); return false; }
  if (hu.loc === 'transit' && hu.tr.to === st.id) { G.selected = null; return true; }
  if (!hasRoom(st)){ toast(`${st.def.name} is full. Wait or choose another route.`, 'bad'); sfx('error'); return false; }
  if (hu.loc === 'out'){
    const from = G.stations.find(s => s.out.includes(hu));
    from.out.splice(from.out.indexOf(hu), 1);
    hu.tr = buildPath(from, 0, st);
  } else {
    if (hu.tr.to) G.st[hu.tr.to].incoming--;
    const p = along(hu.tr, hu.tr.d);
    hu.tr = buildPath(null, loopS(p.x, p.y), st);
  }
  hu.loc = 'transit'; st.incoming++;
  G.selected = null; sfx('dispatch'); hideTip('route'); if (hu.flag) hideTip('flag');
  return true;
}

function circle(hu, s){ hu.loc = 'transit'; hu.tr = buildPath(null, s, null); }

function portCheck(hu, st){
  let weightFail = false;
  if (!hu.kind && !hu.pallet && !hu.flag && st.def.role !== 'repair' && Math.random() < TRANSPORT_CHECK.chance){
    hu.flag = { reason:TRANSPORT_CHECK.reason, station:null }; weightFail = true; G.defects++;
    st.scanFlash = 1.2;
  }
  if (validTargets(hu).includes(st)) return true;
  st.incoming--;
  if (weightFail){
    toast(`${ico('scale')} #${hu.order.num}: weight check failed at ${st.def.name}. Route it to Quality Assurance.`, 'warn');
    sfx('flag'); event('flag');
  } else {
    G.wrong++; G.money -= 10; G.earned -= 10; changeSat(-3);
    const why = hu.kind ? `it belongs to ${nextHint(hu)}` : hu.flag ? 'it is flagged and must go to Quality Assurance first'
      : `next step is ${nextHint(hu)}`;
    toast(`${ico('x')} ${st.def.name} rejected ${hu.kind === 'tote' ? 'the return tote' : hu.kind === 'scrap' ? 'the defective item' : hu.kind === 'stock' ? 'the new stock' : '#'+hu.order.num}: ${why}.`, 'bad');
    floatText(st.port.x, st.port.y-14, '−$10', '#ff5468'); sfx('error'); st.flash = -1;
    tip(hu.pallet ? 'wrong_pallet' : 'wrong', hu.pallet ? 'Rejected! A station only accepts pallets that need it <b>next</b>. The transporter parks it in the <b>pallet buffer</b>: click it there and send it somewhere else.'
      : 'Rejected! A station only accepts units that need it <b>next</b>. The unit now circles on the conveyor. <b>Click it on the belt</b> and send it somewhere else.');
  }
  if (!hu.pallet) circle(hu, st.port.s);
  return false;
}

function complete(st, hu){
  const d = st.def, o = hu.order;
  st.processed++;
  if (d.accepts || hu.kind) return;
  if (d.role === 'repair'){
    const f = hu.flag; hu.flag = null;
    if (f && f.line != null){
      // wrong item: send the wrong tote back to storage, the order needs a fresh tote + a re-pick
      const line = o.lines[f.line]; line.state = 'stored'; line.slot = freeRackSlot();
      const tote = { id:++G.huSeq, kind:'tote', order:o, item:line.item, flag:null, loc:'out' };
      G.hus.push(tote);
      if (st.out.length < st.outMax){ st.out.push(tote); } else circle(tote, st.port.s);
      floatText(st.dock.x, st.y+10, 'Wrong tote found', '#ffc53d'); sfx('fix');
      tip('return', `QA found the wrong item. Two jobs now: 1) route the grey <b>↩ return tote</b> back to the <b>Shuttle Warehouse</b> (key <span class="kbd">0</span>), 2) click the order's new <b style="color:var(--accent)">glowing tote</b> in the warehouse and send HU <b>#${o.num}</b> back to <b>Commissioning</b> for a re-pick.`);
      return;
    }
    if (f && d.issue && o.type !== 'recal' && !o.pallet && Math.random() < d.issue.chance){
      // not fixable: the item is defective -> goes to Retoure, a replacement must be commissioned
      const li = Math.floor(Math.random()*o.lines.length), line = o.lines[li];
      line.state = 'stored'; line.slot = freeRackSlot(); o.steps.pick = 'todo';
      if (o.type === 'regrind' && o.steps.regrind) o.steps.regrind = 'done'; // a worn-out return is replaced by a new tool: no regrinding needed
      const scrap = { id:++G.huSeq, kind:'scrap', order:o, item:line.item, flag:null, loc:'out' };
      G.hus.push(scrap);
      if (st.out.length < st.outMax) st.out.push(scrap); else circle(scrap, st.port.s);
      floatText(st.dock.x, st.y+10, d.issue.reason + '!', '#ff5468'); sfx('flag');
      toast(`${ico('x')} #${o.num}: ${line.item.name} is ${o.type === 'regrind' ? 'worn beyond regrinding' : 'defective'}. Send it to Retoure and commission a new one.`, 'bad');
      tip('retoure', `QA couldn't fix it: the <b>${line.item.name}</b> is defective. 1) route the <b>red box</b> to <b>Retoure</b> (next to Packing), 2) click the order's new <b style="color:var(--accent)">glowing tote</b> in the warehouse, 3) send HU <b>#${o.num}</b> back to <b>Commissioning</b>.`);
      return;
    }
    floatText(st.dock.x, st.y+10, 'Corrected ✓', '#3ddc84'); sfx('fix'); return;
  }
  const step = d.handles;
  let pickedNow = [];
  if (d.needsTotes){ o.lines.forEach((l, i) => { if (l.state === 'atPick'){ l.state = 'picked'; pickedNow.push(i); } }); }
  if (o.type === 'recal' && step === 'calibration'){
    o.steps[step] = 'done';
    if (Math.random() < INBOUND.recalFail * st.qualMul){
      // out of tolerance: no guarantee possible -> skip the remaining services, ship it straight back to the customer
      o.notOk = true; for (const k of Object.keys(o.steps)) if (k !== 'pack' && o.steps[k] === 'todo') o.steps[k] = 'skip';
      floatText(st.dock.x, st.y+10, 'Not OK: back to customer', '#ffc53d'); sfx('flag');
      toast(`${ico('warn')} #${o.num}: out of tolerance, no guarantee possible. Send it straight back to the customer via Packing & Shipping (not QA).`, 'warn');
      tip('notok', `A returned measuring tool failed calibration. There is no guarantee on worn tools, so it is <b>not</b> repaired by QA: send HU <b>#${o.num}</b> straight to <b>Packing & Shipping</b>, back to the customer. You only get paid for the check.`);
    }
    return;
  }
  if (d.defect && Math.random() < d.defect.chance * st.qualMul){
    hu.flag = { reason:d.defect.reason, station:d.id }; G.defects++;
    if (d.defect.returnTote && pickedNow.length) hu.flag.line = pick(pickedNow);
    o.steps[step] = d.defect.redo ? 'todo' : 'done';
    toast(`${ico('warn')} #${o.num}: ${d.defect.reason} at ${d.name}. Send it to Quality Assurance.`, 'warn');
    sfx('flag'); event('flag');
  } else o.steps[step] = 'done';
}

function ship(hu){
  const o = hu.order; o.shipped = true; hu.gone = true;
  G.hus.splice(G.hus.indexOf(hu), 1); G.orders.splice(G.orders.indexOf(o), 1);
  if (G.selected === hu) G.selected = null;
  const services = Object.keys(o.steps).filter(k => k !== 'pick' && k !== 'pack' && k !== 'receive' && o.steps[k] === 'done').length;
  let pay = 40 + 25*services; if (o.focus) pay *= 1.5;
  const late = G.time > o.due;
  if (late){ pay *= 0.4; G.lateShip++; } else { G.onTime++; changeSat(+2); }
  if (!G.hints) pay *= 1.25;
  pay = Math.round(pay);
  G.money += pay; G.earned += pay; G.shipped++;
  G.shippedLog.unshift({ num:o.num, late, pay, color:o.color }); G.shippedLog.length = Math.min(G.shippedLog.length, 5);
  const pk = G.st.pack;
  floatText(pk.x+pk.w/2, pk.y-6, `+$${pay}`, late ? '#ffc53d' : '#3ddc84');
  G.flyers.push({ x0:pk.x+pk.w/2, y0:pk.y+pk.h, x1:G.truck.x-20, y1:640, t:0, color:o.color });
  sfx('ship'); event('ship');
  if (!G.goalToast && G.shipped >= G.cfg.goal){ G.goalToast = true; toast(ico('target') + ' Shift goal reached! Everything else is bonus.', 'good'); sfx('fix'); }
}

function isReady(st, hu){
  if (!st.def.needsTotes || hu.kind || hu.pallet) return true;
  const o = hu.order; return o.lines.every(l => l.state === 'atPick' || l.state === 'picked') && o.lines.some(l => l.state === 'atPick');
}
function removeObj(hu){ hu.gone = true; const i = G.hus.indexOf(hu); if (i >= 0) G.hus.splice(i, 1); if (G.selected === hu) G.selected = null; }
function changeSat(d){
  G.sat = clamp(G.sat + d, 0, 100);
  if (G.sat <= 0 && G.mode === 'play') endShift(true);
}

function update(dt){
  if (G.mode !== 'play') return;
  G.time += dt;
  const cfg = G.cfg;
  // spawn orders
  if (G.time >= G.nextSpawn && G.time < cfg.duration - 18){
    makeOrder(); G.nextSpawn = G.time + rand(cfg.spawn[0], cfg.spawn[1]);
  }
  // Goods-in: trucks unload returns and (rarely) new stock on their own
  const gi = G.st.goodsin;
  if (gi){
    G.stockT -= dt;
    if (G.stockT <= 0 && G.time < cfg.duration - 15){
      G.stockT = rand(INBOUND.stockEvery[0], INBOUND.stockEvery[1]);
      const pal = activeHas('hbw') && Math.random() < PALLET.stockShare;
      G.inbound.push({ stock:true, pallet:pal, item:pick(ITEMS.filter(i => pal ? i.tags.includes('oversize') : SMALL(i))) });
    }
    while (G.inbound.length && hasRoom(gi)){
      const d = G.inbound.shift(); let hu;
      if (d.stock && d.pallet){ hu = { id:++G.huSeq, kind:'pstock', pallet:true, item:d.item, order:{ num:'NEW', color:STOCK_COLOR, due:1e9, customer:'Supplier', steps:{} }, flag:null, loc:'queue' };
        tip('pstock', `A <b>new pallet</b> of oversize tools is being unloaded at <b>Goods-in</b>. When it's ready, send it to the <b>High-Bay Warehouse</b>: a transporter takes it there.`); }
      else if (d.stock){ hu = { id:++G.huSeq, kind:'stock', item:d.item, order:{ num:'NEW', color:STOCK_COLOR, due:1e9, customer:'Supplier', steps:{} }, flag:null, loc:'queue' };
        tip('stock', `A delivery of <b>new stock</b> (cardboard box) is being unloaded at <b>Goods-in</b>. When it's ready, route it to the <b>Shuttle Warehouse</b> (key <span class="kbd">0</span>) so it can be stored.`); }
      else { hu = { id:++G.huSeq, order:d.o, flag:null, loc:'queue' }; d.o.hu = hu; d.o.released = true; }
      G.hus.push(hu); gi.queue.push(hu);
    }
  }
  // overdue
  for (const o of G.orders){
    if (!o.late && G.time > o.due){ o.late = true; changeSat(-6); toast(`${ico('clock')} Order #${o.num} for ${o.customer} is overdue!`, 'bad'); sfx('late'); }
  }
  // transport
  for (const hu of G.hus){
    if (hu.loc !== 'transit') continue;
    const tr = hu.tr;
    tr.d += G.convSpeed * (tr.speedMul||1) * dt;
    if (tr.to && !tr.checked && tr.portAt >= 0 && tr.d >= tr.portAt){
      tr.checked = true;
      if (!portCheck(hu, G.st[tr.to])) continue;
    }
    if (tr.d >= tr.len){
      if (tr.to){ const st = G.st[tr.to]; st.incoming--; st.queue.push(hu); hu.loc = 'queue'; hu.tr = null; sfx('clunk'); }
      else circle(hu, tr.loopS);
    }
  }
  // totes coming out of the shuttle warehouse
  const wu = G.upgrades.warehouse || {};
  if (wu.auto && G.st.warehouse){
    G.autoT = (G.autoT || 0) - dt;
    if (G.autoT <= 0 && !G.jobs.length){
      G.autoT = 1.4;
      const c = G.st.commission;
      const o = G.orders.filter(o => !o.pallet && o.lines.some(l => l.state === 'stored') && (o.hu || hasRoom(c))).sort((a,b) => (b.hu?1:0)-(a.hu?1:0) || a.due-b.due)[0];
      if (o){ const s0 = G.silent; G.silent = true; retrieve(o, o.lines.findIndex(l => l.state === 'stored')); G.silent = s0; }
    }
  }
  updateRobots(dt); updateCrane(dt); updateMovers(dt);
  for (const f of G.fetch){ f.path.d += RETRIEVE_SPEED*(1 + 0.4*(wu.shuttle||0))*dt; if (f.path.d >= f.path.len){ f.line.state = 'atPick'; f.done = true; } }
  G.fetch = G.fetch.filter(f => !f.done);
  // stations
  for (const st of G.stations){
    st.flash = st.flash > 0 ? Math.max(0, st.flash - dt) : Math.min(0, st.flash + dt);
    st.scanFlash = Math.max(0, st.scanFlash - dt);
    st.busyT += (st.slots.filter(Boolean).length / st.slotCount) * dt;
    for (let i=0; i<st.slotCount; i++){
      let s = st.slots[i];
      if (!s && st.queue.length){
        const qi = st.queue.findIndex(h => isReady(st, h));
        if (qi >= 0){ const hu = st.queue.splice(qi, 1)[0]; hu.loc = 'slot';
          let dur = st.def.time*st.speedMul*rand(0.88,1.12);
          if (st.def.needsTotes && !hu.pallet){ const o = hu.order; dur *= 0.45 + 0.55*o.lines.filter(l => l.state==='atPick').length/o.lines.length; }
          s = st.slots[i] = { hu, t:0, dur, done:false, blocked:false }; }
      }
      if (!s) continue;
      if (!s.done){ s.t += dt; if (s.t >= s.dur){ s.done = true; complete(st, s.hu); } }
      if (s.done){
        const hu = s.hu;
        if (st.def.accepts){ removeObj(hu); st.slots[i] = null;
          const fx = st.dock.x + (st.side === 'right' ? 60 : 20);
          if (hu.kind === 'stock' || hu.kind === 'pstock'){ G.stocked++; G.money += INBOUND.stockPay; G.earned += INBOUND.stockPay; floatText(fx, st.dock.y-16, `Restocked +$${INBOUND.stockPay}`, '#3ddc84'); }
          else floatText(fx, st.dock.y-16, st.def.role === 'storage' ? 'Stored ✓' : 'Returned ✓', '#3ddc84');
          sfx('clunk'); }
        else if (st.def.role === 'sink' && !hu.kind && !hu.flag && !pendingSteps(hu.order).length){ ship(hu); st.slots[i] = null; }
        else if (st.outMax === 0){ st.slots[i] = null; circle(hu, st.port.s); }
        else if (st.out.length < st.outMax){
          st.out.push(hu); hu.loc = 'out'; st.slots[i] = null; s.blocked = false; st.flash = 0.6; sfx('done'); event('ready', hu);
        } else s.blocked = true;
      }
    }
  }
  for (const st of G.stations) autoRoute(st, dt);
  updateWorkers(dt);
  // truck
  const tk = G.truck; tk.t += dt;
  if (tk.state === 'leaving'){ tk.x += 260*dt; if (tk.x > W + 200){ tk.state = 'arriving'; tk.x = W + 200; tk.load = 0; } }
  else if (tk.state === 'arriving'){ tk.x = Math.max(1210, tk.x - 260*dt); if (tk.x === 1210) tk.state = 'parked'; }
  for (const f of G.flyers){ f.t += dt*1.6; if (f.t >= 1 && !f.done){ f.done = true; tk.load++; if (tk.load >= 4 && tk.state==='parked'){ tk.state='leaving'; sfx('truck'); } } }
  G.flyers = G.flyers.filter(f => f.t < 1.05);
  for (const f of G.floats) f.t += dt;
  G.floats = G.floats.filter(f => f.t < 1.4);
  if (G.selected && !selectable(G.selected)) G.selected = null;
  if (G.time >= cfg.duration) endShift(false);
}

// ---------- automation: per-station auto-router ----------
const isException = hu => !!(hu.flag || hu.kind === 'tote' || hu.kind === 'scrap');
function autoRoute(st, dt){
  const a = st.auto; if (!a || !a.level) return;
  a.pulse = Math.max(0, a.pulse - dt);
  if (a.state !== 'ok'){ a.brokeT += dt; return; }   // broken: the player routes by hand until a service worker fixed it
  a.cd = Math.max(0, a.cd - dt); if (a.cd > 0) return;
  const units = st.def.id === 'hbw' ? G.hbwOut.filter(Boolean) : st.out;
  for (const hu of units){
    if (hu.loc !== 'out' || hu === G.selected) continue;
    if (isException(hu) && !a.exceptions) continue;   // happy path only: the player handles QA cases
    const t = validTargets(hu).filter(hasRoom); if (!t.length) continue;
    // several services possible: take the least busy station
    t.sort((p, q) => (p.queue.length + p.incoming - p.slotCount) - (q.queue.length + q.incoming - q.slotCount));
    const sel = G.selected, s0 = G.silent; G.silent = true;
    const ok = dispatch(hu, t[0]); G.silent = s0; if (sel && sel !== hu) G.selected = sel;
    if (ok){ a.cd = AUTO.interval[a.level]; a.pulse = 0.7; a.routed++; G.autoRouted = (G.autoRouted || 0) + 1;
      if (G.maint && --a.life <= 0) breakDown(st);
      return; }
  }
}
function drawAutoBadge(st, x, y){
  const a = st.auto; if (!a || !a.level) return;
  st.badge = { x, y, w:54, h:15 };
  if (a.state !== 'ok') return drawBrokenBadge(st, x, y);
  const w = 54, pulse = a.pulse > 0 ? a.pulse/0.7 : 0;
  ctx.save();
  if (pulse){ ctx.shadowColor = '#3ddc84'; ctx.shadowBlur = 12*pulse; }
  rr(x, y, w, 15, 5); ctx.fillStyle = a.state === 'ok' ? '#10251b' : '#2a1414'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = a.exceptions ? '#ffc53d' : '#3ddc84'; ctx.lineWidth = 1.2; rr(x, y, w, 15, 5); ctx.stroke();
  // cooldown fill
  const k = a.cd > 0 ? 1 - a.cd / AUTO.interval[a.level] : 1;
  ctx.save(); rr(x, y, w, 15, 5); ctx.clip(); ctx.fillStyle = 'rgba(61,220,132,0.18)'; ctx.fillRect(x, y, w*k, 15); ctx.restore();
  ctx.fillStyle = a.exceptions ? '#ffc53d' : '#3ddc84'; ctx.font = `800 8.5px ${FONT}`; ctx.textAlign = 'left';
  ctx.fillText(a.exceptions ? 'AUTO+' : 'AUTO', x+6, y+10.5);
  for (let i=0; i<3; i++){ ctx.beginPath(); ctx.arc(x + w - 20 + i*6, y+7.5, 2, 0, 7); ctx.fillStyle = i < a.level ? (a.exceptions ? '#ffc53d' : '#3ddc84') : '#2c3850'; ctx.fill(); }
  ctx.restore();
}

// ---------- maintenance: breakdowns and service workers ----------
function breakDown(st){
  const a = st.auto; a.state = 'broken'; a.brokeT = 0; a.rep = 0; G.breakdowns++;
  st.flash = -0.8; sfx('error');
  toast(`${ico('wrench')} ${st.def.name}: automation broke down. Click it to send a service worker.`, 'bad');
  tip('maint', `<b>Automation needs maintenance.</b> With this much automation in the hall, auto-routers wear out and break down. A broken one shows a red <b>BROKEN</b> badge. <b>Click the station</b> (with nothing selected) to send a service worker from the <b>Service</b> room. While it is broken, you route that station's units by hand.`);
}
function sendService(st){
  const a = st.auto; if (!G.maint || !a || a.state !== 'broken') return false;
  a.state = 'called'; G.serviceQ.push(st); sfx('dispatch');
  if (!G.workers.some(w => w.state === 'idle' || w.state === 'return')) floatText(st.x + st.w/2, st.y - 14, 'Service queued', '#ffc53d');
  return true;
}
function workerHome(i){ const r = MAINT.room; return { x:r.x + 40 + i*34, y:r.y + r.h - 22 }; }
// walking network: a corridor ring between the conveyor loop and the stations, plus a lane down to the Service room
const WALK = { x0:414, y0:270, x1:1080, y1:530 }; WALK.w = WALK.x1 - WALK.x0; WALK.h = WALK.y1 - WALK.y0; WALK.L = 2*(WALK.w + WALK.h);
function servicePlace(st, homeP){
  // P: where the worker stands. chain: from P out to a point on the corridor ring (last entry). south: reached via the lane below
  const RB = { x:WALK.x1, y:WALK.y1 }, lane = { x:WALK.x1, y:MAINT.room.y + 35 };
  if (!st){ const P = homeP; return { P, chain:[P, { x:MAINT.room.x + 12, y:lane.y }, lane, RB], south:true }; }
  if (st.def.id === 'hbw'){ const P = { x:HB_BAYS[0].x - 26, y:HB_BAYS[0].y - 28 }, low = { x:WALK.x1, y:ROAD.y1 - 20 };
    return { P, chain:[P, { x:P.x, y:low.y }, low, lane, RB], south:true }; }
  let P, E;
  // the worker stands just left of the AUTO badge (top-left corner of the station)
  if (st.side === 'top'){ const gx = st.x - 7; P = { x:st.x - 2, y:st.y - 1 }; return { P, chain:[P, { x:gx, y:st.y + 8 }, { x:gx, y:WALK.y0 }], south:false }; }
  if (st.side === 'bottom'){ P = { x:st.x - 1, y:st.y - 3 }; E = { x:P.x, y:WALK.y1 }; }
  else if (st.side === 'right'){ P = { x:st.x - 4, y:st.y - 1 }; E = { x:WALK.x1, y:P.y }; }
  else { P = { x:st.x + 72, y:st.y - 7 }; E = { x:WALK.x0, y:P.y }; }
  return { P, chain:[P, E], south:false };
}
function workerRoute(from, to){
  // from/to: places from servicePlace. Returns a polyline from from.P to to.P
  let pts;
  if (from.south && to.south){
    const a = from.chain.slice(0, -1), b = to.chain.slice(0, -1);
    pts = [...a, ...b.reverse()];
  } else {
    const ea = from.chain[from.chain.length-1], eb = to.chain[to.chain.length-1];
    const s0 = ringS(WALK, ea.x, ea.y); let d = ringS(WALK, eb.x, eb.y) - s0;
    d = ((d % WALK.L) + WALK.L) % WALK.L; if (d > WALK.L/2) d -= WALK.L;
    pts = [...from.chain, ...ringCorners(WALK, s0, s0 + d, d >= 0 ? 1 : -1), ...to.chain.slice().reverse()];
  }
  const out = []; for (const q of pts){ const l = out[out.length-1]; if (!l || Math.hypot(l.x-q.x, l.y-q.y) > 0.5) out.push({ x:q.x, y:q.y }); }
  return mkWalk(out);
}
function mkWalk(pts){ const seg = []; let len = 0; for (let i=1; i<pts.length; i++){ const l = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); seg.push(l); len += l; } return { pts, seg, len, d:0 }; }
function walkAt(w){ let d = w.d; for (let i=0; i<w.seg.length; i++){ if (d <= w.seg[i] || i === w.seg.length-1){ const a = w.pts[i], b = w.pts[i+1], k = w.seg[i] ? Math.min(1, d/w.seg[i]) : 1;
  return { x:a.x + (b.x-a.x)*k, y:a.y + (b.y-a.y)*k, ang:Math.atan2(b.y-a.y, b.x-a.x), i }; } d -= w.seg[i]; } return { x:w.pts[0].x, y:w.pts[0].y, ang:0, i:0 }; }
function homePlace(i){ return servicePlace(null, workerHome(i)); }
function workerPlace(w){ return w.at ? servicePlace(w.at) : homePlace(w.i); }
function takeJob(w){
  const st = G.serviceQ.shift(); if (!st) return false;
  w.path = workerRoute(workerPlace(w), servicePlace(st)); w.job = st; w.state = 'walk'; w.at = null; return true;
}
function updateWorkers(dt){
  if (!G.maint) return;
  for (const w of G.workers){
    if ((w.state === 'idle' || w.state === 'return') && G.serviceQ.length){
      if (w.state === 'return'){ // turn around where it is: walk from its current position via the lane
        const p = walkAt(w.path);
        const back = [{ x:p.x, y:p.y }, ...w.path.pts.slice(0, p.i + 1).reverse()];
        const st = G.serviceQ.shift(), to = servicePlace(st), tail = workerRoute(w.prevPlace, to).pts;
        w.path = mkWalk([...back, ...tail.slice(1)]); w.job = st; w.state = 'walk';
      } else takeJob(w);
    }
    if (w.state === 'walk' || w.state === 'return'){
      w.path.d = Math.min(w.path.len, w.path.d + MAINT.walk*dt); w.step += dt;
      const p = walkAt(w.path); w.x = p.x; w.y = p.y; w.ang = lerpAng(w.ang, p.ang, Math.min(1, dt*14));
      if (w.path.d >= w.path.len){
        if (w.state === 'walk'){ w.state = 'repair'; w.t = 0; w.at = w.job; w.job.auto.state = 'repair'; w.path = null; sfx('clunk');
          const b = w.at.badge || { x:w.at.x + 8, y:w.at.y - 8, w:54, h:15 }; w.face = Math.atan2(b.y + 7 - w.y, b.x + 27 - w.x); }
        else { w.state = 'idle'; w.path = null; w.at = null; w.ang = -Math.PI/2; }
      }
    } else if (w.state === 'repair'){
      w.t += dt; w.ang = lerpAng(w.ang, w.face, Math.min(1, dt*10));
      const a = w.at.auto; a.rep = Math.min(1, w.t / MAINT.repair);
      if (w.t >= MAINT.repair){
        a.state = 'ok'; a.rep = 0; a.cd = 0.6; a.pulse = 0.7; a.life = rand(MAINT.life[0], MAINT.life[1]); G.repairs++;
        floatText(w.at.x + w.at.w/2, (w.at.def.id === 'hbw' ? HB.y : w.at.y) - 16, 'Repaired', '#3ddc84'); sfx('fix');
        const from = servicePlace(w.at);
        if (!takeJob(w)){ w.prevPlace = from; w.path = workerRoute(from, homePlace(w.i)); w.state = 'return'; w.at = null; w.job = null; }
      }
    }
  }
}
function lerpAng(a, b, k){ let d = b - a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return a + d*k; }
function drawBrokenBadge(st, x, y){
  const a = st.auto, t = perfT/1000, w = 54;
  const blink = a.state === 'broken' ? (Math.floor(t*3) % 2 === 0) : true;
  ctx.save();
  if (a.state === 'broken'){ ctx.shadowColor = '#ff5468'; ctx.shadowBlur = 8 + 6*Math.sin(t*6); }
  rr(x, y, w, 15, 5); ctx.fillStyle = a.state === 'repair' ? '#2a2210' : '#3a1218'; ctx.fill(); ctx.shadowColor = 'transparent';
  if (a.state === 'repair'){ ctx.save(); rr(x, y, w, 15, 5); ctx.clip(); ctx.fillStyle = 'rgba(255,197,61,0.35)'; ctx.fillRect(x, y, w*a.rep, 15); ctx.restore(); }
  const col = a.state === 'repair' ? '#ffc53d' : a.state === 'called' ? '#ffb15c' : '#ff5468';
  ctx.strokeStyle = col; ctx.lineWidth = 1.4; rr(x, y, w, 15, 5); ctx.stroke();
  if (blink){ drawIcon('wrench', x + 9, y + 7.5, 10, col, 2.6);
    ctx.fillStyle = col; ctx.font = `800 8.5px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText(a.state === 'broken' ? 'BROKEN' : a.state === 'called' ? 'CALLED' : 'REPAIR', x + 16, y + 10.5); }
  ctx.restore();
  if (a.state === 'broken'){
    // sparks and a little smoke from the dead controller
    for (let i=0; i<4; i++){ const ph = (t*1.7 + i*0.27) % 1, sx = x + w - 6, sy = y + 4;
      ctx.globalAlpha = (1 - ph) * 0.9; ctx.fillStyle = i % 2 ? '#ffd166' : '#ff8a1f';
      ctx.beginPath(); ctx.arc(sx + Math.cos(i*2.3)*ph*14, sy - ph*10 + ph*ph*16 - 4, 1.4, 0, 7); ctx.fill(); }
    for (let i=0; i<2; i++){ const ph = (t*0.5 + i*0.5) % 1; ctx.globalAlpha = (1 - ph) * 0.35; ctx.fillStyle = '#9aa6bb';
      ctx.beginPath(); ctx.arc(x + w - 10 + Math.sin(ph*5 + i)*4, y - 2 - ph*18, 3 + ph*5, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (!G.serviceQ.includes(st)){ ctx.fillStyle = '#ff8a9a'; ctx.font = `700 8.5px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText('click to repair', x + w + 5, y + 10.5); }
  }
}
function drawServiceRoom(t){
  if (!G.maint) return;
  const { x, y, w, h } = MAINT.room, free = G.workers.filter(k => k.state === 'idle').length;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  rr(x, y, w, h, 10); ctx.fillStyle = '#18202e'; ctx.fill(); ctx.restore();
  ctx.save(); rr(x, y, w, h, 10); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.025)'; ctx.lineWidth = 1;
  for (let i=-h; i<w; i+=10){ ctx.beginPath(); ctx.moveTo(x+i, y+h); ctx.lineTo(x+i+h, y); ctx.stroke(); }
  // header strip
  ctx.fillStyle = '#ffc53d'; ctx.fillRect(x, y, w, 18);
  ctx.restore();
  drawIcon('wrench', x + 11, y + 9, 11, '#151b26', 2.6);
  ctx.fillStyle = '#151b26'; ctx.font = `900 10px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText('SERVICE', x + 20, y + 13);
  ctx.textAlign = 'right'; ctx.font = `800 9px ${FONT}`; ctx.fillText(`${free}/${G.workers.length} free`, x + w - 8, y + 13);
  // pegboard with tools and a workbench

function endShift(failedSat){
  if (G.mode !== 'play') return;
  G.mode = 'result'; G.selected = null;
  const cfg = G.cfg, passed = !failedSat && G.shipped >= cfg.goal;
  const ratio = G.shipped ? G.onTime / G.shipped : 0;
  let stars = 0;
  if (passed){ stars = 1; if (ratio >= 0.7) stars = 2; if (ratio >= 0.9 && G.sat >= 70) stars = 3; }
  let bonus = 0;
  if (passed){ bonus = 100 + 40*stars; G.money += bonus; G.best = Math.max(G.best||0, G.shiftIdx+1); }
  // a failed shift still pays out: you keep half of what you earned (no bonus) to spend on upgrades
  const kept = passed ? 0 : Math.max(0, Math.round(G.earned * FAIL_PAYOUT));
  if (!passed) G.money = G.startMoney + kept;
  G.result = { passed, failedSat, stars, ratio, bonus, kept };
  G.lastLoad = Object.fromEntries(G.stations.map(s => [s.id, clamp(s.busyT / Math.max(1, G.time), 0, 1)]));
  if (!G.silent){ tipQueue.length = 0; hideTip(null); sfx(passed ? 'fanfare' : 'fail'); showResult(); }
}

//  HIGH-BAY PALLET WAREHOUSE, INDOOR ROADS AND TRANSPORTERS
//  Oversize tools live on Euro pallets in the high-bay warehouse (bottom). A stacker crane brings a
//  requested pallet to the pallet I/O. Pallets never ride the conveyor: transporters with a driver
//  carry them over a ring road to the pallet bay of each station. Same stations, same routing rules.
// ===================================================================
const ROAD = { x0:214, y0:40, x1:1336, y1:800, half:12, lane:6 };
ROAD.w = ROAD.x1-ROAD.x0; ROAD.h = ROAD.y1-ROAD.y0; ROAD.L = 2*(ROAD.w+ROAD.h);

function ringPos(R, s){
  const {x0,y0,x1,y1,w,h,L} = R; s = ((s%L)+L)%L;

function ringS(R, x, y){

function ringLane(R, p, off){

  return { x, y };
}
function ringCorners(R, s0, s1, dir){

  if (dir > 0) all.filter(c => c > s0+1e-6 && c < s1-1e-6).sort((a,b)=>a-b).forEach(c => out.push(ringPos(R, c)));
  else all.filter(c => c < s0-1e-6 && c > s1+1e-6).sort((a,b)=>b-a).forEach(c => out.push(ringPos(R, c)));

}
// Road route: leave the bay, drive on the right-hand lane the short way round, turn into the target bay.
// The check point (portAt) is where the transporter turns off the ring road at the destination.
function roadPath(from, to, stopShort){
  const R = ROAD, L = R.L, s0 = ringS(R, from.x, from.y); let s1 = ringS(R, to.x, to.y);

  ringCorners(R, s0, s1, dir).forEach(p => pts.push(ringLane(R, p, off)));
  pts.push(ringLane(R, ringPos(R, s1), off));

  pts.push({ x:to.x - dx/d*k, y:to.y - dy/d*k });
  return mkPath(pts, portIdx);
}
const isPallet = hu => !!(hu && hu.pallet);
function resetPallets(){
  Object.assign(G, { crane:{ x:HB.ioX, tx:HB.ioX, state:'idle', job:null, t:0, carry:false }, craneJobs:[], hbwOut:[null, null], hbwFeed:[], holding:[], movers:[] });
}
function hbSlotPos(sl){ return { x: HB.x + 28 + sl.c*26, y: sl.r === 0 ? (sl.d ? 858 : 882) : (sl.d ? 972 : 948) }; }
function hbwSlot(){
  const used = new Set(); (G.orders||[]).forEach(o => o.pallet && o.lines.forEach(l => l.state === 'stored' && l.slot && used.add(l.slot.c+'-'+l.slot.r+'-'+l.slot.d)));
  for (let i=0; i<80; i++){ const sl = { h:1, c:randInt(0, HB.cols-1), r:randInt(0,1), d:randInt(0,1) }; if (!used.has(sl.c+'-'+sl.r+'-'+sl.d)) return sl; }
  return { h:1, c:0, r:0, d:0 };
}
function moverCount(){ return MOVER.base + ((G.upgrades.hbw||{}).movers || 0); }
function depotPos(i){ return { x: DEPOT.x + i*DEPOT.sp, y: DEPOT.y }; }
function holdPos(i){ return { x: HOLD.x + (i%HOLD.per)*HOLD.sp, y: HOLD.y + Math.floor(i/HOLD.per)*30 }; }
function bayPos(st, i){ const b = st.bay, n = Math.max(1, st.outMax); return b.vert ? { x:b.x, y:b.y + (i-(n-1)/2)*27 } : { x:b.x + (i-(n-1)/2)*30, y:b.y }; }

function palletSpot(hu){
  let i;

  if ((i = G.holding.indexOf(hu)) >= 0) return holdPos(i);
  for (const st of G.stations) if ((i = st.out.indexOf(hu)) >= 0) return st.bay ? bayPos(st, i) : outPos(st, i);

}
function takePallet(hu){
  const i = G.hbwOut.indexOf(hu); if (i >= 0){ G.hbwOut[i] = null; return; }
  for (const arr of [G.holding, ...G.stations.map(s => s.out)]){ const k = arr.indexOf(hu); if (k >= 0){ arr.splice(k, 1); return; } }
}
function forkPos(m, ext=16){ return { x: m.x + Math.cos(m.ang)*ext, y: m.y + Math.sin(m.ang)*ext }; }
function turnTo(a, b, step){ let d = ((b - a + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI; return Math.abs(d) <= step ? b : a + Math.sign(d)*step; }

  G.movers = G.movers || [];
  while (G.movers.length < Math.min(DEPOT.max, moverCount())){ const i = G.movers.length, p = depotPos(i);
    G.movers.push({ i, x:p.x, y:p.y, ang:Math.PI/2, state:'idle', path:null, job:null, t:0, v:0, rev:0, from:null, to:null }); }

function moverGo(m, to, state, stopShort){
  m.path = roadPath({ x:m.x, y:m.y }, to, stopShort); m.state = state;
  // back out of a bay (reverse) instead of spinning round on the spot
  const p = m.path.pts; let k = 1; while (k < p.length-1 && Math.hypot(p[k].x-m.x, p[k].y-m.y) < 0.5) k++;

// Dispatch a pallet: it waits in its bay until a transporter picks it up (re-routing is allowed until then)
function dispatchPallet(hu, st){
  if (st.def.id === 'warehouse'){ toast('The Shuttle Warehouse only takes totes. Pallets are stored in the High-Bay Warehouse.', 'bad'); sfx('error'); return false; }
  if (hu.loc === 'await' && hu.dest === st){ G.selected = null; return true; }
  if (!hasRoom(st)){ toast(`${st.def.name} is full. Wait or choose another route.`, 'bad'); sfx('error'); return false; }
  if (hu.loc === 'await' && hu.dest) hu.dest.incoming--;
  hu.dest = st; hu.loc = 'await'; st.incoming++;
  G.selected = null; sfx('dispatch'); hideTip('route'); hideTip('pallet_route'); if (hu.flag) hideTip('flag');
  return true;
}
function updateMovers(dt){
  if (!G.roads) return;
  syncMovers();
  const up = G.upgrades.hbw || {}, vmax = MOVER.speed * (1 + 0.2*(up.drive || 0));
  for (const hu of G.hus){
    if (hu.loc !== 'await' || hu.mover) continue;
    const sp = palletSpot(hu); if (!sp) continue;
    const free = G.movers.filter(m => m.state === 'idle' || m.state === 'homing'); if (!free.length) break;
    free.sort((a,b) => Math.hypot(a.x-sp.x, a.y-sp.y) - Math.hypot(b.x-sp.x, b.y-sp.y));
    const m = free[0]; m.job = hu; hu.mover = m; moverGo(m, sp, 'toPick', 16);
  }
  for (const m of G.movers){
    if (m.path){
      const rem = m.path.len - m.path.d;
      m.v = Math.min(vmax, m.v + 280*dt, Math.max(36, rem*2.4));
      const bx = m.x, by = m.y;
      m.path.d = Math.min(m.path.len, m.path.d + m.v*dt);
      const q = along(m.path, m.path.d); m.x = q.x; m.y = q.y;
      const dx = q.x-bx, dy = q.y-by;
      if (Math.hypot(dx, dy) > 0.05){ let a = Math.atan2(dy, dx); if (m.path.d < m.rev) a += Math.PI; m.ang = turnTo(m.ang, a, 10*dt); }
      if (m.state === 'toDrop' && !m.path.checked && m.path.portAt >= 0 && m.path.d >= m.path.portAt){
        m.path.checked = true; const hu = m.job, st = hu.dest;
        if (!portCheck(hu, st)){ hu.dest = null; moverGo(m, holdPos(G.holding.length + G.movers.filter(o => o !== m && o.state === 'toHold').length), 'toHold', 16); continue; }
      }
      if (m.path.d < m.path.len) continue;
      m.path = null; m.v = 0;
      if (m.state === 'toPick'){ const hu = m.job; m.from = palletSpot(hu) || forkPos(m); takePallet(hu); hu.loc = 'carried'; m.state = 'load'; m.t = 0; sfx('clunk'); }
      else if (m.state === 'toDrop'){ m.state = 'unload'; m.t = 0; m.to = dropPoint(m.job.dest); }
      else if (m.state === 'toHold'){ m.state = 'unloadHold'; m.t = 0; m.to = holdPos(G.holding.length); }
      else if (m.state === 'homing'){ m.state = 'idle'; }
      continue;
    }
    if (m.state === 'load'){ m.t += dt; if (m.t >= MOVER.load){ const hu = m.job;
      if (hu.dest) moverGo(m, dropPoint(hu.dest), 'toDrop', 16); else moverGo(m, holdPos(G.holding.length), 'toHold', 16); } }
    else if (m.state === 'unload' || m.state === 'unloadHold'){ m.t += dt; if (m.t >= MOVER.load){
      const hu = m.job; hu.mover = null; m.job = null;
      if (m.state === 'unload'){ const st = hu.dest; hu.dest = null; st.incoming--; st.queue.push(hu); hu.loc = 'queue'; sfx('clunk'); }
      else { G.holding.push(hu); hu.loc = 'out'; tip('pallet_hold', 'A rejected pallet was parked in the <b>pallet buffer</b> (bottom right). <b>Click it</b> and send it to the right station.'); }
      moverGo(m, depotPos(m.i), 'homing', 0); } }
  }
}
function updateCrane(dt){
  if (!G.st.hbw) return;
  const c = G.crane, sp = CRANE.speed * (1 + 0.4*((G.upgrades.hbw||{}).crane || 0));
  const freeBay = () => [0,1].find(i => !G.hbwOut[i] && !G.hbwFeed.some(f => f.bay === i));
  if (c.state === 'idle'){
    const job = G.craneJobs.find(j => j.line.state === 'queued');
    if (job){ G.craneJobs.splice(G.craneJobs.indexOf(job), 1); job.line.state = 'retrieving'; c.job = job; c.tx = hbSlotPos(job.line.slot).x; c.state = 'toSlot'; }
    else c.tx = HB.ioX;
  }
  if (c.state === 'toSlot' || c.state === 'toIO' || c.state === 'idle'){
    const d = c.tx - c.x, step = sp*dt*clamp(Math.abs(d)/30, 0.3, 1);
    if (Math.abs(d) <= Math.max(step, 0.5)){ c.x = c.tx;
      if (c.state === 'toSlot'){ c.state = 'grab'; c.t = 0; } else if (c.state === 'toIO'){ c.state = 'drop'; c.t = 0; } }
    else c.x += Math.sign(d)*step;
  } else if (c.state === 'grab'){ c.t += dt; if (c.t >= CRANE.grab){ c.carry = true; c.state = 'toIO'; c.tx = HB.ioX; } }
  else if (c.state === 'drop'){
    const bi = freeBay();
    if (bi != null){ c.t += dt; if (c.t >= CRANE.drop){
      const job = c.job; c.job = null; c.carry = false; c.state = 'idle';
      const hu = { id:++G.huSeq, order:job.o, pallet:true, flag:null, loc:'feed' }; job.o.hu = hu; job.o.released = true; job.line.state = 'picked'; G.hus.push(hu);
      const b = HB_BAYS[bi]; G.hbwFeed.push({ hu, bay:bi, path:mkPath([{ x:HB.ioX, y:HB.aisleY }, { x:b.x, y:HB.aisleY }, { x:b.x, y:b.y }], -1) }); sfx('clunk');
    } }
  }
  for (const f of G.hbwFeed){ f.path.d += 110*dt; if (f.path.d >= f.path.len){ f.done = true; G.hbwOut[f.bay] = f.hu; f.hu.loc = 'out'; sfx('done'); event('ready', f.hu);
    tip('pallet_route', `The pallet for <b>#${f.hu.order.num}</b> is out. <b>Click it</b> and click its next station: a transporter drives it over the hall roads to the station's pallet bay.`); } }
  G.hbwFeed = G.hbwFeed.filter(f => !f.done);
}
function hbwHit(p){
  if (!G.st.hbw || p.x < HB.x || p.x > HB.x+HB.w || p.y < HB.y || p.y > HB.y+HB.h) return null;
  let best = null, bd = 1e9;
  for (const o of G.orders){ if (!o.pallet) continue; o.lines.forEach((l, li) => { if (l.state !== 'stored') return; const q = hbSlotPos(l.slot), d = Math.hypot(p.x-q.x, p.y-q.y); if (d < 18 && d < bd){ bd = d; best = { o, li }; } }); }
  return best;
}

const Music = {
  bpm:96, step:0, next:0, timer:null, intensity:0.2,
  prog:[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,65]],
  start(){ if (!AU.ctx || this.timer) return; this.next = AU.ctx.currentTime + 0.1; this.timer = setInterval(() => this.tick(), 30); this.setOn(G.musicOn); },
  setOn(on){ if (!AU.ctx) return; const g = AU.musBus.gain, t = AU.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(on ? 0.3 : 0, t + 0.6); },
  tick(){
    const c = AU.ctx; if (c.state !== 'running') return;

    while (this.next < c.currentTime + 0.15){ this.play(this.step, this.next); this.next += 60/this.bpm/4; this.step++; }
  },
  play(s, t){
    if (!G.musicOn) return;
    const st = s % 16, bar = Math.floor(s/16), chord = this.prog[Math.floor(bar/2) % 4], I = this.intensity, bus = AU.musBus;
    const paused = G.mode !== 'play';
    if (st % 8 === 0 || (I > 0.55 && st === 10)) { AU.osc('sine', 140, t, 0.22, paused ? 0.25 : 0.55, { to:42, slide:0.14, bus }); }

    if (st % 2 === 1 || (I > 0.45 && st % 2 === 0 && st % 4 !== 0)) AU.noise(t, st % 4 === 2 ? 0.07 : 0.035, st % 4 === 2 ? 0.05 : 0.03, { f:7500, bus });

};

  if (hu.kind === 'stock'){ drawStockBox(x, y, hu.item.icon, G.selected === hu, hoverHU === hu); return; }
  if (hu.kind){ drawTote(x, y, hu.order.color, hu.item.icon, G.selected === hu, hoverHU === hu, true, hu.kind === 'scrap'); return; }
  const o = hu.order, sel = G.selected === hu, hov = hoverHU === hu;
  ctx.save(); ctx.translate(x, y);
  if (opts.scale) ctx.scale(opts.scale, opts.scale);
  if (sel){ ctx.shadowColor = '#ff8a1f'; ctx.shadowBlur = 16; }
  else { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; }
  rr(-15, -11, 30, 22, 4); ctx.fillStyle = o.color; ctx.fill();
  ctx.shadowColor = 'transparent';

  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-15,-4); ctx.lineTo(15,-4); ctx.stroke();
  ctx.fillStyle = '#10141c'; ctx.font = `800 9px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(String(o.num).slice(-3), 0, 3);
  if (sel || hov){ ctx.strokeStyle = sel ? '#ffffff' : 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; rr(-16.5, -12.5, 33, 25, 5); ctx.stroke(); }
  if (o.focus){ ctx.fillStyle = '#ffd23f'; star(11, -11, 5); }
  if (o.type !== 'new'){ ctx.fillStyle = '#10141c'; ctx.beginPath(); ctx.arc(-11, -8, 5.5, 0, 7); ctx.fill(); drawIcon(o.type === 'recal' ? 'gauge' : 'regrind', -11, -8, 9, '#fff', 2); }
  if (o.notOk){ rr(-15, -21, 30, 9, 3); ctx.fillStyle = '#ffc53d'; ctx.fill(); ctx.fillStyle = '#10141c'; ctx.font = `900 7px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('NOT OK', 0, -14.5); }

  const pend = pendingSteps(o).filter(s => s !== 'pick');
  const dw = 7; let dx = -((pend.length-1)*dw)/2;
  for (const sid of pend){ ctx.fillStyle = STEP_COLOR(sid); ctx.beginPath(); ctx.arc(dx, 16, 2.6, 0, 7); ctx.fill(); dx += dw; }
  if (hu.flag){
    const pulse = 0.75 + 0.25*Math.sin(perfT*8);
    ctx.fillStyle = `rgba(255,84,104,${pulse})`; ctx.beginPath(); ctx.moveTo(-15, -20); ctx.lineTo(-6, -20); ctx.lineTo(-10.5, -12); ctx.closePath();
    ctx.beginPath(); ctx.arc(-13, -11, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `900 10px ${FONT}`; ctx.fillText('!', -13, -7.5);
  }
  if (o.late){ ctx.strokeStyle = '#ff5468'; ctx.lineWidth = 1.5; ctx.setLineDash([3,2]); rr(-18, -14, 36, 28, 6); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}
function star(cx, cy, r){
  ctx.beginPath();
  for (let i=0; i<10; i++){ const a = -Math.PI/2 + i*Math.PI/5, rad = i%2 ? r*0.45 : r; ctx.lineTo(cx + Math.cos(a)*rad, cy + Math.sin(a)*rad); }
  ctx.closePath(); ctx.fill();
}
function outPos(st, i){ const sp = Math.min(36, (st.w-60)/Math.max(1, st.outMax-1) ); return { x: st.x + 52 + i*sp, y: st.y + st.h - 26 }; }

function drawStation(st, t){
  if (st.def.role === 'storage') return;
  const {x,y,w,h,def} = st;
  const sel = G.selected, targets = sel ? validTargets(sel) : [];
  const isTarget = sel && targets.includes(st), full = !hasRoom(st);
  ctx.save();

  ctx.save(); rr(x, y, w, h, 12); ctx.clip();
  const grd = ctx.createLinearGradient(x, y, x+w, y); grd.addColorStop(0, def.color); grd.addColorStop(1, shade(def.color, -0.35));

  if (st.flash < 0){ ctx.fillStyle = `rgba(255,84,104,${-st.flash*0.3})`; ctx.fillRect(x, y, w, h); }
  ctx.restore();

  drawIcon(def.icon, x+17, y+15, 19, '#0e131d', 2.4); ctx.textAlign = 'left';
  ctx.fillStyle = '#0e131d';
  let fs = 12.5; ctx.font = `800 ${fs}px ${FONT}`;
  while (fs > 10 && ctx.measureText(def.name).width > w-60){ fs -= 0.5; ctx.font = `800 ${fs}px ${FONT}`; }
  ctx.fillText(fitText(def.name, w-64), x+34, y+19.5);

  if (st.key){ rr(x+w-24, y+7, 17, 17, 4); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `800 10px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(st.key, x+w-15.5, y+19); }
  // slots
  for (let i=0; i<st.slotCount; i++){
    const s = st.slots[i], by = y + 38 + i*17, bx = x+10, bw = w-20;
    rr(bx, by, bw, 13, 4); ctx.fillStyle = '#0f141d'; ctx.fill();
    if (s){
      const f = s.done ? 1 : s.t/s.dur;
      rr(bx, by, Math.max(6, bw*f), 13, 4); ctx.fillStyle = s.blocked ? 'rgba(255,84,104,0.55)' : hexA(def.color, 0.5); ctx.fill();
      ctx.fillStyle = s.hu.order.color; ctx.fillRect(bx+4, by+3, 9, 7);
      ctx.fillStyle = '#eef2f8'; ctx.font = `700 9.5px ${FONT}`; ctx.textAlign = 'left';
      ctx.fillText(s.blocked ? 'BLOCKED: OUT full' : s.hu.kind === 'stock' ? 'New stock' : s.hu.kind === 'pstock' ? 'New pallet' : `#${s.hu.order.num}`, bx+17, by+10);
    } else { ctx.fillStyle = '#4a5468'; ctx.font = `600 9px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText('idle', bx+6, by+10); }
  }
  // queue pips
  const qy = y + h - 52;
  ctx.fillStyle = '#8a96ad'; ctx.font = `700 9px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText('IN', x+10, qy+3);
  for (let i=0; i<st.queueMax; i++){
    const px = x + 30 + i*14; ctx.beginPath(); ctx.arc(px, qy, 4.5, 0, 7);
    if (i < st.queue.length){ const q = st.queue[i];
      if (isReady(st, q)){ ctx.fillStyle = q.order.color; ctx.fill(); } else { ctx.strokeStyle = q.order.color; ctx.lineWidth = 2; ctx.stroke(); } }
    else if (i < st.queue.length + st.incoming){ ctx.strokeStyle = '#ff8a1f'; ctx.lineWidth = 1.5; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.strokeStyle = '#3a4560'; ctx.lineWidth = 1.5; ctx.stroke(); }
  }
  if (def.needsTotes){ // totes waiting at the pick station
    const waiting = []; G.orders.forEach(o => o.lines && o.lines.forEach(l => l.state === 'atPick' && waiting.push(o.color)));
    const n = Math.min(waiting.length, 6);
    for (let i=0; i<n; i++){ const tx = x + w - 14 - i*9; ctx.fillStyle = '#5d6b85'; ctx.fillRect(tx-3.5, qy-4, 7, 8); ctx.fillStyle = waiting[i]; ctx.fillRect(tx-3.5, qy-4, 7, 2.5); }

    for (let i=0; i<st.outMax; i++){ const p = outPos(st, i); rr(p.x-16, p.y-12, 32, 24, 5); ctx.strokeStyle = '#2f3a50'; ctx.lineWidth = 1.2; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]); }
  } else {

  let border = '#2c3850', lw = 1.5;

}

const fitCache = {};
function fitText(s, maxW){
  const k = s + '|' + maxW + ctx.font; if (fitCache[k]) return fitCache[k];
  let r = s; while (r.length > 3 && ctx.measureText(r).width > maxW) r = r.slice(0, -2) + '…';
  if (r !== s && r.endsWith('……')) r = r.slice(0,-1);
  return fitCache[k] = r;
}
function shade(hex, f){ const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255;
  r = Math.round(r*(1+f)); g = Math.round(g*(1+f)); b = Math.round(b*(1+f)); return `rgb(${clamp(r,0,255)},${clamp(g,0,255)},${clamp(b,0,255)})`; }
function hexA(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; }

  ctx.fillStyle = '#8a96ad'; ctx.font = `500 9.5px ${FONT}`; ctx.fillText('only if the order needs it', x+12, y+h-12);

function stageList(){
  const map = {};
  for (const [sid, s] of Object.entries(STEPS)){ const stId = STEP_STATION[sid]; if (!s.alt && stId && activeHas(stId)) (map[s.stage] = map[s.stage] || []).push(sid); }
  return Object.keys(map).sort((a,b) => a-b).map(k => map[k]);
}

let perfT = 0;
function render(t){
  perfT = t;
  const d = view.dpr;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#0e131d'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(d*view.s, 0, 0, d*view.s, d*view.ox, d*view.oy);
  drawFloor(t);
  if (!G.stations.length){ return; }
  drawRoads(t); drawHBW(t);
  if (G.roads) (G.movers||[]).forEach(m => drawMover(m, t));
  drawWarehouse(t);
  drawLoop(t);
  G.stations.forEach(st => drawSpur(st, t));
  drawBoard(); drawDispatchBoard(); drawTruck(t); drawServiceRoom(t);
  G.stations.forEach(st => drawStation(st, t));
  (G.workers || []).forEach(k => drawWorker(k, t));
  // transit HUs
  for (const hu of G.hus){
    if (hu.loc !== 'transit') continue;
    const p = along(hu.tr, hu.tr.d); hu.px = p.x; hu.py = p.y;
    drawHU(hu, p.x, p.y);
    if (hu.tr.to === null){ ctx.fillStyle = 'rgba(255,138,31,0.9)'; ctx.font = `800 9px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('re-route me', p.x, p.y-17); }
  }
  drawLoosePallets();
  // flyers to truck
  for (const f of G.flyers){ const k = Math.min(1, f.t), x = f.x0 + (f.x1-f.x0)*k, y = f.y0 + (f.y1-f.y0)*k - Math.sin(k*Math.PI)*50;
    rr(x-9, y-7, 18, 14, 3); ctx.fillStyle = '#c99a5b'; ctx.fill(); ctx.fillStyle = f.color; ctx.fillRect(x-9, y-2, 18, 3); }
  // selection line
  if (G.selected && mouse.inside){
    const s = G.selected;
    // hint: the line turns green over a correct station, red over a wrong one (neutral orange elsewhere / hints off)
    let col = 'rgba(255,138,31,0.85)';
    if (G.hints && hoverSt){ col = validTargets(s).includes(hoverSt) ? '#3ddc84' : '#ff5468'; }
    ctx.strokeStyle = col; ctx.lineWidth = col.startsWith('#') ? 3 : 2; ctx.setLineDash([6,5]); ctx.lineDashOffset = -t*30;
    ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); ctx.setLineDash([]);
  }
  // floats
  for (const f of G.floats){ ctx.globalAlpha = 1 - f.t/1.4; ctx.fillStyle = f.color; ctx.font = `900 15px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y - f.t*30); ctx.globalAlpha = 1; }
  if (G.mode === 'paused'){ ctx.fillStyle = 'rgba(10,14,20,0.55)'; ctx.fillRect(0,0,W,H); }
}

// ---------- side panel & HUD ----------
// which of the order's services apply to this particular item (shown as dots under the item icon)
function itemSteps(o, item){ return Object.keys(o.steps).filter(sid => STEPS[sid].tag && item.tags.includes(STEPS[sid].tag)); }
function chipHTML(o, sid){
  const c = STEP_COLOR(sid), done = o.steps[sid] === 'done';
  if (o.steps[sid] === 'skip') return `<span class="chip" style="border-color:#4a5468;color:#6b7690;text-decoration:line-through">${STEPS[sid].short}</span>`;
  return `<span class="chip ${done?'done':''}" style="border-color:${c};color:${c};${done?`background:${c}`:''}">${done?'✓ ':''}${STEPS[sid].short}</span>`;
}
function orderParts(o, inbox){
  const rem = o.due - G.time, frac = clamp(rem / o.allow, 0, 1);
  const col = rem < 0 ? '#ff5468' : frac < 0.3 ? '#ffc53d' : '#3ddc84';
  const blocked = inbox && G.st.commission && !hasRoom(G.st.commission);
  const steps = Object.keys(o.steps).map(s => s === 'pick' && o.steps.pick === 'todo' && o.lines.length
    ? `<span class="chip" style="border-color:${STEP_COLOR('pick')};color:${STEP_COLOR('pick')}">PICK ${linesDone(o)}/${o.lines.length} ${ico(o.pallet ? 'pallet' : 'tote')}</span>` : chipHTML(o, s)).join('');
  const flag = o.hu && o.hu.flag ? `<span class="chip flag">${ico('warn')} ${o.hu.flag.reason}</span>`
    : o.notOk ? `<span class="chip" style="background:var(--warn);border-color:var(--warn);color:#0e131d">NOT OK: back to customer</span>` : '';
  const cls = `oc ${inbox?'inbox':''} ${blocked?'blocked':''} ${o.focus?'focus':''} ${rem<0?'late':''}`;
  const html = `<div class="oc-h"><span class="sw" style="background:${o.color}"></span><b>#${o.num}</b><span class="cust">${o.customer}</span>${o.type === 'regrind' ? `<span title="Customer return for regrinding" style="display:inline-flex">${ico('regrind')}</span>` : o.type === 'recal' ? `<span title="Customer return for re-calibration" style="display:inline-flex">${ico('gauge')}</span>` : ''}${o.focus?'<span style="color:var(--warn)">★</span>':''}
    <span class="due"></span></div>
    <div class="oc-items">${o.items.map(i => `<span class="it" title="${i.name}">${ico(i.icon)}<span class="dots">${itemSteps(o, i).map(sid => `<i style="background:${STEP_COLOR(sid)}"></i>`).join('')}</span></span>`).join('')}</div>
    <div class="chips">${steps}${flag}</div>
    <div class="tbar"><div></div></div>
    ${inbox ? (o.type !== 'new' ? '<span class="release-hint">waiting at Goods-in</span>' : (o.pallet ? '<span class="release-hint">pallet in high-bay ◂</span>' : '<span class="release-hint">totes in warehouse ◂</span>')) : ''}`;
  return { cls, html, col, frac, due: rem < 0 ? 'LATE' : Math.ceil(rem)+'s' };
}
// Cards are kept as persistent DOM nodes and patched in place (no flicker, hover stays stable)
const cardEls = new Map();
function syncList(container, orders, inbox, emptyText){
  const keep = new Set();
  const els = orders.map(o => {
    const key = (inbox ? 'i' : 'a') + o.id; keep.add(key);
    let el = cardEls.get(key);
    if (!el){ el = document.createElement('div'); el.dataset.oid = o.id; cardEls.set(key, el);
      // card takes the colour of the order's handling unit
      el.style.background = `linear-gradient(100deg, ${hexA(o.color, 0.34)}, ${hexA(o.color, 0.12)} 70%), #1b2433`;
      el.style.borderColor = hexA(o.color, 0.55); el.style.borderLeftColor = o.color; }
    const p = orderParts(o, inbox);
    const cls = p.cls + (el.classList.contains('shake') ? ' shake' : '');
    if (el.className !== cls) el.className = cls;
    if (el._html !== p.html){ el.innerHTML = p.html; el._html = p.html; el._due = el.querySelector('.due'); el._bar = el.querySelector('.tbar div'); }
    if (el._due.textContent !== p.due) el._due.textContent = p.due;
    el._due.style.color = p.col;
    el._bar.style.width = (p.frac*100).toFixed(1) + '%'; el._bar.style.background = p.col;
    return el;
  });
  if (!els.length){
    if (!container._empty){ container.innerHTML = `<div class="empty">${emptyText}</div>`; container._empty = true; }
  } else {
    if (container._empty){ container.innerHTML = ''; container._empty = false; }
    els.forEach((el, i) => { if (container.children[i] !== el) container.insertBefore(el, container.children[i] || null); });
    while (container.children.length > els.length) container.lastChild.remove();
  }
  for (const [k, el] of cardEls) if (k[0] === (inbox ? 'i' : 'a') && !keep.has(k)){ el.remove(); cardEls.delete(k); }
}

function showTooltip(hu, cx, cy, rack){

      : hu.kind === 'pstock' ? `<div class="tt-h" style="color:${STOCK_COLOR}">${ico('pallet')} New pallet</div><div class="items">${ico(item.icon)} ${item.name} (supplier delivery)</div><div class="row next">▸ Route it to the High-Bay Warehouse</div>`

      : `<div class="tt-h">↩ Return tote</div><div class="items">${ico(item.icon)} ${item.name} (wrong pick for #${o.num})</div><div class="row next">▸ Route it back to the Shuttle Warehouse</div>`;
    tt.style.display = 'block'; placeTooltip(tt, cx, cy); return;
  }
  const o = hu.order, pend = pendingSteps(o), nextIds = hu.flag ? [] : validTargets(hu).map(s => s.def.handles);
  const rows = Object.keys(o.steps).map(sid => {
    const done = o.steps[sid] === 'done', nx = nextIds.includes(sid);
    if (o.steps[sid] === 'skip') return `<div class="row" style="text-decoration:line-through;opacity:.6">○ ${STEPS[sid].label}</div>`;
    return `<div class="row ${done?'done':nx?'next':''}">${done?'✓':nx?'▸':'○'} ${STEPS[sid].label}</div>`; }).join('')
    + (o.notOk ? `<div class="row" style="color:var(--warn)">Out of tolerance: back to the customer, no guarantee</div>` : '');
  const rem = o.due - G.time;
  tt.innerHTML = `<div class="tt-h"><span style="width:10px;height:10px;border-radius:3px;background:${o.color}"></span>#${o.num} · ${o.customer} ${o.focus?'<span style="color:var(--warn)">★ focus</span>':''}</div>
    <div class="items">${o.items.map(i => ico(i.icon) + ' ' + i.name + (itemSteps(o, i).length ? ' <span style="color:var(--muted)">(' + itemSteps(o, i).map(sid => STEPS[sid].short).join(', ') + ')</span>' : '')).join('<br>')}</div>${rows}
    ${hu.flag ? `<div class="fl">${ico('warn')} ${hu.flag.reason} → Quality Assurance</div>` : ''}
    <div class="row" style="margin-top:4px">${rem<0 ? '<span style="color:var(--bad)">Overdue</span>' : `Due in ${Math.ceil(rem)}s`}</div>`;
  tt.style.display = 'block'; placeTooltip(tt, cx, cy);

function placeTooltip(tt, cx, cy){
  const r = floorEl.getBoundingClientRect(), tw = tt.offsetWidth, th = tt.offsetHeight;
  let lx = cx + 16, ly = cy + 16; if (lx + tw > r.width - 8) lx = cx - tw - 16; if (ly + th > r.height - 8) ly = cy - th - 16;
  tt.style.left = lx + 'px'; tt.style.top = ly + 'px';
}

// ---------- input ----------
function toWorld(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left - view.ox)/view.s, y:(e.clientY - r.top - view.oy)/view.s, cx:e.clientX - r.left, cy:e.clientY - r.top }; }
function hitHU(p){
  let best = null, bd = 1e9;
  for (const hu of G.hus){ if (!selectable(hu) || hu.px == null) continue;
    const dx = Math.abs(p.x - hu.px), dy = Math.abs(p.y - hu.py);
    if (dx < 19 && dy < 16){ const d = dx+dy; if (d < bd){ bd = d; best = hu; } } }
  return best;
}
function hitStation(p){ return G.stations.find(st => p.x >= st.x-6 && p.x <= st.x+st.w+6 && p.y >= st.y-12 && p.y <= st.y+st.h+6) || null; }
function selectHU(hu){ if (G.selected !== hu){ G.selected = hu; sfx('select'); } }
cv.addEventListener('pointerdown', e => {
  AU.init(); Music.start();
  if (G.mode !== 'play') return;
  const p = toWorld(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  // broken automation: clicking its badge (always) or the station (with nothing selected) sends a service worker
  const bk = G.maint && G.stations.find(s => s.auto && s.auto.state === 'broken' && s.badge && p.x >= s.badge.x-6 && p.x <= s.badge.x+s.badge.w+6 && p.y >= s.badge.y-8 && p.y <= s.badge.y+s.badge.h+8);
  if (bk){ sendService(bk); return; }
  const hu = hitHU(p);
  if (!hu && !G.selected && G.maint){ const s = hitStation(p); if (s && s.auto && s.auto.state === 'broken'){ sendService(s); return; } }
  if (hu){ selectHU(hu); drag = { hu, x:p.x, y:p.y, moved:false }; cv.setPointerCapture(e.pointerId); return; }
  const st = hitStation(p);
  if (st && G.selected && (st.def.role !== 'storage' || (G.selected.kind && acceptsKind(st.def, G.selected.kind)))){ dispatch(G.selected, st); return; }
  const rk = rackHit(p);
  if (rk){ if (!retrieve(rk.o, rk.li)) G.selected = null; return; }
  if (st && G.selected){ dispatch(G.selected, st); return; }
  G.selected = null;
});
