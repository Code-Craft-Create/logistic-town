<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logistic Town</title>
<style>
:root{
  --bg:#0e131d; --panel:#151c29; --panel2:#1b2433; --line:#2a3548; --text:#eef2f8; --muted:#8a96ad;
  --accent:#ff8a1f; --accent2:#ffb15c; --accentDim:rgba(255,138,31,.16);
  --good:#3ddc84; --bad:#ff5468; --warn:#ffc53d;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:58px 1fr;grid-template-columns:300px 1fr;height:100vh;height:100dvh}
#top{grid-column:1/3;display:flex;align-items:center;gap:20px;padding:0 16px;background:linear-gradient(#1a2231,#131a26);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;font-size:17px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#ff5a1f);display:grid;place-items:center;box-shadow:0 2px 10px rgba(255,138,31,.45)}
.brand .logo svg{width:18px;height:18px}
.hgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.hgroup label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap}
.hgroup b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:#0b1018;border:1px solid var(--line);overflow:hidden}
.bar > div{height:100%;border-radius:5px;transition:width .3s}
#clockGroup{width:190px}
#clockFill{background:linear-gradient(90deg,var(--accent2),var(--accent))}
#satGroup{width:170px}
#satFill{background:var(--good)}
.spacer{flex:1}
.tbtn{height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:#fff}
.tbtn.on{background:var(--accentDim);border-color:var(--accent);color:var(--accent2)}
.tbtn.off{opacity:.5}
#side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px 20px;min-height:0}
#side h3{margin:6px 2px 8px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);display:flex;justify-content:space-between}
#side h3 span{color:var(--text)}
.empty{font-size:12px;color:var(--muted);padding:10px 4px 14px;font-style:italic}
.oc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;position:relative;transition:border-color .15s,transform .1s}
.oc{cursor:pointer}
.oc.inbox:hover{border-color:var(--accent);transform:translateX(2px)}
.oc.inbox.blocked{opacity:.6}
.oc.focus{box-shadow:inset 3px 0 0 var(--warn)}
.oc.late{border-color:rgba(255,84,104,.6)}
.oc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.oc-h{display:flex;align-items:center;gap:6px;font-size:12.5px}
.oc-h .sw{width:11px;height:11px;border-radius:3px;flex:none}
.oc-h .cust{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.oc-h .due{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}
.oc-items{font-family:var(--emoji);font-size:15px;margin:4px 0 5px;letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;border:1px solid;opacity:.95}
.chip.done{color:#0e131d!important}
.chip.flag{background:var(--bad);border-color:var(--bad);color:#fff}
.tbar{height:4px;border-radius:3px;background:#0b1018;margin-top:7px;overflow:hidden}
.tbar div{height:100%}
.release-hint{position:absolute;right:9px;bottom:13px;font-size:10px;color:var(--accent2);opacity:0;transition:opacity .15s}
.oc.inbox:hover .release-hint{opacity:1}
#floor{position:relative;overflow:hidden;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5;width:min(560px,92%)}
.toast{background:rgba(21,28,41,.95);border:1px solid var(--line);border-left:4px solid var(--accent);padding:8px 14px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .25s ease-out;transition:opacity .4s,transform .4s}
.toast.bad{border-left-color:var(--bad)} .toast.good{border-left-color:var(--good)} .toast.warn{border-left-color:var(--warn)}
.toast.out{opacity:0;transform:translateY(-6px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(620px,92%);background:linear-gradient(135deg,#2a1d10,#1d1712);border:1px solid var(--accent);border-radius:14px;padding:14px 16px 14px 58px;font-size:14px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:6;display:none}
#tip.show{display:block;animation:tin .3s ease-out}
#tip .ico{position:absolute;left:14px;top:13px;width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:900;color:#1a1208}
#tip button{float:right;margin:6px 0 0 12px;background:var(--accent);color:#1a1208;border:0;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}
#tooltip{position:absolute;pointer-events:none;background:rgba(15,20,30,.97);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;z-index:7;display:none;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tooltip .tt-h{font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center}
#tooltip .row{display:flex;gap:6px;align-items:center;margin:2px 0;color:var(--muted)}
#tooltip .row.done{color:var(--good)} #tooltip .row.next{color:var(--accent2);font-weight:700}
#tooltip .fl{color:var(--bad);font-weight:700;margin-top:4px}
#tooltip .items{font-size:12px;color:var(--text);margin-bottom:4px}
#tooltip .items i,.oc-items{font-style:normal;font-family:var(--emoji)}
#modal{position:fixed;inset:0;background:rgba(6,9,14,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#modal.hidden{display:none}
.mcard{background:linear-gradient(180deg,#1a2231,#141b27);border:1px solid var(--line);border-radius:18px;padding:26px 28px;width:min(720px,100%);margin:auto;flex:none;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.mcard h1{margin:0 0 4px;font-size:34px;letter-spacing:.5px}
.mcard h1 em{font-style:normal;color:var(--accent)}
.mcard h2{margin:0 0 6px;font-size:24px}
.mcard .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.mcard p{line-height:1.5;font-size:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:15px;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#1a1208;border:0;box-shadow:0 4px 16px rgba(255,138,31,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.scard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.4}
.scard .t{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px;font-size:14px}
.scard .t .e{font-family:var(--emoji);font-size:20px}
.scard.new{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,138,31,.12),var(--panel2))}
.tag{display:inline-block;font-size:10px;font-weight:800;background:var(--accent);color:#1a1208;border-radius:5px;padding:1px 6px;margin-left:auto}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0;font-size:13px}
.flow .fs{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.flow .ar{color:var(--accent)}
.goal{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px}
.goal div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.goal small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.goal b{font-size:20px}
.stars{font-size:40px;letter-spacing:6px;color:#4a5468;margin:4px 0 10px}
.stars .lit{color:var(--accent);text-shadow:0 0 18px rgba(255,138,31,.6)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:var(--panel2)}
ul.clean{padding-left:18px;margin:8px 0;line-height:1.6;font-size:14px}
.shop{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.srow .nm{display:flex;align-items:center;gap:8px;font-weight:700;width:190px;font-size:14px}
.srow .nm .e{font-family:var(--emoji);font-size:18px}
.ubtn{flex:1;min-width:130px;border-radius:9px;padding:7px 9px;border:1px solid var(--line);background:#121925;cursor:pointer;text-align:left;font-size:12px;line-height:1.3}
.ubtn:hover:not(:disabled){border-color:var(--accent)}
.ubtn:disabled{opacity:.4;cursor:default}
.ubtn b{color:var(--accent2)}
.ubtn .lv{color:var(--muted);float:right;margin-left:8px}
.cashbig{font-size:22px;font-weight:800;color:var(--accent2)}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero svg{flex:none}
@media (max-width:900px), (max-height:620px){
  #app{grid-template-columns:230px 1fr;grid-template-rows:46px 1fr}
  #top{gap:10px;padding:0 10px}
  .brand span.t,#top .hgroup label{display:none}
  #top #clockGroup label{display:block}
  #clockGroup{width:150px!important}
  .brand .logo{width:26px;height:26px}
  #clockGroup,#satGroup{width:90px}
  .hgroup b{font-size:14px}
  .tbtn{height:30px;min-width:30px;padding:0 7px;font-size:12px}
  #side{padding:8px}
  .oc{padding:6px 8px}
  .oc-items{font-size:13px;margin:2px 0 3px}
  .mcard{padding:18px 18px}
  .mcard h1{font-size:26px}
}
@media (max-width:700px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) 150px}
  #top{flex-wrap:wrap;padding:6px 10px;grid-column:1;row-gap:6px}
  #side{grid-row:3;border-right:0;border-top:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px 16px}
  #side h3{display:none}
  #side > div{display:flex;gap:8px}
  .oc{width:200px;flex:none;margin:0}
  .empty{white-space:nowrap}
  #rotate{display:flex}
}
#rotate{display:none;position:absolute;left:8px;right:8px;top:8px;z-index:4;background:rgba(21,28,41,.92);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;font-size:12.5px;align-items:center;gap:8px;pointer-events:none}
@media (orientation:landscape){ #rotate{display:none!important} }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1208" stroke-width="2.4" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></div><span class="t">Logistic Town</span></div>
    <div class="hgroup" id="clockGroup"><label id="shiftName">Shift</label><div class="bar"><div id="clockFill" style="width:0%"></div></div></div>
    <div class="hgroup"><label>Shipped / goal</label><b id="shippedTxt">0 / 0</b></div>
    <div class="hgroup"><label>Cash</label><b id="cashTxt">$0</b></div>
    <div class="hgroup" id="satGroup"><label>Customer satisfaction</label><div class="bar"><div id="satFill" style="width:100%"></div></div></div>
    <div class="spacer"></div>
    <button class="tbtn" id="bSpeed" title="Game speed (F)">1×</button>
    <button class="tbtn on" id="bHints" title="Route hints (H): the routing line turns green/red over stations. Off = expert mode, +25% pay">💡 Hints</button>
    <button class="tbtn on" id="bMusic" title="Music (M)">♫</button>
    <button class="tbtn on" id="bSfx" title="Sound effects (S)">🔊</button>
    <button class="tbtn" id="bHelp" title="How to play">?</button>
    <button class="tbtn" id="bPause" title="Pause (Space)">❚❚</button>
  </header>
  <aside id="side">
    <h3>Incoming orders <span id="inCount">0</span></h3>
    <div id="inbox"></div>
    <h3>In process <span id="actCount">0</span></h3>
    <div id="active"></div>
  </aside>
  <main id="floor">
    <canvas id="cv"></canvas>
    <div id="rotate">📱↻ Turn your phone sideways for a bigger warehouse view.</div>
    <div id="toasts"></div>
    <div id="tip"><div class="ico">i</div><button id="tipOk">Got it</button><div id="tipText"></div></div>
    <div id="tooltip"></div>
  </main>
</div>
<div id="modal" class="hidden"><div class="mcard" id="mcard"></div></div>

<script>
'use strict';
/* =====================================================================
   LOGISTIC TOWN — a warehouse routing game
   ---------------------------------------------------------------------
   HOW TO EXTEND
   1. Add a processing step to STEPS (stage decides ordering: lower
      stages must be finished first; steps with the same stage can be
      done in any order). `want(order)` decides if an order needs it.
   2. Add a station to STATIONS with `handles: '<stepId>'`.
   3. Add the station id to the `stations` list of the shifts where it
      should be available (SHIFTS). Layout, routing, UI, help text and
      the order generator pick it up automatically.
   ===================================================================== */

// ---------- 1. DATA: items, customers ----------
const ITEMS = [
  { name:'Digital caliper',      icon:'📏', tags:['measure','tool'] },
  { name:'Torque wrench',        icon:'🔧', tags:['measure','tool'] },
  { name:'Laser distance meter', icon:'📐', tags:['measure','tool'] },
  { name:'Spirit level',         icon:'🧭', tags:['measure','tool'] },
  { name:'Cordless drill',       icon:'🪛', tags:['tool'] },
  { name:'Hammer',               icon:'🔨', tags:['tool'] },
  { name:'Angle grinder',        icon:'⚙️', tags:['tool'] },
  { name:'Saw',                  icon:'🪚', tags:['tool'] },
  { name:'Work jacket',          icon:'🧥', tags:['apparel'] },
  { name:'Safety vest',          icon:'🦺', tags:['apparel'] },
  { name:'Work gloves',          icon:'🧤', tags:['apparel'] },
  { name:'Work trousers',        icon:'👖', tags:['apparel'] },
];
const CUSTOMERS = ['Bergmann Bau','Nordhang Montage','Alpenkamm Stahl','Kessling Elektro','Hofstetter Dach','Lindvik Rail',
  'Brückenwerk Anlagen','Sommerau Sanitär','Vogtland Gerüste','Rheinfeld Service','Falkenstein Metall','Weidner Zimmerei',
  'Tannberg Tiefbau','Seeblick Haustechnik','Grauholz Fassaden','Morgental Energie'];
const ORDER_COLORS = ['#ff8a1f','#4f8cff','#3ddc84','#ff5fa2','#22c3e6','#b07cff','#ffd23f','#ff6b5a','#7bd389','#9aa8ff','#f78c6b','#5ce1c6'];

// ---------- 2. DATA: process steps (routing rules) ----------
// stage: lower stages must be completed before higher ones. Same stage = any order.
const has = (o, tag) => o.items.some(i => i.tags.includes(tag));
const STEPS = {
  pick:        { label:'Commissioning',        short:'PICK',  stage:0, want: () => true },
  calibration: { label:'Calibration',          short:'CAL',   stage:1, want: o => has(o,'measure') && Math.random() < 0.75 },
  signing:     { label:'Laser signing',        short:'SIGN',  stage:1, want: o => has(o,'tool') && Math.random() < 0.45 },
  patching:    { label:'Logo patching',        short:'PATCH', stage:1, want: o => has(o,'apparel') && Math.random() < 0.75 },
  focus:       { label:'Focus customer check', short:'FOCUS', stage:2, want: o => o.focus },
  pack:        { label:'Packing & shipping',   short:'SHIP',  stage:9, want: () => true },
};

// ---------- 3. DATA: stations ----------
// handles: step it performs. role: 'repair' (clears flags) or 'sink' (ships the order).
// place: 'left' | 'right' | undefined (auto: distributed above/below the conveyor loop).
const STATIONS = [
  { id:'warehouse', name:'Shuttle Warehouse', icon:'🏬', color:'#ff8a1f', role:'storage', place:'warehouse',
    slots:2, time:1.2, queue:6, out:0,
    desc:'Stores every tool in totes. Click an order\'s glowing totes to send them to Commissioning. Returned totes (↩) go back here.' },
  { id:'commission', name:'Commissioning', icon:'📦', color:'#4f8cff', handles:'pick', place:'left', needsTotes:true,
    slots:2, time:5, queue:4, out:3, defect:{ chance:0.07, reason:'Wrong item picked', redo:true, returnTote:true },
    desc:'Picks the tools from the delivered totes into an order-specific handling unit (HU). Starts once all of the order\'s totes have arrived.' },
  { id:'calib', name:'Calibration Lab', icon:'📏', color:'#22c3e6', handles:'calibration',
    slots:1, time:7, queue:3, out:3, defect:{ chance:0.14, reason:'Out of tolerance', redo:true },
    desc:'Checks that measuring tools measure correctly and issues a certificate. Failed tools go to QA, then back here.' },
  { id:'sign', name:'Laser Signing', icon:'✒️', color:'#b07cff', handles:'signing',
    slots:1, time:5, queue:3, out:3, defect:{ chance:0.08, reason:'Engraving blurred', redo:true },
    desc:'Lasers the customer identifier onto tools so they can be traced on site.' },
  { id:'patch', name:'Patch Studio', icon:'🧵', color:'#ff5fa2', handles:'patching',
    slots:1, time:6, queue:3, out:3, defect:{ chance:0.10, reason:'Patch misaligned', redo:true },
    desc:'Sews custom company logos onto work apparel.' },
  { id:'care', name:'Focus Customer Care', icon:'⭐', color:'#ffd23f', handles:'focus',
    slots:1, time:4, queue:3, out:3, defect:{ chance:0.10, reason:'Scratch found', redo:false },
    desc:'Dedicated final check for focus customers (★). Comes after all other services, right before packing.' },
  { id:'qa', name:'Quality Assurance', icon:'🔍', color:'#ff5468', role:'repair',
    slots:1, time:5, queue:4, out:3,
    desc:'Fixes everything flagged ⚠: failed checks, wrong picks, failed weight checks. A failed service has to be redone afterwards.' },
  { id:'pack', name:'Packing & Shipping', icon:'🚚', color:'#3ddc84', handles:'pack', role:'sink', place:'right',
    slots:2, time:4, queue:4, out:0,
    desc:'Packs the order and loads it on the truck. Last stop: only when every step is done and nothing is flagged.' },
];
// Random weight check on every conveyor trip (scanner at each station entrance)
const RETRIEVE_SPEED = 300; // px/s for totes coming out of the shuttle warehouse
const TRANSPORT_CHECK = { chance:0.035, reason:'Weight check failed' };

// ---------- 4. DATA: shifts (levels) ----------
const SHIFTS = [
  { name:'Monday',    title:'Learning the ropes', duration:150, goal:6,  spawn:[14,18],  items:[1,2], slack:30, stations:['warehouse','commission','qa','pack'] },
  { name:'Tuesday',   title:'Precision matters',  duration:180, goal:9,  spawn:[12,15],  items:[1,3], slack:28, stations:['warehouse','commission','calib','qa','pack'] },
  { name:'Wednesday', title:'Make it personal',   duration:180, goal:11, spawn:[10,13],  items:[1,3], slack:26, stations:['warehouse','commission','calib','sign','qa','pack'] },
  { name:'Thursday',  title:'VIP treatment',      duration:210, goal:13, spawn:[9.5,12], items:[1,3], slack:28, stations:['warehouse','commission','calib','sign','patch','care','qa','pack'] },
  { name:'Friday',    title:'The Friday rush',    duration:210, goal:15, spawn:[8,10],  items:[1,3], slack:27, stations:['warehouse','commission','calib','sign','patch','care','qa','pack'] },
];
function shiftConfig(i){
  if (i < SHIFTS.length) return SHIFTS[i];
  const k = i - SHIFTS.length + 1, b = SHIFTS[SHIFTS.length-1];
  return { ...b, name:'Overtime '+k, title:'Demand keeps growing', goal:b.goal + 2*k,
    spawn:[Math.max(5, b.spawn[0]-0.5*k), Math.max(6.5, b.spawn[1]-0.6*k)], slack:Math.max(18, b.slack-k) };
}

// ---------- 5. DATA: upgrades ----------
const UPGRADES = [
  { id:'slots',   label:'Extra workstation', desc:'+1 parallel slot',  max:2, cost:l => 220 + l*180 },
  { id:'speed',   label:'Staff training',    desc:'−15% process time', max:3, cost:l => 120 + l*100 },
  { id:'quality', label:'Quality program',   desc:'−35% defects',      max:2, cost:l => 100 + l*90, needs: d => !!d.defect },
];
const GLOBAL_UPGRADES = [
  { id:'conveyor', label:'Faster conveyor', desc:'+15% belt speed', max:3, cost:l => 150 + l*130 },
  { id:'buffers',  label:'Bigger buffers',  desc:'+1 IN / OUT space everywhere', max:2, cost:l => 200 + l*180 },
];

// ===================================================================
//  ENGINE

const DEF = Object.fromEntries(STATIONS.map(s => [s.id, s]));
const STEP_STATION = {}; STATIONS.forEach(s => { if (s.handles) STEP_STATION[s.handles] = s.id; });
const STEP_COLOR = id => DEF[STEP_STATION[id]]?.color || '#888';
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a, b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

const W = 1320, H = 800;
const LOOP = { x0:440, y0:300, x1:1060, y1:500 };
LOOP.w = LOOP.x1-LOOP.x0; LOOP.h = LOOP.y1-LOOP.y0; LOOP.L = 2*(LOOP.w+LOOP.h);
const WH = { x:16, y:66, w:184, h:700 };

function loopPos(s){
  const {x0,y0,x1,y1,w,h,L} = LOOP; s = ((s%L)+L)%L;
  if (s <= w) return { x:x0+s, y:y0 };
  if (s <= w+h) return { x:x1, y:y0+(s-w) };
  if (s <= 2*w+h) return { x:x1-(s-w-h), y:y1 };
  return { x:x0, y:y1-(s-2*w-h) };
}
function loopS(x, y){
  const {x0,y0,x1,y1,w,h} = LOOP;
  const cx = clamp(x,x0,x1), cy = clamp(y,y0,y1);
  const c = [[Math.abs(y-y0), cx-x0],[Math.abs(x-x1), w+cy-y0],[Math.abs(y-y1), w+h+(x1-cx)],[Math.abs(x-x0), 2*w+h+(y1-cy)]];
  c.sort((a,b) => a[0]-b[0]); return c[0][1];
}
function laneOff(p, off){
  const e = 0.01; let {x,y} = p;
  if (Math.abs(p.y-LOOP.y0) < e) y -= off;
  if (Math.abs(p.y-LOOP.y1) < e) y += off;
  if (Math.abs(p.x-LOOP.x0) < e) x -= off;
  if (Math.abs(p.x-LOOP.x1) < e) x += off;
  return { x, y };
}
function loopCorners(s0, s1, dir){ // corner points strictly between s0 and s1 going dir
  const {w,h,L} = LOOP, base = [0, w, w+h, 2*w+h], out = [];
  const all = []; for (let k=-2; k<=3; k++) base.forEach(c => all.push(c + k*L));
  if (dir > 0) all.filter(c => c > s0+1e-6 && c < s1-1e-6).sort((a,b)=>a-b).forEach(c => out.push(loopPos(c)));
  else all.filter(c => c < s0-1e-6 && c > s1+1e-6).sort((a,b)=>b-a).forEach(c => out.push(loopPos(c)));
  return out;
}
function mkPath(pts, portIdx){
  const cum = [0];
  for (let i=1; i<pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
  return { pts, cum, len:cum[cum.length-1], portAt: portIdx>=0 ? cum[portIdx] : -1, d:0, checked:false };
}
function along(path, d){
  const {pts, cum} = path; d = clamp(d, 0, path.len);
  for (let i=0; i<pts.length-1; i++){
    if (cum[i+1] >= d){ const seg = cum[i+1]-cum[i] || 1, t = (d-cum[i])/seg;
      return { x:pts[i].x + (pts[i+1].x-pts[i].x)*t, y:pts[i].y + (pts[i+1].y-pts[i].y)*t }; }
  }
  return { ...pts[pts.length-1] };
}
// Build a path: from a station (or loop position s) to a station (or a full circle when toSt is null)
function buildPath(fromSt, fromS, toSt){
  const L = LOOP.L, pts = [];
  const s0 = fromSt ? fromSt.port.s : fromS;
  let s1, dir;
  if (toSt){ s1 = toSt.port.s; const cw = ((s1-s0)%L+L)%L; dir = cw <= L-cw ? 1 : -1; s1 = dir>0 ? s0+cw : s0-(L-cw); }
  else { dir = 1; s1 = s0 + L; }
  const off = dir > 0 ? 10 : -10;
  if (fromSt) pts.push({ ...fromSt.dock });
  pts.push(laneOff(loopPos(s0), off));
  loopCorners(s0, s1, dir).forEach(p => pts.push(laneOff(p, off)));
  pts.push(laneOff(loopPos(s1), off));
  const portIdx = toSt ? pts.length-1 : -1;
  if (toSt) pts.push({ ...toSt.dock });
  const p = mkPath(pts, portIdx); p.to = toSt ? toSt.id : null; p.loopS = s0; return p;
}

// ---------- persistent + runtime state ----------
let G = null;
const SAVE_KEY = 'logistic-town-save-v1';
function newProfile(){ return { shiftIdx:0, money:0, upgrades:{}, global:{ conveyor:0, buffers:0 }, hints:true, seenTips:{}, musicOn:true, sfxOn:true, speed:1, best:0 }; }
function loadProfile(){ try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s.shiftIdx === 'number') return { ...newProfile(), ...s }; } catch(e){} return null; }
function saveProfile(){ try { const { shiftIdx, money, upgrades, global, hints, seenTips, musicOn, sfxOn, best } = G;
  localStorage.setItem(SAVE_KEY, JSON.stringify({ shiftIdx, money, upgrades, global, hints, seenTips, musicOn, sfxOn, best })); } catch(e){} }

G = { ...newProfile(), mode:'title', stations:[], st:{}, orders:[], hus:[], floats:[], flyers:[], time:0, silent:false };
const saved = loadProfile(); if (saved){ G.musicOn = saved.musicOn; G.sfxOn = saved.sfxOn; G.hints = saved.hints; G.seenTips = saved.seenTips || {}; }

function makeStation(def){
  const up = G.upgrades[def.id] || {};
  return { def, id:def.id, slotCount:def.slots + (up.slots||0), queueMax:def.queue + G.global.buffers,
    outMax: def.out ? def.out + G.global.buffers : 0, speedMul:Math.pow(0.85, up.speed||0), qualMul:Math.pow(0.65, up.quality||0),
    slots:[], queue:[], out:[], incoming:0, processed:0, flash:0, scanFlash:0, x:0, y:0, w:160, h:150 };
}
function layoutStations(){
  const list = G.stations, left = list.filter(s => s.def.place==='left'), right = list.filter(s => s.def.place==='right');
  const auto = list.filter(s => !s.def.place), nTop = Math.ceil(auto.length/2);
  const rows = [auto.slice(0,nTop), auto.slice(nTop)];
  const {x0,y0,x1,y1,w,h} = LOOP, CH = 150, SP = 52;
  rows.forEach((row, ri) => {
    const spacing = w / Math.max(1,row.length);
    row.forEach((st, i) => {
      st.w = Math.min(176, spacing-16); st.h = CH;
      const cx = x0 + spacing*(i+0.5);
      st.x = cx - st.w/2;
      if (ri === 0){ st.y = y0 - SP - CH; st.dock = { x:cx, y:st.y+CH }; st.port = { x:cx, y:y0, s:cx-x0 }; st.side='top'; }
      else { st.y = y1 + SP; st.dock = { x:cx, y:st.y }; st.port = { x:cx, y:y1, s:w+h+(x1-cx) }; st.side='bottom'; }
    });
  });
  const cy = (y0+y1)/2;
  list.filter(s => s.def.place==='warehouse').forEach(st => {
    st.x = WH.x; st.y = WH.y; st.w = WH.w; st.h = WH.h; const py = y1 - 6;
    st.dock = { x:WH.x+WH.w, y:py }; st.port = { x:x0, y:py, s:2*w+h+(y1-py) }; st.side = 'left'; st.key = 0; });
  left.forEach((st, i) => { st.w=160; st.h=CH; st.x = x0-SP-160; st.y = cy-CH/2 + i*(CH+20); st.dock={ x:st.x+st.w, y:st.y+CH/2 }; st.port={ x:x0, y:st.y+CH/2, s:2*w+h+(y1-(st.y+CH/2)) }; st.side='left'; });
  right.forEach((st, i) => { st.w=160; st.h=CH; st.x = x1+SP; st.y = cy-CH/2 + i*(CH+20); st.dock={ x:st.x, y:st.y+CH/2 }; st.port={ x:x1, y:st.y+CH/2, s:w+(st.y+CH/2-y0) }; st.side='right'; });
  // keyboard keys in reading order
  const ordered = [...left, ...rows[0], ...rows[1], ...right];
  ordered.forEach((st,i) => st.key = i+1);
  G.keyOrder = ordered;
}

function startShift(idx){
  G.shiftIdx = idx; G.cfg = shiftConfig(idx);
  G.stations = G.cfg.stations.filter(id => DEF[id]).map(id => makeStation(DEF[id]));
  G.st = Object.fromEntries(G.stations.map(s => [s.id, s]));
  layoutStations();
  Object.assign(G, { time:0, shipped:0, onTime:0, lateShip:0, wrong:0, defects:0, sat:100, orders:[], hus:[], floats:[], flyers:[],
    seq: 0, huSeq:0, nextSpawn:2, fetch:[], hoverOrder:null, selected:null, startMoney:G.money, earned:0, shippedLog:[], goalToast:false,
    truck:{ x:1210, load:0, state:'parked', t:0 } });
  G.convSpeed = 210 * (1 + 0.15*G.global.conveyor);
  G.mode = 'play';
}

const activeHas = id => !!G.st[id];
function pendingSteps(o){ return Object.keys(o.steps).filter(k => o.steps[k]==='todo'); }
function validTargets(hu){
  if (hu.kind === 'tote') return G.stations.filter(s => s.def.role==='storage');
  if (hu.flag) return G.stations.filter(s => s.def.role==='repair');
  const pend = pendingSteps(hu.order); if (!pend.length) return [];
  const minStage = Math.min(...pend.map(id => STEPS[id].stage));
  return G.stations.filter(s => s.def.handles && pend.includes(s.def.handles) && STEPS[s.def.handles].stage === minStage);
}
const hasRoom = st => st.queue.length + st.incoming < st.queueMax;
function selectable(hu){
  if (hu.gone) return false;
  if (hu.loc === 'out') return true;
  if (hu.loc === 'transit' && !hu.tr.feed) return hu.tr.to === null || hu.tr.d < hu.tr.portAt;
  return false;
}
function nextHint(hu){
  if (hu.kind === 'tote') return 'Shuttle Warehouse';
  if (hu.flag) return 'Quality Assurance';
  const t = validTargets(hu); return t.length ? t.map(s => s.def.name).join(' or ') : '—';
}

function makeOrder(){
  const cfg = G.cfg, n = randInt(cfg.items[0], cfg.items[1]);
  const pool = [...ITEMS], items = [];
  for (let i=0; i<n && pool.length; i++) items.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  const id = ++G.seq;
  const o = { id, num:4100 + id + G.shiftIdx*100, customer:pick(CUSTOMERS), items, focus:false, steps:{},
    created:G.time, color:ORDER_COLORS[id % ORDER_COLORS.length], released:false, shipped:false, late:false, hu:null };
  o.focus = activeHas('care') && Math.random() < 0.28;
  o.lines = items.map(item => ({ item, state:'stored', slot:freeRackSlot() }));
  let allow = cfg.slack;
  for (const [sid, s] of Object.entries(STEPS)){
    const stId = STEP_STATION[sid]; if (!stId || !activeHas(stId)) continue;
    if (s.want(o)){ o.steps[sid] = 'todo'; allow += DEF[stId].time + 6; }
  }
  allow += 4*o.lines.length;
  o.allow = Math.round(allow); o.due = G.time + o.allow;
  G.orders.push(o);
  sfx('order');
  if (G.cfg === SHIFTS[0] || G.shiftIdx === 0) tip('release', 'A new order arrived! Its totes are <b style="color:var(--accent)">glowing in the Shuttle Warehouse</b> (same colour as the order card). <b>Click each glowing tote</b> to send it to Commissioning.');
}

// Rack geometry of the shuttle warehouse (shared by drawing, hit-testing and retrieval)
const RACK = { aisles:2, levels:18, top:WH.y+52 };
RACK.aw = (WH.w-28)/RACK.aisles; RACK.lh = (WH.h-130)/RACK.levels;
function rackPos(sl){ const ax = WH.x+14 + sl.a*RACK.aw, rw = RACK.aw*0.34;
  return { x: ax + sl.side*(RACK.aw*0.62) + 2 + rw/2, y: RACK.top + sl.l*RACK.lh + (RACK.lh-3)/2 }; }
function freeRackSlot(){
  const used = new Set(); (G.orders||[]).forEach(o => (o.lines||[]).forEach(l => l.state==='stored' && used.add(l.slot.a+'-'+l.slot.l+'-'+l.slot.side)));
  for (let i=0; i<60; i++){ const sl = { a:randInt(0,RACK.aisles-1), l:randInt(0,RACK.levels-1), side:randInt(0,1) }; if (!used.has(sl.a+'-'+sl.l+'-'+sl.side)) return sl; }
  return { a:0, l:0, side:0 };
}
function linesDone(o){ return o.lines.filter(l => l.state==='atPick' || l.state==='picked').length; }
// Click on a glowing tote: the shuttle brings it to Commissioning. The first tote opens the order's HU there.
function retrieve(o, li){
  const line = o.lines[li]; if (!line || line.state !== 'stored' || G.mode !== 'play') return false;
  const c = G.st.commission;
  if (!o.hu){
    if (!hasRoom(c)){ toast('Commissioning is full. Wait for a free spot before starting a new order.', 'bad'); sfx('error'); return false; }
    o.released = true;
    const hu = { id:++G.huSeq, order:o, flag:null, loc:'queue' }; o.hu = hu; G.hus.push(hu); c.queue.push(hu);
  }
  line.state = 'retrieving';
  const p0 = rackPos(line.slot), liftX = WH.x+WH.w-24, cy = c.y + c.h/2;
  const path = mkPath([p0, { x:liftX, y:p0.y }, { x:liftX, y:cy }, { x:c.x+6, y:cy }], -1);
  G.fetch.push({ o, line, path });
  hideTip('release'); sfx('release'); return true;
}
function rackHit(p){
  if (p.x < WH.x || p.x > WH.x+WH.w || p.y < WH.y || p.y > WH.y+WH.h) return null;
  let best = null, bd = 1e9;
  for (const o of G.orders) o.lines.forEach((l, li) => { if (l.state !== 'stored') return; const q = rackPos(l.slot), d = Math.hypot(p.x-q.x, p.y-q.y); if (d < 24 && d < bd){ bd = d; best = { o, li }; } });
  return best;
}

function dispatch(hu, st){
  if (!selectable(hu) || G.mode !== 'play') return false;
  if (hu.loc === 'transit' && hu.tr.to === st.id) { G.selected = null; return true; }
  if (!hasRoom(st)){ toast(`${st.def.name} is full. Wait or choose another route.`, 'bad'); sfx('error'); return false; }
  if (hu.loc === 'out'){
    const from = G.stations.find(s => s.out.includes(hu));
    from.out.splice(from.out.indexOf(hu), 1);
    hu.tr = buildPath(from, 0, st);
  } else {
    if (hu.tr.to) G.st[hu.tr.to].incoming--;
    const p = along(hu.tr, hu.tr.d);
    hu.tr = buildPath(null, loopS(p.x, p.y), st);
  }
  hu.loc = 'transit'; st.incoming++;
  G.selected = null; sfx('dispatch'); hideTip('route'); if (hu.flag) hideTip('flag');
  return true;
}

function circle(hu, s){ hu.loc = 'transit'; hu.tr = buildPath(null, s, null); }

function portCheck(hu, st){
  let weightFail = false;
  if (hu.kind !== 'tote' && !hu.flag && st.def.role !== 'repair' && Math.random() < TRANSPORT_CHECK.chance){
    hu.flag = { reason:TRANSPORT_CHECK.reason, station:null }; weightFail = true; G.defects++;
    st.scanFlash = 1.2;
  }
  if (validTargets(hu).includes(st)) return true;
  st.incoming--;
  if (weightFail){
    toast(`⚖ #${hu.order.num}: weight check failed at ${st.def.name}. Route it to Quality Assurance.`, 'warn');
    sfx('flag'); event('flag');
  } else {
    G.wrong++; G.money -= 10; G.earned -= 10; changeSat(-3);
    const why = hu.kind === 'tote' ? 'return totes go back to the Shuttle Warehouse' : hu.flag ? 'it is flagged and must go to Quality Assurance first'
      : `next step is ${nextHint(hu)}`;
    toast(`✖ ${st.def.name} rejected ${hu.kind === 'tote' ? 'the return tote' : '#'+hu.order.num}: ${why}.`, 'bad');
    floatText(st.port.x, st.port.y-14, '−$10', '#ff5468'); sfx('error'); st.flash = -1;
    tip('wrong', 'Rejected! A station only accepts units that need it <b>next</b>. The unit now circles on the conveyor. <b>Click it on the belt</b> and send it somewhere else.');
  }
  circle(hu, st.port.s);
  return false;
}

function complete(st, hu){
  const d = st.def, o = hu.order;
  st.processed++;
  if (d.role === 'storage') return;
  if (d.role === 'repair'){
    const f = hu.flag; hu.flag = null;
    if (f && f.line != null){
      // wrong item: send the wrong tote back to storage, the order needs a fresh tote + a re-pick
      const line = o.lines[f.line]; line.state = 'stored'; line.slot = freeRackSlot();
      const tote = { id:++G.huSeq, kind:'tote', order:o, item:line.item, flag:null, loc:'out' };
      G.hus.push(tote);
      if (st.out.length < st.outMax){ st.out.push(tote); } else circle(tote, st.port.s);
      floatText(st.dock.x, st.y+10, 'Wrong tote found', '#ffc53d'); sfx('fix');
      tip('return', `QA found the wrong item. Two jobs now: 1) route the grey <b>↩ return tote</b> back to the <b>Shuttle Warehouse</b> (key <span class="kbd">0</span>), 2) click the order's new <b style="color:var(--accent)">glowing tote</b> in the warehouse and send HU <b>#${o.num}</b> back to <b>Commissioning</b> for a re-pick.`);
      return;
    }
    floatText(st.dock.x, st.y+10, 'Fixed ✓', '#3ddc84'); sfx('fix'); return;
  }
  const step = d.handles;
  let pickedNow = [];
  if (d.needsTotes){ o.lines.forEach((l, i) => { if (l.state === 'atPick'){ l.state = 'picked'; pickedNow.push(i); } }); }
  if (d.defect && Math.random() < d.defect.chance * st.qualMul){
    hu.flag = { reason:d.defect.reason, station:d.id }; G.defects++;
    if (d.defect.returnTote && pickedNow.length) hu.flag.line = pick(pickedNow);
    o.steps[step] = d.defect.redo ? 'todo' : 'done';
    toast(`⚠ #${o.num}: ${d.defect.reason} at ${d.name}. Send it to Quality Assurance.`, 'warn');
    sfx('flag'); event('flag');
  } else o.steps[step] = 'done';
}

function ship(hu){
  const o = hu.order; o.shipped = true; hu.gone = true;
  G.hus.splice(G.hus.indexOf(hu), 1); G.orders.splice(G.orders.indexOf(o), 1);
  if (G.selected === hu) G.selected = null;
  const services = Object.keys(o.steps).filter(k => k !== 'pick' && k !== 'pack').length;
  let pay = 40 + 25*services; if (o.focus) pay *= 1.5;
  const late = G.time > o.due;
  if (late){ pay *= 0.4; G.lateShip++; } else { G.onTime++; changeSat(+2); }
  if (!G.hints) pay *= 1.25;
  pay = Math.round(pay);
  G.money += pay; G.earned += pay; G.shipped++;
  G.shippedLog.unshift({ num:o.num, late, pay, color:o.color }); G.shippedLog.length = Math.min(G.shippedLog.length, 5);
  const pk = G.st.pack;
  floatText(pk.x+pk.w/2, pk.y-6, `+$${pay}`, late ? '#ffc53d' : '#3ddc84');
  G.flyers.push({ x0:pk.x+pk.w/2, y0:pk.y+pk.h, x1:G.truck.x-20, y1:640, t:0, color:o.color });
  sfx('ship'); event('ship');
  if (!G.goalToast && G.shipped >= G.cfg.goal){ G.goalToast = true; toast('🎯 Shift goal reached! Everything else is bonus.', 'good'); sfx('fix'); }
}

function isReady(st, hu){
  if (!st.def.needsTotes || hu.kind === 'tote') return true;
  const o = hu.order; return o.lines.every(l => l.state === 'atPick' || l.state === 'picked') && o.lines.some(l => l.state === 'atPick');
}
function removeObj(hu){ hu.gone = true; const i = G.hus.indexOf(hu); if (i >= 0) G.hus.splice(i, 1); if (G.selected === hu) G.selected = null; }
function changeSat(d){
  G.sat = clamp(G.sat + d, 0, 100);
  if (G.sat <= 0 && G.mode === 'play') endShift(true);
}

function update(dt){
  if (G.mode !== 'play') return;
  G.time += dt;
  const cfg = G.cfg;
  // spawn orders
  if (G.time >= G.nextSpawn && G.time < cfg.duration - 22){
    makeOrder(); G.nextSpawn = G.time + rand(cfg.spawn[0], cfg.spawn[1]);
  }
  // overdue
  for (const o of G.orders){
    if (!o.late && G.time > o.due){ o.late = true; changeSat(-6); toast(`⏰ Order #${o.num} for ${o.customer} is overdue!`, 'bad'); sfx('late'); }
  }
  // transport
  for (const hu of G.hus){
    if (hu.loc !== 'transit') continue;
    const tr = hu.tr;
    tr.d += G.convSpeed * (tr.speedMul||1) * dt;
    if (tr.to && !tr.checked && tr.portAt >= 0 && tr.d >= tr.portAt){
      tr.checked = true;
      if (!portCheck(hu, G.st[tr.to])) continue;
    }
    if (tr.d >= tr.len){
      if (tr.to){ const st = G.st[tr.to]; st.incoming--; st.queue.push(hu); hu.loc = 'queue'; hu.tr = null; sfx('clunk'); }
      else circle(hu, tr.loopS);
    }
  }
  // totes coming out of the shuttle warehouse
  for (const f of G.fetch){ f.path.d += RETRIEVE_SPEED*dt; if (f.path.d >= f.path.len){ f.line.state = 'atPick'; f.done = true; } }
  G.fetch = G.fetch.filter(f => !f.done);
  // stations
  for (const st of G.stations){
    st.flash = st.flash > 0 ? Math.max(0, st.flash - dt) : Math.min(0, st.flash + dt);
    st.scanFlash = Math.max(0, st.scanFlash - dt);
    for (let i=0; i<st.slotCount; i++){
      let s = st.slots[i];
      if (!s && st.queue.length){
        const qi = st.queue.findIndex(h => isReady(st, h));
        if (qi >= 0){ const hu = st.queue.splice(qi, 1)[0]; hu.loc = 'slot';
          let dur = st.def.time*st.speedMul*rand(0.88,1.12);
          if (st.def.needsTotes){ const o = hu.order; dur *= 0.45 + 0.55*o.lines.filter(l => l.state==='atPick').length/o.lines.length; }
          s = st.slots[i] = { hu, t:0, dur, done:false, blocked:false }; }
      }
      if (!s) continue;
      if (!s.done){ s.t += dt; if (s.t >= s.dur){ s.done = true; complete(st, s.hu); } }
      if (s.done){
        const hu = s.hu;
        if (st.def.role === 'storage'){ removeObj(hu); st.slots[i] = null; floatText(st.dock.x+20, st.dock.y-16, 'Stored ✓', '#3ddc84'); sfx('clunk'); }
        else if (st.def.role === 'sink' && hu.kind !== 'tote' && !hu.flag && !pendingSteps(hu.order).length){ ship(hu); st.slots[i] = null; }
        else if (st.outMax === 0){ st.slots[i] = null; circle(hu, st.port.s); }
        else if (st.out.length < st.outMax){

  if (tk.state === 'leaving'){ tk.x += 260*dt; if (tk.x > W + 200){ tk.state = 'arriving'; tk.x = W + 200; tk.load = 0; } }
  else if (tk.state === 'arriving'){ tk.x = Math.max(1210, tk.x - 260*dt); if (tk.x === 1210) tk.state = 'parked'; }

  G.floats = G.floats.filter(f => f.t < 1.4);
  if (G.selected && !selectable(G.selected)) G.selected = null;
  if (G.time >= cfg.duration) endShift(false);
}

function endShift(failedSat){
  if (G.mode !== 'play') return;
  G.mode = 'result'; G.selected = null;
  const cfg = G.cfg, passed = !failedSat && G.shipped >= cfg.goal;
  const ratio = G.shipped ? G.onTime / G.shipped : 0;
  let stars = 0;
  if (passed){ stars = 1; if (ratio >= 0.7) stars = 2; if (ratio >= 0.9 && G.sat >= 70) stars = 3; }
  let bonus = 0;
  if (passed){ bonus = 100 + 40*stars; G.money += bonus; G.best = Math.max(G.best||0, G.shiftIdx+1); }
  G.result = { passed, failedSat, stars, ratio, bonus };
  if (!G.silent){ tipQueue.length = 0; hideTip(null); sfx(passed ? 'fanfare' : 'fail'); showResult(); }
}

// Cards are kept as persistent DOM nodes and patched in place (no flicker, hover stays stable)
const cardEls = new Map();
function syncList(container, orders, inbox, emptyText){
  const keep = new Set();
  const els = orders.map(o => {
    const key = (inbox ? 'i' : 'a') + o.id; keep.add(key);
    let el = cardEls.get(key);
    if (!el){ el = document.createElement('div'); el.dataset.oid = o.id; cardEls.set(key, el); }
    const p = orderParts(o, inbox);
    const cls = p.cls + (el.classList.contains('shake') ? ' shake' : '');
    if (el.className !== cls) el.className = cls;
    if (el._html !== p.html){ el.innerHTML = p.html; el._html = p.html; el._due = el.querySelector('.due'); el._bar = el.querySelector('.tbar div'); }
    if (el._due.textContent !== p.due) el._due.textContent = p.due;
    el._due.style.color = p.col;
    el._bar.style.width = (p.frac*100).toFixed(1) + '%'; el._bar.style.background = p.col;
    return el;
  });
  if (!els.length){
    if (!container._empty){ container.innerHTML = `<div class="empty">${emptyText}</div>`; container._empty = true; }
  } else {
    if (container._empty){ container.innerHTML = ''; container._empty = false; }
    els.forEach((el, i) => { if (container.children[i] !== el) container.insertBefore(el, container.children[i] || null); });
    while (container.children.length > els.length) container.lastChild.remove();
  }
  for (const [k, el] of cardEls) if (k[0] === (inbox ? 'i' : 'a') && !keep.has(k)){ el.remove(); cardEls.delete(k); }

// ---------- tooltip ----------
function showTooltip(hu, cx, cy, rack){
  const tt = $('tooltip');
  if (!hu && !rack){ tt.style.display = 'none'; return; }
  if (rack || hu.kind === 'tote'){
    const o = rack ? rack.o : hu.order, item = rack ? o.lines[rack.li].item : hu.item;
    tt.innerHTML = rack
      ? `<div class="tt-h"><span style="width:10px;height:10px;border-radius:3px;background:${o.color}"></span>Tote for #${o.num}</div><div class="items"><i>${item.icon}</i> ${item.name}</div><div class="row next">▸ Click to send it to Commissioning</div><div class="row">${o.customer} · ${linesDone(o)}/${o.lines.length} totes at the pick station</div>`
      : `<div class="tt-h">↩ Return tote</div><div class="items"><i>${item.icon}</i> ${item.name} (wrong pick for #${o.num})</div><div class="row next">▸ Route it back to the Shuttle Warehouse</div>`;
    tt.style.display = 'block'; placeTooltip(tt, cx, cy); return;
  }
  const o = hu.order, pend = pendingSteps(o), nextIds = hu.flag ? [] : validTargets(hu).map(s => s.def.handles);
  const rows = Object.keys(o.steps).map(sid => {
    const done = o.steps[sid] === 'done', nx = nextIds.includes(sid);
    return `<div class="row ${done?'done':nx?'next':''}">${done?'✓':nx?'▸':'○'} ${STEPS[sid].label}</div>`; }).join('');
  const rem = o.due - G.time;
  tt.innerHTML = `<div class="tt-h"><span style="width:10px;height:10px;border-radius:3px;background:${o.color}"></span>#${o.num} · ${o.customer} ${o.focus?'<span style="color:var(--warn)">★ focus</span>':''}</div>
    <div class="items">${o.items.map(i => '<i>'+i.icon+'</i> '+i.name).join(', ')}</div>${rows}
    ${hu.flag ? `<div class="fl">⚠ ${hu.flag.reason} → Quality Assurance</div>` : ''}
    <div class="row" style="margin-top:4px">${rem<0 ? '<span style="color:var(--bad)">Overdue</span>' : `Due in ${Math.ceil(rem)}s`}</div>`;
  tt.style.display = 'block'; placeTooltip(tt, cx, cy);
}
function placeTooltip(tt, cx, cy){
  const r = floorEl.getBoundingClientRect(), tw = tt.offsetWidth, th = tt.offsetHeight;
  let lx = cx + 16, ly = cy + 16; if (lx + tw > r.width - 8) lx = cx - tw - 16; if (ly + th > r.height - 8) ly = cy - th - 16;
  tt.style.left = lx + 'px'; tt.style.top = ly + 'px';
}

// ---------- input ----------
function toWorld(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left - view.ox)/view.s, y:(e.clientY - r.top - view.oy)/view.s, cx:e.clientX - r.left, cy:e.clientY - r.top }; }
function hitHU(p){
  let best = null, bd = 1e9;
  for (const hu of G.hus){ if (!selectable(hu) || hu.px == null) continue;
    const dx = Math.abs(p.x - hu.px), dy = Math.abs(p.y - hu.py);
    if (dx < 19 && dy < 16){ const d = dx+dy; if (d < bd){ bd = d; best = hu; } } }
  return best;
}
function hitStation(p){ return G.stations.find(st => p.x >= st.x-6 && p.x <= st.x+st.w+6 && p.y >= st.y-12 && p.y <= st.y+st.h+6) || null; }
function selectHU(hu){ if (G.selected !== hu){ G.selected = hu; sfx('select'); } }
cv.addEventListener('pointerdown', e => {
  AU.init(); Music.start();
  if (G.mode !== 'play') return;
  const p = toWorld(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  const hu = hitHU(p);
  if (hu){ selectHU(hu); drag = { hu, x:p.x, y:p.y, moved:false }; cv.setPointerCapture(e.pointerId); return; }
  const st = hitStation(p);
  if (st && G.selected && (st.def.role !== 'storage' || G.selected.kind === 'tote')){ dispatch(G.selected, st); return; }
  const rk = rackHit(p);
  if (rk){ if (!retrieve(rk.o, rk.li)) G.selected = null; return; }
  if (st && G.selected){ dispatch(G.selected, st); return; }
  G.selected = null;
});
cv.addEventListener('pointermove', e => {
  const p = toWorld(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  if (drag && Math.hypot(p.x-drag.x, p.y-drag.y) > 8) drag.moved = true;
  hoverHU = drag ? null : hitHU(p); hoverSt = hitStation(p);
  hoverRack = (!hoverHU && !drag && G.mode === 'play') ? rackHit(p) : null;
  cv.style.cursor = hoverHU ? 'grab' : hoverRack ? 'pointer' : (G.selected && hoverSt) ? 'pointer' : drag ? 'grabbing' : 'default';
  showTooltip(hoverHU, p.cx, p.cy, hoverRack);
});
cv.addEventListener('pointerup', e => {
  if (drag && drag.moved){ const st = hitStation(toWorld(e)); if (st && G.selected === drag.hu) dispatch(drag.hu, st); }
  drag = null;
});
cv.addEventListener('pointerleave', () => { mouse.inside = false; hoverHU = null; hoverSt = null; hoverRack = null; showTooltip(null); });
cv.addEventListener('contextmenu', e => { e.preventDefault(); G.selected = null; });
$('side').addEventListener('pointerdown', e => {
  AU.init(); Music.start();
  const card = e.target.closest('.oc'); if (!card) return;
  const o = G.orders.find(o => o.id === +card.dataset.oid); if (!o) return;
  if (o.lines.some(l => l.state === 'stored')){ o.flashT = G.time + 2; sfx('select');
    if (!G.seenTips.findTotes){ G.seenTips.findTotes = true; toast('👉 Click the order\'s glowing totes in the Shuttle Warehouse.', ''); } }
});
$('side').addEventListener('pointerover', e => { const card = e.target.closest('.oc'); G.hoverOrder = card ? +card.dataset.oid : null; });
$('side').addEventListener('pointerleave', () => { G.hoverOrder = null; });
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ' ){ e.preventDefault(); togglePause(); return; }
  if (k === 'escape'){ if (G.selected) G.selected = null; else if (G.mode === 'play' || G.mode === 'paused') togglePause(); return; }
  if (k === 'h'){ toggleHints(); return; }
  if (k === 'm'){ toggleMusic(); return; }
  if (k === 's'){ toggleSfx(); return; }
  if (k === 'f'){ toggleSpeed(); return; }
  if (G.mode !== 'play') return;
  if (k === 'tab'){ e.preventDefault(); cycleSelect(e.shiftKey ? -1 : 1); return; }
  const n = parseInt(k, 10);
  if (n === 0 && G.selected && G.st.warehouse){ dispatch(G.selected, G.st.warehouse); return; }
  if (n >= 1 && n <= 9 && G.selected){ const st = G.keyOrder[n-1]; if (st) dispatch(G.selected, st); }

function cycleSelect(dir){
  const list = G.hus.filter(selectable).sort((a,b) => a.order.due - b.order.due);

}

// ===================================================================
//  MAIN LOOP
// ===================================================================
let last = performance.now(), sideTimer = 0;
function frame(now){
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - last)/1000); last = now;
  const dt = realDt * (G.speed || 1);
  if (G.mode === 'play'){ update(dt); Music.intensity = clamp(0.2 + G.orders.length*0.09 + (G.time/G.cfg.duration)*0.25, 0, 1); }
  try { render(now/1000); } catch(e){ console.error(e); }
  sideTimer -= realDt;
  if (sideTimer <= 0 && (G.mode === 'play' || G.mode === 'intro')){ sideTimer = 0.2; renderSide(); renderHUD(); }
  if (hoverHU && !selectable(hoverHU)){ hoverHU = null; showTooltip(null); }
}
['touchend','click','keydown'].forEach(ev => document.addEventListener(ev, () => { AU.init(); if (AU.ctx && AU.ctx.state !== 'running') AU.ctx.resume(); }, { passive:true }));
if (window.ResizeObserver) new ResizeObserver(resize).observe(floorEl);
resize(); syncButtons(); showTitle(); requestAnimationFrame(frame);

// ---------- test / automation hooks ----------
window.LT = { G, STATIONS, STEPS, SHIFTS, startShift, update, validTargets, dispatch, retrieve, selectable, hasRoom, endShift,
  simulate(seconds, policy, dt=1/30){ const s = G.silent; G.silent = true; let t = 0; while (t < seconds && G.mode === 'play'){ policy && policy(G, dt); update(dt); t += dt; } G.silent = s; return G; } };
</script>
